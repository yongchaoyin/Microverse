<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 猫咪身体 -->
  <ellipse cx="100" cy="130" rx="45" ry="35" fill="#FF8C42" stroke="#E67E22" stroke-width="2"/>
  
  <!-- 猫咪头部 -->
  <circle cx="100" cy="80" r="40" fill="#FF8C42" stroke="#E67E22" stroke-width="2"/>
  
  <!-- 猫咪耳朵 -->
  <polygon points="75,50 85,25 95,50" fill="#FF8C42" stroke="#E67E22" stroke-width="2"/>
  <polygon points="105,50 115,25 125,50" fill="#FF8C42" stroke="#E67E22" stroke-width="2"/>
  
  <!-- 耳朵内部 -->
  <polygon points="78,47 83,32 88,47" fill="#FFB74D"/>
  <polygon points="112,47 117,32 122,47" fill="#FFB74D"/>
  
  <!-- 猫咪眼睛 -->
  <ellipse cx="88" cy="75" rx="8" ry="12" fill="#2E7D32"/>
  <ellipse cx="112" cy="75" rx="8" ry="12" fill="#2E7D32"/>
  
  <!-- 眼睛高光 -->
  <ellipse cx="90" cy="72" rx="3" ry="4" fill="#FFFFFF"/>
  <ellipse cx="114" cy="72" rx="3" ry="4" fill="#FFFFFF"/>
  
  <!-- 猫咪鼻子 -->
  <polygon points="100,85 95,90 105,90" fill="#E91E63"/>
  
  <!-- 猫咪嘴巴 -->
  <path d="M 100 92 Q 92 98 85 95" stroke="#424242" stroke-width="2" fill="none"/>
  <path d="M 100 92 Q 108 98 115 95" stroke="#424242" stroke-width="2" fill="none"/>
  
  <!-- 猫咪胡须 -->
  <line x1="60" y1="80" x2="75" y2="82" stroke="#424242" stroke-width="1.5"/>
  <line x1="60" y1="88" x2="75" y2="88" stroke="#424242" stroke-width="1.5"/>
  <line x1="125" y1="82" x2="140" y2="80" stroke="#424242" stroke-width="1.5"/>
  <line x1="125" y1="88" x2="140" y2="88" stroke="#424242" stroke-width="1.5"/>
  
  <!-- 猫咪尾巴 -->
  <path d="M 145 140 Q 170 120 175 90 Q 180 70 170 50" stroke="#FF8C42" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- 猫咪爪子 -->
  <ellipse cx="75" cy="160" rx="8" ry="12" fill="#FF8C42"/>
  <ellipse cx="95" cy="160" rx="8" ry="12" fill="#FF8C42"/>
  <ellipse cx="105" cy="160" rx="8" ry="12" fill="#FF8C42"/>
  <ellipse cx="125" cy="160" rx="8" ry="12" fill="#FF8C42"/>
  
  <!-- 爪子细节 -->
  <ellipse cx="75" cy="165" rx="6" ry="8" fill="#FFB74D"/>
  <ellipse cx="95" cy="165" rx="6" ry="8" fill="#FFB74D"/>
  <ellipse cx="105" cy="165" rx="6" ry="8" fill="#FFB74D"/>
  <ellipse cx="125" cy="165" rx="6" ry="8" fill="#FFB74D"/>
  
  <!-- 身体条纹 -->
  <ellipse cx="85" cy="125" rx="3" ry="15" fill="#E67E22" opacity="0.6"/>
  <ellipse cx="100" cy="120" rx="3" ry="18" fill="#E67E22" opacity="0.6"/>
  <ellipse cx="115" cy="125" rx="3" ry="15" fill="#E67E22" opacity="0.6"/>
</svg>