<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background for demonstration -->
  <rect width="64" height="64" fill="#001122" opacity="0.3"/>
  
  <!-- Main floating object (crystal) -->
  <g id="floatingCrystal">
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0,0; 0,-4; 0,0; 0,2; 0,0" 
      dur="4s" 
      repeatCount="indefinite"/>
    
    <!-- Crystal shadow -->
    <ellipse cx="32" cy="50" rx="8" ry="3" fill="#000000" opacity="0.3">
      <animate attributeName="rx" values="8;6;8;10;8" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.2;0.3;0.4;0.3" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    
    <!-- Crystal body -->
    <path d="M 32 20 L 40 30 L 36 45 L 28 45 L 24 30 Z" fill="#87CEEB"/>
    <path d="M 32 20 L 40 30 L 36 45 L 28 45 L 24 30 Z" fill="#B0E0E6" opacity="0.8"/>
    
    <!-- Crystal facets -->
    <path d="M 32 20 L 36 30 L 32 35 Z" fill="#E0F6FF"/>
    <path d="M 32 20 L 28 30 L 32 35 Z" fill="#F0F8FF"/>
    <path d="M 32 35 L 36 45 L 28 45 Z" fill="#DDEEFF"/>
    
    <!-- Crystal highlights -->
    <path d="M 30 25 L 32 20 L 34 25 L 32 30 Z" fill="#FFFFFF" opacity="0.8"/>
    <ellipse cx="30" cy="35" rx="2" ry="4" fill="#FFFFFF" opacity="0.6"/>
    
    <!-- Crystal glow -->
    <path d="M 32 20 L 40 30 L 36 45 L 28 45 L 24 30 Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="1" 
          opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Floating particles around the crystal -->
  <g id="floatingParticles">
    <!-- Particle 1 -->
    <circle cx="20" cy="25" r="1.5" fill="#FFD700" opacity="0.8">
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="0,0; 2,-3; 0,0; -1,2; 0,0" 
        dur="3s" 
        repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Particle 2 -->
    <circle cx="44" cy="30" r="1" fill="#87CEEB" opacity="0.7">
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="0,0; -2,-2; 0,0; 1,3; 0,0" 
        dur="3.5s" 
        repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Particle 3 -->
    <circle cx="18" cy="40" r="1.2" fill="#98FB98" opacity="0.6">
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="0,0; 3,-1; 0,0; -2,2; 0,0" 
        dur="4.5s" 
        repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Particle 4 -->
    <circle cx="46" cy="42" r="0.8" fill="#DDA0DD" opacity="0.9">
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="0,0; -1,-4; 0,0; 2,1; 0,0" 
        dur="2.8s" 
        repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Floating sparkles -->
  <g id="floatingSparkles">
    <!-- Sparkle 1 -->
    <g transform="translate(25,20)">
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="25,20; 27,16; 25,20; 23,22; 25,20" 
        dur="5s" 
        repeatCount="indefinite"/>
      
      <line x1="-2" y1="0" x2="2" y2="0" stroke="#FFFFFF" stroke-width="0.8" opacity="0.7"/>
      <line x1="0" y1="-2" x2="0" y2="2" stroke="#FFFFFF" stroke-width="0.8" opacity="0.7"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite"/>
    </g>
    
    <!-- Sparkle 2 -->
    <g transform="translate(39,22)">
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="39,22; 37,18; 39,22; 41,24; 39,22" 
        dur="4.2s" 
        repeatCount="indefinite"/>
      
      <line x1="-1.5" y1="0" x2="1.5" y2="0" stroke="#FFD700" stroke-width="0.6" opacity="0.8"/>
      <line x1="0" y1="-1.5" x2="0" y2="1.5" stroke="#FFD700" stroke-width="0.6" opacity="0.8"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.8s" repeatCount="indefinite"/>
    </g>
    
    <!-- Sparkle 3 -->
    <g transform="translate(22,45)">
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="22,45; 24,41; 22,45; 20,47; 22,45" 
        dur="3.7s" 
        repeatCount="indefinite"/>
      
      <line x1="-1" y1="0" x2="1" y2="0" stroke="#87CEEB" stroke-width="0.5" opacity="0.6"/>
      <line x1="0" y1="-1" x2="0" y2="1" stroke="#87CEEB" stroke-width="0.5" opacity="0.6"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.5s" repeatCount="indefinite"/>
    </g>
  </g>
  
  <!-- Floating energy wisps -->
  <g id="floatingWisps">
    <!-- Wisp 1 -->
    <path d="M 15 35 Q 18 32 20 35 Q 22 38 18 40 Q 15 38 15 35" 
          fill="#98FB98" 
          opacity="0.4">
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="0,0; 3,-2; 0,0; -2,3; 0,0" 
        dur="6s" 
        repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <!-- Wisp 2 -->
    <path d="M 45 25 Q 48 22 50 25 Q 52 28 48 30 Q 45 28 45 25" 
          fill="#DDA0DD" 
          opacity="0.5">
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="0,0; -2,-3; 0,0; 1,2; 0,0" 
        dur="5.5s" 
        repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Rotating elements -->
  <g id="rotatingElements">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 32 32; 360 32 32" 
      dur="20s" 
      repeatCount="indefinite"/>
    
    <!-- Small orbiting particles -->
    <circle cx="50" cy="32" r="0.8" fill="#FFD700" opacity="0.6"/>
    <circle cx="14" cy="32" r="0.6" fill="#87CEEB" opacity="0.5"/>
    <circle cx="32" cy="14" r="0.7" fill="#98FB98" opacity="0.4"/>
    <circle cx="32" cy="50" r="0.5" fill="#DDA0DD" opacity="0.7"/>
  </g>
  
  <!-- Pulsing aura -->
  <circle cx="32" cy="32" r="25" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="0.5" 
          opacity="0.2">
    <animate attributeName="r" values="25;30;25" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.05;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>