  <rect x="5" y="2" width="1" height="1" fill="#66BB6A"/>
  <rect x="8" y="1" width="1" height="1" fill="#66BB6A"/>
  <rect x="11" y="3" width="1" height="1" fill="#66BB6A"/>
  <rect x="14" y="2" width="1" height="1" fill="#66BB6A"/>
  
  <!-- 悬崖岩石面 -->
  <rect x="0" y="6" width="16" height="6" fill="#795548"/>
  
  <!-- 岩石纹理 -->
  <rect x="1" y="7" width="1" height="1" fill="#8D6E63"/>
  <rect x="3" y="8" width="1" height="1" fill="#8D6E63"/>
  <rect x="6" y="7" width="1" height="1" fill="#8D6E63"/>
  <rect x="9" y="9" width="1" height="1" fill="#8D6E63"/>
  <rect x="12" y="8" width="1" height="1" fill="#8D6E63"/>
  <rect x="15" y="7" width="1" height="1" fill="#8D6E63"/>
  
  <rect x="0" y="10" width="1" height="1" fill="#8D6E63"/>
  <rect x="4" y="11" width="1" height="1" fill="#8D6E63"/>
  <rect x="7" y="10" width="1" height="1" fill="#8D6E63"/>
  <rect x="11" y="11" width="1" height="1" fill="#8D6E63"/>
  <rect x="14" y="10" width="1" height="1" fill="#8D6E63"/>
  
