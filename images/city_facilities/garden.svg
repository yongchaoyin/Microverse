  <line x1="65" y1="79" x2="65" y2="81" stroke="#000000" stroke-width="0.3"/>
  
  <ellipse cx="145" cy="95" rx="1.5" ry="1" fill="#FFD700"/>
  <line x1="144" y1="95" x2="146" y2="95" stroke="#000000" stroke-width="0.3"/>
