  <rect x="98" y="85" width="4" height="8" fill="#C0C0C0" stroke="#A9A9A9" stroke-width="0.5"/>
  <circle cx="100" cy="85" r="2" fill="#87CEEB" opacity="0.6"/>
  
  <!-- Water droplets from sprinkler -->
  <circle cx="95" cy="82" r="0.5" fill="#87CEEB" opacity="0.8"/>
  <circle cx="105" cy="83" r="0.5" fill="#87CEEB" opacity="0.8"/>
  <circle cx="92" cy="85" r="0.5" fill="#87CEEB" opacity="0.8"/>
  <circle cx="108" cy="84" r="0.5" fill="#87CEEB" opacity="0.8"/>
  
