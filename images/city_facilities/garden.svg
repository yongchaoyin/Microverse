  <circle cx="40" cy="65" r="3" fill="#FF69B4"/>
  <circle cx="50" cy="67" r="3" fill="#FF1493"/>
  <circle cx="60" cy="65" r="3" fill="#FFB6C1"/>
  <circle cx="70" cy="68" r="3" fill="#FFC0CB"/>
  <circle cx="80" cy="66" r="3" fill="#FF6347"/>
