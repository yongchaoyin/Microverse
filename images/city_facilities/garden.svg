  <circle cx="130" cy="122" r="3" fill="#00BFFF"/>
  <circle cx="140" cy="120" r="3" fill="#87CEEB"/>
  <circle cx="150" cy="123" r="3" fill="#87CEFA"/>
  <circle cx="160" cy="121" r="3" fill="#B0E0E6"/>
