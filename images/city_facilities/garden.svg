  <!-- Top left stems -->
  <line x1="40" y1="68" x2="40" y2="85" stroke="#228B22" stroke-width="1"/>
  <line x1="50" y1="70" x2="50" y2="85" stroke="#228B22" stroke-width="1"/>
  <line x1="60" y1="68" x2="60" y2="85" stroke="#228B22" stroke-width="1"/>
  <line x1="70" y1="71" x2="70" y2="85" stroke="#228B22" stroke-width="1"/>
  <line x1="80" y1="69" x2="80" y2="85" stroke="#228B22" stroke-width="1"/>
  
  <!-- Top right stems -->
