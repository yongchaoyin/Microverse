  <text x="175" y="186" text-anchor="middle" font-family="Arial" font-size="4" fill="#000000">GARDEN</text>
  
  <!-- Garden bench -->
  <rect x="35" y="175" width="25" height="6" fill="#8B4513" stroke="#654321" stroke-width="1" rx="1"/>
  <rect x="37" y="177" width="21" height="2" fill="#A0522D"/>
  <rect x="39" y="181" width="3" height="8" fill="#654321"/>
  <rect x="54" y="181" width="3" height="8" fill="#654321"/>
  
  <!-- Small decorative elements -->
  <!-- Ladybugs -->
  <circle cx="55" cy="72" r="1" fill="#FF0000"/>
  <circle cx="55" cy="72" r="0.5" fill="#000000" opacity="0.3"/>
  
  <circle cx="135" cy="127" r="1" fill="#FF0000"/>
  <circle cx="135" cy="127" r="0.5" fill="#000000" opacity="0.3"/>
  
  <!-- Garden stepping stones -->
  <circle cx="100" cy="70" r="4" fill="#A9A9A9" stroke="#696969" stroke-width="0.5"/>
  <circle cx="100" cy="125" r="4" fill="#A9A9A9" stroke="#696969" stroke-width="0.5"/>
  <circle cx="70" cy="100" r="4" fill="#A9A9A9" stroke="#696969" stroke-width="0.5"/>
  <circle cx="130" cy="100" r="4" fill="#A9A9A9" stroke="#696969" stroke-width="0.5"/>
</svg>