  <ellipse cx="26" cy="148" rx="3" ry="2" fill="#C0C0C0" stroke="#A9A9A9" stroke-width="0.5"/>
  
  <!-- Garden hose -->
  <path d="M 180 170 Q 160 175 140 170 Q 120 165 100 170" 
        fill="none" stroke="#228B22" stroke-width="4"/>
  <circle cx="180" cy="170" r="3" fill="#C0C0C0"/>
  <circle cx="100" cy="170" r="2" fill="#FFD700"/>
  
  <!-- Butterflies -->
  <ellipse cx="85" cy="70" rx="2" ry="1" fill="#FFD700" opacity="0.8"/>
