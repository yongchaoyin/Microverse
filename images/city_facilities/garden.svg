  <line x1="86" y1="69" x2="86" y2="71" stroke="#000000" stroke-width="0.5"/>
  
  <ellipse cx="125" cy="85" rx="2" ry="1" fill="#FF69B4" opacity="0.8"/>
  <ellipse cx="127" cy="85" rx="2" ry="1" fill="#FF1493" opacity="0.8"/>
  <line x1="126" y1="84" x2="126" y2="86" stroke="#000000" stroke-width="0.5"/>
  
