  <!-- Table top wood planks -->
  <line x1="50" y1="130" x2="150" y2="130" stroke="#654321" stroke-width="1" opacity="0.6"/>
  <line x1="50" y1="140" x2="150" y2="140" stroke="#654321" stroke-width="1" opacity="0.6"/>
  <line x1="50" y1="150" x2="150" y2="150" stroke="#654321" stroke-width="1" opacity="0.6"/>
  
  <!-- Table legs -->
  <!-- Front left leg -->
  <rect x="60" y="160" width="8" height="25" fill="#8B4513" stroke="#654321" stroke-width="1"/>
