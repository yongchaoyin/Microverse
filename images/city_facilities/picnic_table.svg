  <circle cx="80" cy="135" r="8" fill="#FFFFFF" stroke="#D3D3D3" stroke-width="1"/>
  <circle cx="80" cy="135" r="6" fill="#F5F5F5"/>
  <circle cx="120" cy="145" r="8" fill="#FFFFFF" stroke="#D3D3D3" stroke-width="1"/>
  <circle cx="120" cy="145" r="6" fill="#F5F5F5"/>
  
  <!-- Food on plates -->
  <circle cx="78" cy="133" r="3" fill="#FF6347"/>
  <circle cx="82" cy="137" r="2.5" fill="#32CD32"/>
  <circle cx="118" cy="143" r="3" fill="#FFD700"/>
