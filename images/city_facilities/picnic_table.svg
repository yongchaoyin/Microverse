  <rect x="140" y="125" width="3" height="10" fill="#FF0000" stroke="#8B0000" stroke-width="0.3" rx="0.5"/>
  <rect x="145" y="125" width="3" height="10" fill="#FFFF00" stroke="#FFD700" stroke-width="0.3" rx="0.5"/>
  
  <!-- Wood grain details -->
  <line x1="55" y1="125" x2="145" y2="125" stroke="#654321" stroke-width="0.5" opacity="0.4"/>
  <line x1="55" y1="135" x2="145" y2="135" stroke="#654321" stroke-width="0.5" opacity="0.4"/>
  <line x1="55" y1="145" x2="145" y2="145" stroke="#654321" stroke-width="0.5" opacity="0.4"/>
  <line x1="55" y1="155" x2="145" y2="155" stroke="#654321" stroke-width="0.5" opacity="0.4"/>
  
  <!-- Bench wood grain -->
  <line x1="35" y1="170" x2="105" y2="170" stroke="#654321" stroke-width="0.4" opacity="0.4"/>
  <line x1="95" y1="170" x2="165" y2="170" stroke="#654321" stroke-width="0.4" opacity="0.4"/>
  
  <!-- Screws and bolts -->
  <circle cx="58" cy="128" r="1" fill="#C0C0C0"/>
  <circle cx="142" cy="128" r="1" fill="#C0C0C0"/>
  <circle cx="58" cy="152" r="1" fill="#C0C0C0"/>
  <circle cx="142" cy="152" r="1" fill="#C0C0C0"/>
  
  <!-- Bench screws -->
  <circle cx="38" cy="170" r="0.8" fill="#C0C0C0"/>
  <circle cx="102" cy="170" r="0.8" fill="#C0C0C0"/>
  <circle cx="98" cy="170" r="0.8" fill="#C0C0C0"/>
  <circle cx="162" cy="170" r="0.8" fill="#C0C0C0"/>
  
  <!-- Surrounding environment -->
  <!-- Grass patches -->
  <ellipse cx="40" cy="185" rx="15" ry="5" fill="#228B22"/>
  <ellipse cx="160" cy="185" rx="15" ry="5" fill="#228B22"/>
  <ellipse cx="100" cy="195" rx="20" ry="4" fill="#32CD32"/>
  
  <!-- Small flowers -->
  <circle cx="35" cy="183" r="1.5" fill="#FF69B4"/>
  <circle cx="45" cy="182" r="1.2" fill="#FF1493"/>
  <circle cx="155" cy="183" r="1.5" fill="#FFB6C1"/>
  <circle cx="165" cy="182" r="1.2" fill="#FFC0CB"/>
  
  <!-- Ants on table (small detail) -->
  <circle cx="75" cy="140" r="0.5" fill="#000000"/>
  <circle cx="125" cy="150" r="0.5" fill="#000000"/>
  <circle cx="85" cy="145" r="0.4" fill="#000000"/>
  
  <!-- Table nameplate -->
  <rect x="75" y="190" width="50" height="6" fill="#8B4513" stroke="#654321" stroke-width="0.5"/>
  <text x="100" y="194" text-anchor="middle" font-family="Arial" font-size="5" fill="#FFFFFF">PICNIC TABLE</text>
  
  <!-- Shadow under table -->
  <ellipse cx="100" cy="185" rx="60" ry="8" fill="#000000" opacity="0.1"/>
