  <!-- Bench legs -->
  <!-- Left bench legs -->
  <rect x="40" y="177" width="6" height="15" fill="#8B4513" stroke="#654321" stroke-width="0.8"/>
  <rect x="94" y="177" width="6" height="15" fill="#8B4513" stroke="#654321" stroke-width="0.8"/>
  
  <!-- Right bench legs -->
  <rect x="100" y="177" width="6" height="15" fill="#8B4513" stroke="#654321" stroke-width="0.8"/>
  <rect x="154" y="177" width="6" height="15" fill="#8B4513" stroke-width="0.8"/>
  
  <!-- Bench support beams -->
  <rect x="45" y="185" width="50" height="4" fill="#654321"/>
  <rect x="105" y="185" width="50" height="4" fill="#654321"/>
  
  <!-- Table items -->
  <!-- Picnic basket -->
  <rect x="110" y="110" width="20" height="12" fill="#8B4513" stroke="#654321" stroke-width="1" rx="2"/>
  <rect x="112" y="112" width="16" height="8" fill="#D2B48C" rx="1"/>
  <rect x="118" y="108" width="8" height="4" fill="#8B4513" rx="1"/>
  
