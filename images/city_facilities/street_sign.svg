<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="32" cy="58" rx="8" ry="2" fill="#000000" opacity="0.2"/>
  
  <!-- Base -->
  <rect x="30" y="54" width="4" height="4" fill="#2F4F4F"/>
  <rect x="28" y="56" width="8" height="2" fill="#708090"/>
  
  <!-- Pole -->
  <rect x="31" y="20" width="2" height="34" fill="#2F4F4F"/>
  
  <!-- Main street sign -->
  <rect x="16" y="12" width="32" height="8" fill="#228B22"/>
  <rect x="16" y="12" width="32" height="1" fill="#32CD32"/>
  
  <!-- Street name -->
  <text x="32" y="17" text-anchor="middle" font-family="Arial" font-size="3" font-weight="bold" fill="#FFFFFF">MAIN STREET</text>
  
  <!-- Direction arrow -->
  <polygon points="44,16 48,16 46,14 46,18" fill="#FFFFFF"/>
  
  <!-- Secondary sign -->
  <rect x="20" y="22" width="24" height="6" fill="#4169E1"/>
  <rect x="20" y="22" width="24" height="1" fill="#6495ED"/>
  
  <!-- Secondary street name -->
  <text x="32" y="26" text-anchor="middle" font-family="Arial" font-size="2.5" font-weight="bold" fill="#FFFFFF">OAK AVE</text>
  
  <!-- Direction arrow for secondary -->
  <polygon points="18,25 16,25 17,23 17,27" fill="#FFFFFF"/>
  
  <!-- Stop sign -->
  <polygon points="50,30 54,32 54,38 50,40 46,38 46,32" fill="#FF0000"/>
  <text x="50" y="36" text-anchor="middle" font-family="Arial" font-size="2.5" font-weight="bold" fill="#FFFFFF">STOP</text>
  
  <!-- Speed limit sign -->
  <rect x="12" y="30" width="8" height="10" fill="#FFFFFF"/>
  <rect x="12" y="30" width="8" height="1" fill="#E0E0E0"/>
  <rect x="12" y="30" width="8" height="10" fill="none" stroke="#000000" stroke-width="0.5"/>
  
  <text x="16" y="33" text-anchor="middle" font-family="Arial" font-size="1.5" font-weight="bold" fill="#000000">SPEED</text>
  <text x="16" y="34.5" text-anchor="middle" font-family="Arial" font-size="1.5" font-weight="bold" fill="#000000">LIMIT</text>
  <text x="16" y="37.5" text-anchor="middle" font-family="Arial" font-size="4" font-weight="bold" fill="#000000">25</text>
  
  <!-- One way sign -->
  <rect x="34" y="42" width="16" height="4" fill="#000000"/>
  <rect x="34" y="42" width="16" height="0.5" fill="#333333"/>
  
  <text x="42" y="44.5" text-anchor="middle" font-family="Arial" font-size="2" font-weight="bold" fill="#FFFFFF">ONE WAY</text>
  <polygon points="46,44 50,44 48,42.5 48,45.5" fill="#FFFFFF"/>
  
  <!-- No parking sign -->
  <circle cx="18" cy="44" r="4" fill="#FFFFFF"/>
  <circle cx="18" cy="44" r="4" fill="none" stroke="#FF0000" stroke-width="1"/>
  <rect x="16" y="42" width="4" height="1" fill="#000000"/>
  <rect x="15" y="43" width="6" height="2" fill="#000000"/>
  <line x1="15" y1="41" x2="21" y2="47" stroke="#FF0000" stroke-width="1"/>
  
  <!-- Mounting brackets -->
  <rect x="30" y="20" width="4" height="1" fill="#2F4F4F"/>
  <rect x="30" y="28" width="4" height="1" fill="#2F4F4F"/>
  <rect x="30" y="46" width="4" height="1" fill="#2F4F4F"/>
  
  <!-- Reflective strips -->
  <rect x="16" y="19" width="32" height="0.5" fill="#FFFF00"/>
  <rect x="20" y="27" width="24" height="0.5" fill="#FFFF00"/>
  
  <!-- Ground plate -->
  <rect x="28" y="56" width="8" height="1" fill="#A0A0A0"/>
  
  <!-- Bolts -->
  <circle cx="29" cy="56.5" r="0.3" fill="#2F4F4F"/>
  <circle cx="35" cy="56.5" r="0.3" fill="#2F4F4F"/>
  
  <!-- Small decorative elements -->
  <circle cx="12" cy="54" r="1" fill="#228B22"/>
  <circle cx="52" cy="54" r="1" fill="#228B22"/>
  <circle cx="13" cy="55" r="0.3" fill="#FF69B4"/>
  <circle cx="51" cy="55" r="0.3" fill="#FF69B4"/>
  
  <!-- Pole segments -->
  <rect x="30.5" y="30" width="3" height="0.5" fill="#708090"/>
  <rect x="30.5" y="40" width="3" height="0.5" fill="#708090"/>
</svg>