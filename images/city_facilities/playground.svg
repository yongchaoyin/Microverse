  <!-- Children playing (silhouettes) -->
  <circle cx="30" cy="46" r="1" fill="#333333"/>
  <rect x="29.5" y="47" width="1" height="2" fill="#333333"/>
  <rect x="29" y="49" width="2" height="1" fill="#333333"/>
  
  <circle cx="50" cy="48" r="1" fill="#333333"/>
  <rect x="49.5" y="49" width="1" height="2" fill="#333333"/>
  <rect x="49" y="51" width="2" height="1" fill="#333333"/>
  
  <!-- Decorative flowers -->
  <circle cx="6" cy="56" r="0.5" fill="#FF69B4"/>
  <circle cx="58" cy="56" r="0.5" fill="#FF69B4"/>
  <circle cx="32" cy="56" r="0.5" fill="#FFFF00"/>
