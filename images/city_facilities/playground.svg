  <rect x="22" y="8" width="2" height="12" fill="#8B4513"/>
  <rect x="12" y="8" width="12" height="2" fill="#A0522D"/>
  
  <!-- Monkey bar rungs -->
  <g stroke="#A0522D" stroke-width="1">
    <line x1="14" y1="10" x2="22" y2="10"/>
    <line x1="15" y1="10" x2="15" y2="8"/>
    <line x1="17" y1="10" x2="17" y2="8"/>
    <line x1="19" y1="10" x2="19" y2="8"/>
    <line x1="21" y1="10" x2="21" y2="8"/>
  </g>
  
