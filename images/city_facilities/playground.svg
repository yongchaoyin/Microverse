  <rect x="12" y="39" width="2" height="2" fill="#8B4513"/>
  <rect x="22" y="39" width="2" height="2" fill="#8B4513"/>
  <rect x="17" y="34" width="2" height="2" fill="#8B4513"/>
  <rect x="17" y="44" width="2" height="2" fill="#8B4513"/>
  
