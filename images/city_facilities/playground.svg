    <line x1="6" y1="28" x2="11" y2="28"/>
    <line x1="6" y1="32" x2="11" y2="32"/>
    <line x1="6" y1="36" x2="11" y2="36"/>
    <line x1="6" y1="40" x2="11" y2="40"/>
    <line x1="6" y1="44" x2="11" y2="44"/>
