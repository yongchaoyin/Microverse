  <line x1="32" y1="18" x2="32" y2="40" stroke="#333333" stroke-width="0.5"/>
  <rect x="29" y="40" width="2" height="1" fill="#8B4513"/>
  
  <line x1="36" y1="18" x2="36" y2="42" stroke="#333333" stroke-width="0.5"/>
