    <line x1="8" y1="50" x2="8" y2="54"/>
    <line x1="12" y1="50" x2="12" y2="54"/>
    <line x1="16" y1="50" x2="16" y2="54"/>
    <line x1="20" y1="50" x2="20" y2="54"/>
    <line x1="24" y1="50" x2="24" y2="54"/>
    <line x1="28" y1="50" x2="28" y2="54"/>
    <line x1="32" y1="50" x2="32" y2="54"/>
    <line x1="36" y1="50" x2="36" y2="54"/>
    <line x1="40" y1="50" x2="40" y2="54"/>
    <line x1="44" y1="50" x2="44" y2="54"/>
    <line x1="48" y1="50" x2="48" y2="54"/>
    <line x1="52" y1="50" x2="52" y2="54"/>
    <line x1="56" y1="50" x2="56" y2="54"/>
