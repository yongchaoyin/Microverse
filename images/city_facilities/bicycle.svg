<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="100" cy="185" rx="70" ry="6" fill="#000000" opacity="0.3"/>
  
  <!-- Rear wheel -->
  <circle cx="60" cy="150" r="25" fill="#2F2F2F" stroke="#000000" stroke-width="2"/>
  <circle cx="60" cy="150" r="22" fill="#696969"/>
  <circle cx="60" cy="150" r="18" fill="#2F2F2F"/>
  
  <!-- Rear wheel spokes -->
  <line x1="60" y1="125" x2="60" y2="175" stroke="#C0C0C0" stroke-width="1.5"/>
  <line x1="35" y1="150" x2="85" y2="150" stroke="#C0C0C0" stroke-width="1.5"/>
  <line x1="42" y1="132" x2="78" y2="168" stroke="#C0C0C0" stroke-width="1"/>
  <line x1="78" y1="132" x2="42" y2="168" stroke="#C0C0C0" stroke-width="1"/>
  <line x1="47" y1="127" x2="73" y2="173" stroke="#C0C0C0" stroke-width="1"/>
  <line x1="73" y1="127" x2="47" y2="173" stroke="#C0C0C0" stroke-width="1"/>
  
  <!-- Front wheel -->
  <circle cx="140" cy="150" r="25" fill="#2F2F2F" stroke="#000000" stroke-width="2"/>
  <circle cx="140" cy="150" r="22" fill="#696969"/>
  <circle cx="140" cy="150" r="18" fill="#2F2F2F"/>
  
  <!-- Front wheel spokes -->
  <line x1="140" y1="125" x2="140" y2="175" stroke="#C0C0C0" stroke-width="1.5"/>
  <line x1="115" y1="150" x2="165" y2="150" stroke="#C0C0C0" stroke-width="1.5"/>
  <line x1="122" y1="132" x2="158" y2="168" stroke="#C0C0C0" stroke-width="1"/>
  <line x1="158" y1="132" x2="122" y2="168" stroke="#C0C0C0" stroke-width="1"/>
  <line x1="127" y1="127" x2="153" y2="173" stroke="#C0C0C0" stroke-width="1"/>
  <line x1="153" y1="127" x2="127" y2="173" stroke="#C0C0C0" stroke-width="1"/>
  
  <!-- Wheel hubs -->
  <circle cx="60" cy="150" r="4" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
  <circle cx="140" cy="150" r="4" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
  
  <!-- Main frame - top tube -->
  <line x1="85" y1="120" x2="125" y2="120" stroke="#FF0000" stroke-width="4"/>
  
  <!-- Main frame - down tube -->
  <line x1="85" y1="120" x2="140" y2="150" stroke="#FF0000" stroke-width="4"/>
  
  <!-- Main frame - seat tube -->
  <line x1="85" y1="120" x2="85" y2="150" stroke="#FF0000" stroke-width="4"/>
  
  <!-- Main frame - chain stay -->
  <line x1="85" y1="150" x2="60" y2="150" stroke="#FF0000" stroke-width="3"/>
  
  <!-- Main frame - seat stay -->
  <line x1="85" y1="120" x2="60" y2="150" stroke="#FF0000" stroke-width="3"/>
  
  <!-- Fork -->
  <line x1="125" y1="120" x2="140" y2="150" stroke="#C0C0C0" stroke-width="3"/>
  
  <!-- Handlebar stem -->
  <line x1="125" y1="120" x2="130" y2="110" stroke="#C0C0C0" stroke-width="2"/>
  
  <!-- Handlebars -->
  <line x1="120" y1="110" x2="140" y2="110" stroke="#000000" stroke-width="3"/>
  <circle cx="120" cy="110" r="2" fill="#000000"/>
  <circle cx="140" cy="110" r="2" fill="#000000"/>
  
  <!-- Handlebar grips -->
  <rect x="118" y="108" width="4" height="4" fill="#8B4513" rx="2"/>
  <rect x="138" y="108" width="4" height="4" fill="#8B4513" rx="2"/>
  
  <!-- Seat post -->
  <line x1="85" y1="120" x2="85" y2="105" stroke="#C0C0C0" stroke-width="2"/>
  
  <!-- Seat -->
  <ellipse cx="85" cy="105" rx="12" ry="4" fill="#000000" stroke="#2F2F2F" stroke-width="1"/>
  <ellipse cx="85" cy="104" rx="10" ry="3" fill="#8B4513"/>
  
  <!-- Pedals -->
  <circle cx="85" cy="150" r="6" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
  <rect x="82" y="147" width="6" height="6" fill="#2F2F2F" stroke="#000000" stroke-width="0.5" rx="1"/>
  
  <!-- Crank arms -->
  <line x1="85" y1="150" x2="75" y2="140" stroke="#C0C0C0" stroke-width="2"/>
  <line x1="85" y1="150" x2="95" y2="160" stroke="#C0C0C0" stroke-width="2"/>
  
  <!-- Pedal platforms -->
  <rect x="72" y="138" width="6" height="4" fill="#2F2F2F" stroke="#000000" stroke-width="0.5" rx="1"/>
  <rect x="92" y="158" width="6" height="4" fill="#2F2F2F" stroke="#000000" stroke-width="0.5" rx="1"/>
  
  <!-- Chain -->
  <ellipse cx="85" cy="150" rx="15" ry="8" fill="none" stroke="#696969" stroke-width="1.5" stroke-dasharray="2,2"/>
  
  <!-- Chain guard -->
  <path d="M 70 145 Q 85 140 100 145 Q 85 155 70 150 Z" fill="#FF0000" opacity="0.7" stroke="#CC0000" stroke-width="1"/>
  
  <!-- Brake cables -->
  <line x1="125" y1="115" x2="140" y2="135" stroke="#000000" stroke-width="1"/>
  <line x1="125" y1="115" x2="60" y2="135" stroke="#000000" stroke-width="1"/>
  
  <!-- Front brake -->
  <rect x="138" y="133" width="4" height="8" fill="#C0C0C0" stroke="#A9A9A9" stroke-width="0.5" rx="1"/>
  
  <!-- Rear brake -->
  <rect x="58" y="133" width="4" height="8" fill="#C0C0C0" stroke="#A9A9A9" stroke-width="0.5" rx="1"/>
  
  <!-- Gear shifter -->
  <rect x="122" y="108" width="3" height="6" fill="#2F2F2F" stroke="#000000" stroke-width="0.5" rx="1"/>
  
  <!-- Bell -->
  <circle cx="128" cy="112" r="2" fill="#FFD700" stroke="#FFA500" stroke-width="0.5"/>
  <circle cx="128" cy="112" r="1.5" fill="#FFFF00"/>
  
  <!-- Reflectors -->
  <circle cx="60" cy="140" r="2" fill="#FF0000" opacity="0.8"/>
  <circle cx="140" cy="140" r="2" fill="#FF0000" opacity="0.8"/>
  <circle cx="85" cy="160" r="1.5" fill="#FFFF00" opacity="0.8"/>
  
  <!-- Water bottle -->
  <rect x="90" y="125" width="4" height="12" fill="#0000FF" stroke="#000080" stroke-width="0.5" rx="2"/>
  <circle cx="92" cy="125" r="2" fill="#87CEEB"/>
  
  <!-- Water bottle cage -->
  <rect x="89" y="124" width="6" height="14" fill="none" stroke="#C0C0C0" stroke-width="0.5" rx="1"/>
  
  <!-- Bike light (front) -->
  <circle cx="130" cy="115" r="2" fill="#FFFFFF" stroke="#C0C0C0" stroke-width="0.5"/>
  <circle cx="130" cy="115" r="1.5" fill="#FFFF00" opacity="0.8"/>
  
  <!-- Bike light (rear) -->
  <circle cx="80" cy="115" r="1.5" fill="#FF0000" opacity="0.8"/>
  
  <!-- Tire treads -->
  <circle cx="60" cy="150" r="23" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="140" cy="150" r="23" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Valve stems -->
  <rect x="59" y="125" width="2" height="6" fill="#000000" rx="1"/>
  <rect x="139" y="125" width="2" height="6" fill="#000000" rx="1"/>
  
  <!-- Frame joints -->
  <circle cx="85" cy="120" r="3" fill="#FF0000" stroke="#CC0000" stroke-width="1"/>
  <circle cx="125" cy="120" r="3" fill="#C0C0C0" stroke="#A9A9A9" stroke-width="1"/>
  <circle cx="85" cy="150" r="3" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
  
  <!-- Kickstand -->
  <line x1="80" y1="150" x2="75" y2="170" stroke="#2F2F2F" stroke-width="2"/>
  <circle cx="75" cy="170" r="1.5" fill="#2F2F2F"/>
  
  <!-- Ground contact -->
  <ellipse cx="60" cy="175" rx="8" ry="2" fill="#000000" opacity="0.2"/>
  <ellipse cx="140" cy="175" rx="8" ry="2" fill="#000000" opacity="0.2"/>
  <ellipse cx="75" cy="170" rx="3" ry="1" fill="#000000" opacity="0.2"/>
  
  <!-- Bike nameplate -->
  <rect x="75" y="190" width="50" height="8" fill="#FF0000" stroke="#CC0000" stroke-width="0.5"/>
  <text x="100" y="196" text-anchor="middle" font-family="Arial" font-size="6" fill="#FFFFFF">BICYCLE</text>
</svg>