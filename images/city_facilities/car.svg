<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="100" cy="180" rx="60" ry="6" fill="#000000" opacity="0.3"/>
  
  <!-- Car body main -->
  <rect x="40" y="120" width="120" height="40" fill="#FF0000" stroke="#CC0000" stroke-width="2" rx="8"/>
  <rect x="42" y="122" width="116" height="36" fill="#FF4500" rx="6"/>
  
  <!-- Car roof -->
  <rect x="60" y="100" width="80" height="25" fill="#FF0000" stroke="#CC0000" stroke-width="2" rx="6"/>
  <rect x="62" y="102" width="76" height="21" fill="#FF4500" rx="4"/>
  
  <!-- Windshield -->
  <rect x="65" y="105" width="70" height="18" fill="#87CEEB" stroke="#4682B4" stroke-width="1" rx="3"/>
  <rect x="67" y="107" width="66" height="14" fill="#B0E0E6" opacity="0.8" rx="2"/>
  
  <!-- Side windows -->
  <rect x="45" y="125" width="20" height="15" fill="#87CEEB" stroke="#4682B4" stroke-width="1" rx="2"/>
  <rect x="47" y="127" width="16" height="11" fill="#B0E0E6" opacity="0.8" rx="1"/>
  
  <rect x="135" y="125" width="20" height="15" fill="#87CEEB" stroke="#4682B4" stroke-width="1" rx="2"/>
  <rect x="137" y="127" width="16" height="11" fill="#B0E0E6" opacity="0.8" rx="1"/>
  
  <!-- Wheels -->
  <circle cx="65" cy="165" r="15" fill="#2F2F2F" stroke="#000000" stroke-width="2"/>
  <circle cx="65" cy="165" r="10" fill="#696969"/>
  <circle cx="65" cy="165" r="5" fill="#C0C0C0"/>
  <circle cx="65" cy="165" r="2" fill="#FFD700"/>
  
  <circle cx="135" cy="165" r="15" fill="#2F2F2F" stroke="#000000" stroke-width="2"/>
  <circle cx="135" cy="165" r="10" fill="#696969"/>
  <circle cx="135" cy="165" r="5" fill="#C0C0C0"/>
  <circle cx="135" cy="165" r="2" fill="#FFD700"/>
  
  <!-- Wheel spokes -->
  <line x1="65" y1="155" x2="65" y2="175" stroke="#A9A9A9" stroke-width="1"/>
  <line x1="55" y1="165" x2="75" y2="165" stroke="#A9A9A9" stroke-width="1"/>
  <line x1="58" y1="158" x2="72" y2="172" stroke="#A9A9A9" stroke-width="1"/>
  <line x1="72" y1="158" x2="58" y2="172" stroke="#A9A9A9" stroke-width="1"/>
  
  <line x1="135" y1="155" x2="135" y2="175" stroke="#A9A9A9" stroke-width="1"/>
  <line x1="125" y1="165" x2="145" y2="165" stroke="#A9A9A9" stroke-width="1"/>
  <line x1="128" y1="158" x2="142" y2="172" stroke="#A9A9A9" stroke-width="1"/>
  <line x1="142" y1="158" x2="128" y2="172" stroke="#A9A9A9" stroke-width="1"/>
  
  <!-- Headlights -->
  <circle cx="45" cy="140" r="6" fill="#FFFF00" stroke="#FFD700" stroke-width="1"/>
  <circle cx="45" cy="140" r="4" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="45" cy="140" r="2" fill="#FFFF00"/>
  
  <circle cx="155" cy="140" r="6" fill="#FFFF00" stroke="#FFD700" stroke-width="1"/>
  <circle cx="155" cy="140" r="4" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="155" cy="140" r="2" fill="#FFFF00"/>
  
  <!-- Taillights -->
  <circle cx="45" cy="150" r="4" fill="#FF0000" stroke="#CC0000" stroke-width="1"/>
  <circle cx="45" cy="150" r="2" fill="#FF4500"/>
  
  <circle cx="155" cy="150" r="4" fill="#FF0000" stroke="#CC0000" stroke-width="1"/>
  <circle cx="155" cy="150" r="2" fill="#FF4500"/>
  
  <!-- Grille -->
  <rect x="35" y="135" width="8" height="20" fill="#2F2F2F" stroke="#000000" stroke-width="1" rx="1"/>
  <line x1="36" y1="138" x2="42" y2="138" stroke="#696969" stroke-width="0.5"/>
  <line x1="36" y1="142" x2="42" y2="142" stroke="#696969" stroke-width="0.5"/>
  <line x1="36" y1="146" x2="42" y2="146" stroke="#696969" stroke-width="0.5"/>
  <line x1="36" y1="150" x2="42" y2="150" stroke="#696969" stroke-width="0.5"/>
  
  <!-- License plate -->
  <rect x="85" y="148" width="30" height="8" fill="#FFFFFF" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="100" y="154" text-anchor="middle" font-family="Arial" font-size="6" fill="#000000">ABC-123</text>
  
  <!-- Door handles -->
  <rect x="70" y="135" width="3" height="2" fill="#C0C0C0" rx="0.5"/>
  <rect x="127" y="135" width="3" height="2" fill="#C0C0C0" rx="0.5"/>
  
  <!-- Side mirrors -->
  <ellipse cx="58" cy="125" rx="3" ry="2" fill="#2F2F2F" stroke="#000000" stroke-width="0.5"/>
  <ellipse cx="58" cy="125" rx="2" ry="1.5" fill="#87CEEB" opacity="0.6"/>
  
  <ellipse cx="142" cy="125" rx="3" ry="2" fill="#2F2F2F" stroke="#000000" stroke-width="0.5"/>
  <ellipse cx="142" cy="125" rx="2" ry="1.5" fill="#87CEEB" opacity="0.6"/>
  
  <!-- Windshield wipers -->
  <line x1="80" y1="108" x2="85" y2="118" stroke="#2F2F2F" stroke-width="1"/>
  <line x1="120" y1="108" x2="115" y2="118" stroke="#2F2F2F" stroke-width="1"/>
  
  <!-- Antenna -->
  <line x1="140" y1="100" x2="140" y2="85" stroke="#2F2F2F" stroke-width="1"/>
  <circle cx="140" cy="85" r="1.5" fill="#C0C0C0"/>
  
  <!-- Exhaust pipe -->
  <rect x="160" y="155" width="8" height="3" fill="#696969" stroke="#2F2F2F" stroke-width="0.5" rx="1"/>
  <ellipse cx="168" cy="156.5" rx="1.5" ry="1" fill="#2F2F2F"/>
  
  <!-- Exhaust smoke -->
  <circle cx="172" cy="155" r="2" fill="#D3D3D3" opacity="0.6"/>
  <circle cx="175" cy="153" r="1.5" fill="#D3D3D3" opacity="0.4"/>
  <circle cx="178" cy="151" r="1" fill="#D3D3D3" opacity="0.3"/>
  
  <!-- Car details -->
  <!-- Hood ornament -->
  <circle cx="100" cy="125" r="2" fill="#FFD700" stroke="#FFA500" stroke-width="0.5"/>
  <polygon points="100,123 101,125 100,127 99,125" fill="#FF6347"/>
  
  <!-- Body reflections -->
  <ellipse cx="80" cy="130" rx="15" ry="3" fill="#FFFFFF" opacity="0.3"/>
  <ellipse cx="120" cy="130" rx="15" ry="3" fill="#FFFFFF" opacity="0.3"/>
  <ellipse cx="100" cy="110" rx="20" ry="2" fill="#FFFFFF" opacity="0.4"/>
  
  <!-- Tire treads -->
  <circle cx="65" cy="165" r="13" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="135" cy="165" r="13" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Ground contact -->
  <ellipse cx="65" cy="178" rx="8" ry="2" fill="#000000" opacity="0.2"/>
  <ellipse cx="135" cy="178" rx="8" ry="2" fill="#000000" opacity="0.2"/>
  
  <!-- Car nameplate -->
  <rect x="75" y="185" width="50" height="8" fill="#2F2F2F" stroke="#000000" stroke-width="0.5"/>
  <text x="100" y="191" text-anchor="middle" font-family="Arial" font-size="6" fill="#FFFFFF">SEDAN</text>
</svg>