<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="32" cy="58" rx="25" ry="3" fill="#000000" opacity="0.2"/>
  
  <!-- Shelter roof -->
  <rect x="8" y="12" width="48" height="4" fill="#2F4F4F"/>
  <rect x="6" y="16" width="52" height="2" fill="#708090"/>
  
  <!-- Support poles -->
  <rect x="10" y="16" width="2" height="40" fill="#2F4F4F"/>
  <rect x="52" y="16" width="2" height="40" fill="#2F4F4F"/>
  
  <!-- Back wall -->
  <rect x="12" y="16" width="40" height="32" fill="#87CEEB" opacity="0.3"/>
  <rect x="12" y="16" width="40" height="2" fill="#B0C4DE"/>
  
  <!-- Bench -->
  <rect x="16" y="40" width="32" height="3" fill="#8B4513"/>
  <rect x="16" y="40" width="32" height="1" fill="#A0522D"/>
  
  <!-- Bench legs -->
  <rect x="18" y="43" width="2" height="8" fill="#8B4513"/>
  <rect x="44" y="43" width="2" height="8" fill="#8B4513"/>
  
  <!-- Bus stop sign -->
  <rect x="54" y="20" width="6" height="20" fill="#4169E1"/>
  <rect x="54" y="20" width="6" height="2" fill="#6495ED"/>
  
  <!-- Bus icon on sign -->
  <rect x="55" y="24" width="4" height="2" fill="#FFFFFF"/>
  <circle cx="56" cy="26.5" r="0.3" fill="#FFFFFF"/>
  <circle cx="58" cy="26.5" r="0.3" fill="#FFFFFF"/>
  <rect x="55.5" y="24.5" width="1" height="1" fill="#4169E1"/>
  <rect x="57.5" y="24.5" width="1" height="1" fill="#4169E1"/>
  
  <!-- Route numbers -->
  <rect x="55" y="28" width="4" height="4" fill="#FFFFFF"/>
  <text x="57" y="30.5" text-anchor="middle" font-family="Arial" font-size="1.5" font-weight="bold" fill="#4169E1">42</text>
  <text x="57" y="31.8" text-anchor="middle" font-family="Arial" font-size="1.5" font-weight="bold" fill="#4169E1">15</text>
  
  <!-- Schedule display -->
  <rect x="55" y="33" width="4" height="5" fill="#000000"/>
  <rect x="55.5" y="33.5" width="3" height="4" fill="#00FF00"/>
  <text x="57" y="35.5" text-anchor="middle" font-family="Arial" font-size="1" fill="#000000">5 min</text>
  <text x="57" y="36.5" text-anchor="middle" font-family="Arial" font-size="1" fill="#000000">12 min</text>
  
  <!-- Advertising panel -->
  <rect x="14" y="20" width="36" height="16" fill="#FFFFFF"/>
  <rect x="14" y="20" width="36" height="2" fill="#E0E0E0"/>
  
  <!-- Advertisement content -->
  <rect x="16" y="22" width="32" height="12" fill="#FFE4B5"/>
  <rect x="18" y="24" width="8" height="8" fill="#FF6347"/>
  <text x="22" y="28.5" text-anchor="middle" font-family="Arial" font-size="2" font-weight="bold" fill="#FFFFFF">SALE</text>
  <text x="35" y="26" text-anchor="middle" font-family="Arial" font-size="1.5" fill="#8B4513">Visit Our Store</text>
  <text x="35" y="28" text-anchor="middle" font-family="Arial" font-size="1.2" fill="#8B4513">50% OFF</text>
  <text x="35" y="30" text-anchor="middle" font-family="Arial" font-size="1" fill="#8B4513">This Weekend Only</text>
  
  <!-- Trash bin -->
  <rect x="4" y="44" width="4" height="8" fill="#708090"/>
  <rect x="4" y="44" width="4" height="1" fill="#A0A0A0"/>
  <circle cx="6" cy="46" r="1" fill="#228B22"/>
  <path d="M5.5 45.5 L6.5 46.5 M6.5 45.5 L5.5 46.5" stroke="#FFFFFF" stroke-width="0.3"/>
  
  <!-- Ground markings -->
  <rect x="0" y="54" width="64" height="4" fill="#A0A0A0"/>
  <rect x="8" y="54" width="48" height="1" fill="#FFFF00"/>
  <text x="32" y="56" text-anchor="middle" font-family="Arial" font-size="2" font-weight="bold" fill="#FFFFFF">BUS STOP</text>
  
  <!-- Waiting passengers (silhouettes) -->
  <circle cx="20" cy="36" r="1.5" fill="#333333"/>
  <rect x="19" y="37.5" width="2" height="4" fill="#333333"/>
  <rect x="18.5" y="41.5" width="3" height="2" fill="#333333"/>
  
  <circle cx="28" cy="36" r="1.5" fill="#333333"/>
  <rect x="27" y="37.5" width="2" height="4" fill="#333333"/>
  <rect x="26.5" y="41.5" width="3" height="2" fill="#333333"/>
  
  <!-- Lighting -->
  <rect x="11" y="14" width="1" height="2" fill="#FFD700"/>
  <circle cx="11.5" cy="14" r="1" fill="#FFFF99" opacity="0.5"/>
  
  <!-- Information board -->
  <rect x="58" y="44" width="4" height="6" fill="#FFFFFF"/>
  <rect x="58" y="44" width="4" height="1" fill="#4169E1"/>
  <text x="60" y="47" text-anchor="middle" font-family="Arial" font-size="0.8" fill="#000000">MAP</text>
  <rect x="58.5" y="48" width="3" height="1.5" fill="#90EE90"/>
</svg>