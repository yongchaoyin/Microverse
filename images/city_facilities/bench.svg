<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="32" cy="58" rx="20" ry="3" fill="#000000" opacity="0.2"/>
  
  <!-- Bench legs -->
  <rect x="14" y="40" width="3" height="16" fill="#8B4513"/>
  <rect x="47" y="40" width="3" height="16" fill="#8B4513"/>
  
  <!-- Bench support bars -->
  <rect x="14" y="48" width="36" height="2" fill="#8B4513"/>
  <rect x="16" y="42" width="32" height="1" fill="#A0522D"/>
  
  <!-- Bench seat -->
  <rect x="12" y="36" width="40" height="4" fill="#D2691E"/>
  <rect x="12" y="36" width="40" height="1" fill="#F4A460"/>
  
  <!-- Bench back -->
  <rect x="12" y="24" width="40" height="12" fill="#D2691E"/>
  <rect x="12" y="24" width="40" height="1" fill="#F4A460"/>
  
  <!-- Wood grain details -->
  <g stroke="#8B4513" stroke-width="0.3" opacity="0.5">
    <line x1="12" y1="26" x2="52" y2="26"/>
    <line x1="12" y1="28" x2="52" y2="28"/>
    <line x1="12" y1="30" x2="52" y2="30"/>
    <line x1="12" y1="32" x2="52" y2="32"/>
    <line x1="12" y1="34" x2="52" y2="34"/>
    
    <line x1="12" y1="37" x2="52" y2="37"/>
    <line x1="12" y1="38" x2="52" y2="38"/>
  </g>
  
  <!-- Armrests -->
  <rect x="10" y="28" width="4" height="8" fill="#8B4513"/>
  <rect x="50" y="28" width="4" height="8" fill="#8B4513"/>
  <rect x="10" y="28" width="4" height="1" fill="#A0522D"/>
  <rect x="50" y="28" width="4" height="1" fill="#A0522D"/>
  
  <!-- Metal brackets -->
  <rect x="16" y="34" width="2" height="6" fill="#708090"/>
  <rect x="46" y="34" width="2" height="6" fill="#708090"/>
  
  <!-- Screws -->
  <circle cx="15" cy="38" r="0.3" fill="#2F4F4F"/>
  <circle cx="49" cy="38" r="0.3" fill="#2F4F4F"/>
  <circle cx="17" cy="26" r="0.3" fill="#2F4F4F"/>
  <circle cx="47" cy="26" r="0.3" fill="#2F4F4F"/>
  
  <!-- Decorative elements -->
  <rect x="28" y="30" width="8" height="2" fill="#8B4513"/>
  <circle cx="32" cy="31" r="1" fill="#A0522D"/>
  
  <!-- Ground area -->
  <rect x="8" y="56" width="48" height="4" fill="#90EE90" opacity="0.3"/>
  
  <!-- Small decorative plants -->
  <circle cx="8" cy="54" r="1.5" fill="#228B22"/>
  <circle cx="56" cy="54" r="1.5" fill="#228B22"/>
  <circle cx="9" cy="55" r="0.3" fill="#FF69B4"/>
  <circle cx="55" cy="55" r="0.3" fill="#FF69B4"/>
  
  <!-- Bench nameplate -->
  <rect x="26" y="42" width="12" height="2" fill="#C0C0C0"/>
