<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="32" cy="60" rx="8" ry="2" fill="#000000" opacity="0.2"/>
  
  <!-- Base -->
  <rect x="30" y="56" width="4" height="4" fill="#2F4F4F"/>
  <rect x="28" y="58" width="8" height="2" fill="#708090"/>
  
  <!-- Pole -->
  <rect x="31" y="20" width="2" height="36" fill="#2F4F4F"/>
  
  <!-- Traffic light housing -->
  <rect x="26" y="8" width="12" height="20" fill="#333333"/>
  <rect x="26" y="8" width="12" height="2" fill="#555555"/>
  
  <!-- Light frames -->
  <rect x="28" y="10" width="8" height="5" fill="#222222"/>
  <rect x="28" y="15" width="8" height="5" fill="#222222"/>
  <rect x="28" y="20" width="8" height="5" fill="#222222"/>
  
  <!-- Traffic lights -->
  <circle cx="32" cy="12.5" r="2" fill="#FF0000"/>
  <circle cx="32" cy="17.5" r="2" fill="#FFFF00"/>
  <circle cx="32" cy="22.5" r="2" fill="#00FF00"/>
  
  <!-- Light glow effects -->
  <circle cx="32" cy="22.5" r="3" fill="#00FF00" opacity="0.3"/>
  <circle cx="32" cy="22.5" r="4" fill="#00FF00" opacity="0.1"/>
  
  <!-- Light reflections -->
  <circle cx="31" cy="11.5" r="0.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="31" cy="16.5" r="0.5" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="31" cy="21.5" r="0.5" fill="#FFFFFF" opacity="0.8"/>
  
  <!-- Housing details -->
  <rect x="25" y="8" width="1" height="20" fill="#555555"/>
  <rect x="38" y="8" width="1" height="20" fill="#555555"/>
  
  <!-- Mounting bracket -->
  <rect x="30" y="28" width="4" height="2" fill="#2F4F4F"/>
  
  <!-- Control box -->
  <rect x="29" y="48" width="6" height="4" fill="#708090"/>
  <rect x="30" y="49" width="4" height="2" fill="#2F4F4F"/>
  <circle cx="32" cy="50" r="0.3" fill="#00FF00"/>
  
  <!-- Wiring -->
  <path d="M32 28 Q28 30 30 32" stroke="#333333" stroke-width="0.5" fill="none"/>
  
  <!-- Ground plate -->
  <rect x="28" y="58" width="8" height="1" fill="#A0A0A0"/>
  
  <!-- Bolts -->
  <circle cx="29" cy="58.5" r="0.3" fill="#2F4F4F"/>
  <circle cx="35" cy="58.5" r="0.3" fill="#2F4F4F"/>
  
  <!-- Pedestrian button -->
  <rect x="24" y="40" width="2" height="3" fill="#4169E1"/>
  <circle cx="25" cy="41.5" r="0.5" fill="#FFFFFF"/>
  <rect x="22" y="43" width="6" height="1" fill="#4169E1"/>
  <text x="25" y="43.7" text-anchor="middle" font-family="Arial" font-size="0.8" fill="#FFFFFF">PUSH</text>
  
  <!-- Countdown display -->
  <rect x="34" y="6" width="6" height="4" fill="#000000"/>
  <rect x="35" y="7" width="4" height="2" fill="#00FF00"/>
  <text x="37" y="8.5" text-anchor="middle" font-family="Arial" font-size="2" font-weight="bold" fill="#000000">15</text>
</svg>