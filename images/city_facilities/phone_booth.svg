<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="32" cy="58" rx="12" ry="2" fill="#000000" opacity="0.2"/>
  
  <!-- Base -->
  <rect x="26" y="54" width="12" height="4" fill="#2F4F4F"/>
  
  <!-- Main structure -->
  <rect x="24" y="12" width="16" height="42" fill="#FF0000"/>
  <rect x="24" y="12" width="16" height="2" fill="#FF6347"/>
  
  <!-- Glass panels -->
  <rect x="26" y="14" width="12" height="20" fill="#87CEEB" opacity="0.7"/>
  <rect x="26" y="14" width="12" height="1" fill="#B0E0E6"/>
  
  <!-- Door -->
  <rect x="28" y="36" width="8" height="18" fill="#8B0000"/>
  <rect x="28" y="36" width="8" height="1" fill="#A0522D"/>
  
  <!-- Door handle -->
  <circle cx="34" cy="45" r="0.5" fill="#FFD700"/>
  
  <!-- Door window -->
  <rect x="29" y="38" width="6" height="8" fill="#87CEEB" opacity="0.7"/>
  
  <!-- Roof -->
  <polygon points="22,12 32,6 42,12" fill="#8B0000"/>
  <polygon points="22,12 32,6 42,12 40,14 32,8 24,14" fill="#A0522D"/>
  
  <!-- Phone inside -->
  <rect x="30" y="24" width="4" height="6" fill="#333333"/>
  <rect x="30.5" y="24.5" width="3" height="2" fill="#C0C0C0"/>
  <rect x="31" y="27" width="2" height="2" fill="#000000"/>
  
  <!-- Handset -->
  <rect x="29" y="20" width="6" height="1.5" fill="#333333"/>
  <circle cx="30" cy="20.7" r="0.3" fill="#C0C0C0"/>
  <circle cx="34" cy="20.7" r="0.3" fill="#C0C0C0"/>
  
  <!-- Coin slot -->
  <rect x="31" y="22" width="2" height="0.5" fill="#000000"/>
  
  <!-- Keypad -->
  <rect x="30.5" y="29" width="3" height="3" fill="#C0C0C0"/>
  <g fill="#333333">
    <circle cx="31" cy="29.5" r="0.15"/>
    <circle cx="32" cy="29.5" r="0.15"/>
    <circle cx="33" cy="29.5" r="0.15"/>
    <circle cx="31" cy="30.5" r="0.15"/>
    <circle cx="32" cy="30.5" r="0.15"/>
    <circle cx="33" cy="30.5" r="0.15"/>
    <circle cx="31" cy="31.5" r="0.15"/>
    <circle cx="32" cy="31.5" r="0.15"/>
    <circle cx="33" cy="31.5" r="0.15"/>
  </g>
  
  <!-- PHONE sign -->
  <rect x="26" y="16" width="12" height="3" fill="#FFFFFF"/>
  <text x="32" y="18" text-anchor="middle" font-family="Arial" font-size="2" font-weight="bold" fill="#FF0000">PHONE</text>
  
  <!-- Instructions -->
  <rect x="27" y="32" width="10" height="2" fill="#FFFFFF"/>
  <text x="32" y="33.2" text-anchor="middle" font-family="Arial" font-size="0.8" fill="#000000">Insert Coin</text>
  
  <!-- Ventilation grilles -->
  <g stroke="#8B0000" stroke-width="0.3">
    <line x1="25" y1="48" x2="27" y2="48"/>
    <line x1="25" y1="49" x2="27" y2="49"/>
    <line x1="25" y1="50" x2="27" y2="50"/>
    
    <line x1="37" y1="48" x2="39" y2="48"/>
    <line x1="37" y1="49" x2="39" y2="49"/>
    <line x1="37" y1="50" x2="39" y2="50"/>
  </g>
  
  <!-- Emergency notice -->
  <rect x="26" y="51" width="12" height="2" fill="#FFFF00"/>
  <text x="32" y="52.2" text-anchor="middle" font-family="Arial" font-size="0.8" font-weight="bold" fill="#FF0000">EMERGENCY 911</text>
  
  <!-- Light -->
  <rect x="31.5" y="10" width="1" height="2" fill="#FFD700"/>
  <circle cx="32" cy="10" r="1" fill="#FFFF99" opacity="0.5"/>
  
  <!-- Structural details -->
  <rect x="24" y="12" width="1" height="42" fill="#B22222"/>
  <rect x="39" y="12" width="1" height="42" fill="#8B0000"/>
  
  <!-- Ground area -->
  <rect x="20" y="56" width="24" height="2" fill="#A0A0A0"/>
  
  <!-- Small decorative elements -->
  <circle cx="20" cy="54" r="1" fill="#228B22"/>
  <circle cx="44" cy="54" r="1" fill="#228B22"/>
  
  <!-- Reflection on glass -->
  <rect x="26" y="14" width="2" height="20" fill="#FFFFFF" opacity="0.3"/>
</svg>