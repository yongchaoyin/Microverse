<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="32" cy="58" rx="12" ry="2" fill="#000000" opacity="0.2"/>
  
  <!-- Base -->
  <rect x="28" y="54" width="8" height="4" fill="#2F4F4F"/>
  
  <!-- Main body -->
  <rect x="24" y="20" width="16" height="34" fill="#708090"/>
  <rect x="24" y="20" width="16" height="2" fill="#A0A0A0"/>
  
  <!-- Lid -->
  <ellipse cx="32" cy="20" rx="10" ry="2" fill="#A0A0A0"/>
  <ellipse cx="32" cy="18" rx="10" ry="2" fill="#C0C0C0"/>
  
  <!-- Lid handle -->
  <rect x="30" y="16" width="4" height="2" fill="#2F4F4F"/>
  <rect x="31" y="14" width="2" height="4" fill="#2F4F4F"/>
  
  <!-- Body details -->
  <rect x="23" y="20" width="1" height="34" fill="#A0A0A0"/>
  <rect x="40" y="20" width="1" height="34" fill="#555555"/>
  
  <!-- Recycling symbol -->
  <circle cx="32" cy="35" r="6" fill="#228B22"/>
  <path d="M32 29 L35 32 L32 35 L29 32 Z" fill="#FFFFFF"/>
  <path d="M26 35 Q32 29 38 35" stroke="#FFFFFF" stroke-width="1" fill="none"/>
  <path d="M26 35 Q32 41 38 35" stroke="#FFFFFF" stroke-width="1" fill="none"/>
  
  <!-- Recycling arrows -->
  <path d="M29 32 L26 29 L23 32" stroke="#FFFFFF" stroke-width="0.8" fill="none"/>
  <path d="M35 32 L38 29 L41 32" stroke="#FFFFFF" stroke-width="0.8" fill="none"/>
  <path d="M29 38 L26 41 L23 38" stroke="#FFFFFF" stroke-width="0.8" fill="none"/>
  <path d="M35 38 L38 41 L41 38" stroke="#FFFFFF" stroke-width="0.8" fill="none"/>
  
  <!-- Side handles -->
  <rect x="22" y="30" width="2" height="4" fill="#2F4F4F"/>
  <rect x="40" y="30" width="2" height="4" fill="#2F4F4F"/>
  
  <!-- Ventilation holes -->
  <circle cx="27" cy="25" r="0.5" fill="#2F4F4F"/>
  <circle cx="32" cy="25" r="0.5" fill="#2F4F4F"/>
  <circle cx="37" cy="25" r="0.5" fill="#2F4F4F"/>
  
  <circle cx="27" cy="45" r="0.5" fill="#2F4F4F"/>
  <circle cx="32" cy="45" r="0.5" fill="#2F4F4F"/>
  <circle cx="37" cy="45" r="0.5" fill="#2F4F4F"/>
  
  <!-- Trash inside (visible through opening) -->
  <rect x="26" y="22" width="3" height="2" fill="#8B4513"/>
  <rect x="30" y="23" width="2" height="3" fill="#FF6347"/>
  <rect x="33" y="22" width="4" height="2" fill="#32CD32"/>
  <circle cx="35" cy="25" r="1" fill="#FFD700"/>
  
  <!-- Label -->
  <rect x="26" y="48" width="12" height="3" fill="#FFFFFF"/>
  <text x="32" y="50" text-anchor="middle" font-family="Arial" font-size="2" font-weight="bold" fill="#2F4F4F">TRASH</text>
  
  <!-- Ground area -->
  <rect x="20" y="56" width="24" height="2" fill="#A0A0A0"/>
  
  <!-- Small litter around -->
  <rect x="18" y="56" width="1" height="1" fill="#8B4513"/>
  <circle cx="46" cy="56" r="0.5" fill="#FF6347"/>
  <rect x="16" y="57" width="0.5" height="0.5" fill="#32CD32"/>
