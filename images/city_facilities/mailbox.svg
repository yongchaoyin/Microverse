<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="32" cy="58" rx="10" ry="2" fill="#000000" opacity="0.2"/>
  
  <!-- Base -->
  <rect x="30" y="54" width="4" height="4" fill="#2F4F4F"/>
  <rect x="28" y="56" width="8" height="2" fill="#708090"/>
  
  <!-- Pole -->
  <rect x="31" y="30" width="2" height="24" fill="#2F4F4F"/>
  
  <!-- Mailbox body -->
  <rect x="20" y="16" width="24" height="16" fill="#4169E1"/>
  <rect x="20" y="16" width="24" height="2" fill="#6495ED"/>
  
  <!-- Mailbox door -->
  <rect x="22" y="18" width="20" height="12" fill="#1E90FF"/>
  <rect x="22" y="18" width="20" height="1" fill="#87CEEB"/>
  
  <!-- Door handle -->
  <circle cx="40" cy="24" r="0.8" fill="#FFD700"/>
  
  <!-- Mail slot -->
  <rect x="24" y="26" width="12" height="1" fill="#000000"/>
  
  <!-- MAIL text -->
  <rect x="26" y="20" width="12" height="3" fill="#FFFFFF"/>
  <text x="32" y="22.5" text-anchor="middle" font-family="Arial" font-size="2.5" font-weight="bold" fill="#4169E1">MAIL</text>
  
  <!-- Flag (up position) -->
  <rect x="44" y="20" width="6" height="4" fill="#FF0000"/>
  <rect x="44" y="20" width="6" height="1" fill="#FF6347"/>
  <rect x="49" y="21" width="1" height="2" fill="#8B0000"/>
  
  <!-- Collection times -->
  <rect x="20" y="32" width="24" height="4" fill="#FFFFFF"/>
  <text x="32" y="34.5" text-anchor="middle" font-family="Arial" font-size="1.5" fill="#000000">Mon-Fri 5PM</text>
  <text x="32" y="35.8" text-anchor="middle" font-family="Arial" font-size="1.5" fill="#000000">Sat 12PM</text>
  
  <!-- Mail visible through slot -->
  <rect x="25" y="26.2" width="2" height="0.6" fill="#FFFFFF"/>
  <rect x="28" y="26.2" width="3" height="0.6" fill="#FFE4E1"/>
  <rect x="32" y="26.2" width="2" height="0.6" fill="#F0F8FF"/>
  
  <!-- Postal service logo -->
  <circle cx="26" cy="22" r="1.5" fill="#FFD700"/>
  <text x="26" y="22.5" text-anchor="middle" font-family="Arial" font-size="1.5" font-weight="bold" fill="#4169E1">P</text>
  
  <!-- Lock -->
  <rect x="38" y="28" width="2" height="1.5" fill="#C0C0C0"/>
  <circle cx="39" cy="28" r="0.5" fill="#2F4F4F"/>
  
  <!-- Mounting bracket -->
  <rect x="30" y="32" width="4" height="2" fill="#2F4F4F"/>
  
  <!-- Ground plate -->
  <rect x="28" y="56" width="8" height="1" fill="#A0A0A0"/>
  
  <!-- Bolts -->
  <circle cx="29" cy="56.5" r="0.3" fill="#2F4F4F"/>
  <circle cx="35" cy="56.5" r="0.3" fill="#2F4F4F"/>
  
  <!-- Small decorative elements -->
  <circle cx="18" cy="54" r="1" fill="#228B22"/>
  <circle cx="46" cy="54" r="1" fill="#228B22"/>
  <circle cx="19" cy="55" r="0.3" fill="#FF69B4"/>
  <circle cx="45" cy="55" r="0.3" fill="#FF69B4"/>
  
  <!-- Reflection on mailbox -->
  <rect x="22" y="18" width="2" height="12" fill="#87CEEB" opacity="0.3"/>
</svg>