<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="32" cy="60" rx="8" ry="2" fill="#000000" opacity="0.2"/>
  
  <!-- Base -->
  <rect x="30" y="56" width="4" height="4" fill="#2F4F4F"/>
  <rect x="28" y="58" width="8" height="2" fill="#708090"/>
  
  <!-- Pole -->
  <rect x="31" y="12" width="2" height="44" fill="#2F4F4F"/>
  
  <!-- Pole segments -->
  <rect x="30.5" y="20" width="3" height="1" fill="#708090"/>
  <rect x="30.5" y="32" width="3" height="1" fill="#708090"/>
  <rect x="30.5" y="44" width="3" height="1" fill="#708090"/>
  
  <!-- Lamp head -->
  <rect x="26" y="8" width="12" height="8" fill="#2F4F4F"/>
  <rect x="26" y="8" width="12" height="2" fill="#708090"/>
  
  <!-- Light bulb -->
  <rect x="28" y="10" width="8" height="4" fill="#FFFF99"/>
  <rect x="28" y="10" width="8" height="1" fill="#FFFFFF"/>
  
  <!-- Light glow -->
  <circle cx="32" cy="12" r="8" fill="#FFFF99" opacity="0.3"/>
  <circle cx="32" cy="12" r="12" fill="#FFFF99" opacity="0.1"/>
  
  <!-- Lamp cover -->
  <rect x="27" y="9" width="10" height="6" fill="none" stroke="#2F4F4F" stroke-width="0.5"/>
  
  <!-- Decorative elements -->
  <circle cx="32" cy="6" r="1" fill="#708090"/>
  <rect x="31.5" y="16" width="1" height="2" fill="#708090"/>
  
  <!-- Control box -->
  <rect x="29" y="48" width="6" height="4" fill="#708090"/>
  <rect x="30" y="49" width="4" height="2" fill="#2F4F4F"/>
  <circle cx="32" cy="50" r="0.5" fill="#FF0000"/>
  
  <!-- Wiring -->
  <path d="M32 16 Q28 18 30 20" stroke="#333333" stroke-width="0.5" fill="none"/>
  
  <!-- Ground plate -->
  <rect x="28" y="58" width="8" height="1" fill="#A0A0A0"/>
  
  <!-- Bolts -->
  <circle cx="29" cy="58.5" r="0.3" fill="#2F4F4F"/>
  <circle cx="35" cy="58.5" r="0.3" fill="#2F4F4F"/>
  
  <!-- Light rays -->
  <g stroke="#FFFF99" stroke-width="1" opacity="0.5">
    <line x1="32" y1="12" x2="20" y2="12"/>
    <line x1="32" y1="12" x2="44" y2="12"/>
    <line x1="32" y1="12" x2="26" y2="6"/>
    <line x1="32" y1="12" x2="38" y2="6"/>
    <line x1="32" y1="12" x2="26" y2="18"/>
    <line x1="32" y1="12" x2="38" y2="18"/>
  </g>
</svg>