<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="100" cy="185" rx="85" ry="10" fill="#000000" opacity="0.3"/>
  
  <!-- Truck cab -->
  <rect x="20" y="100" width="50" height="45" fill="#0000FF" stroke="#000080" stroke-width="2" rx="4"/>
  <rect x="22" y="102" width="46" height="41" fill="#4169E1" rx="3"/>
  
  <!-- Truck cargo bed -->
  <rect x="70" y="110" width="100" height="35" fill="#696969" stroke="#2F2F2F" stroke-width="2" rx="2"/>
  <rect x="72" y="112" width="96" height="31" fill="#A9A9A9" rx="1"/>
  
  <!-- Cab windshield -->
  <rect x="25" y="105" width="20" height="15" fill="#87CEEB" stroke="#4682B4" stroke-width="1" rx="2"/>
  <rect x="27" y="107" width="16" height="11" fill="#B0E0E6" opacity="0.8" rx="1"/>
  
  <!-- Cab side window -->
  <rect x="50" y="105" width="15" height="15" fill="#87CEEB" stroke="#4682B4" stroke-width="1" rx="2"/>
  <rect x="52" y="107" width="11" height="11" fill="#B0E0E6" opacity="0.8" rx="1"/>
  
  <!-- Cargo bed sides -->
  <rect x="70" y="110" width="5" height="25" fill="#2F2F2F" stroke="#000000" stroke-width="1"/>
  <rect x="165" y="110" width="5" height="25" fill="#2F2F2F" stroke="#000000" stroke-width="1"/>
  <rect x="75" y="110" width="90" height="5" fill="#2F2F2F" stroke="#000000" stroke-width="1"/>
  
  <!-- Front wheels -->
  <circle cx="40" cy="160" r="18" fill="#2F2F2F" stroke="#000000" stroke-width="2"/>
  <circle cx="40" cy="160" r="14" fill="#696969"/>
  <circle cx="40" cy="160" r="8" fill="#C0C0C0"/>
  <circle cx="40" cy="160" r="4" fill="#FFD700"/>
  
  <!-- Rear wheels (dual) -->
  <circle cx="130" cy="160" r="18" fill="#2F2F2F" stroke="#000000" stroke-width="2"/>
  <circle cx="130" cy="160" r="14" fill="#696969"/>
  <circle cx="130" cy="160" r="8" fill="#C0C0C0"/>
  <circle cx="130" cy="160" r="4" fill="#FFD700"/>
  
  <circle cx="150" cy="160" r="18" fill="#2F2F2F" stroke="#000000" stroke-width="2"/>
  <circle cx="150" cy="160" r="14" fill="#696969"/>
  <circle cx="150" cy="160" r="8" fill="#C0C0C0"/>
  <circle cx="150" cy="160" r="4" fill="#FFD700"/>
  
  <!-- Wheel spokes -->
  <line x1="40" y1="142" x2="40" y2="178" stroke="#A9A9A9" stroke-width="1.5"/>
  <line x1="22" y1="160" x2="58" y2="160" stroke="#A9A9A9" stroke-width="1.5"/>
  <line x1="28" y1="148" x2="52" y2="172" stroke="#A9A9A9" stroke-width="1"/>
  <line x1="52" y1="148" x2="28" y2="172" stroke="#A9A9A9" stroke-width="1"/>
  
  <line x1="130" y1="142" x2="130" y2="178" stroke="#A9A9A9" stroke-width="1.5"/>
  <line x1="112" y1="160" x2="148" y2="160" stroke="#A9A9A9" stroke-width="1.5"/>
  <line x1="118" y1="148" x2="142" y2="172" stroke="#A9A9A9" stroke-width="1"/>
  <line x1="142" y1="148" x2="118" y2="172" stroke="#A9A9A9" stroke-width="1"/>
  
  <line x1="150" y1="142" x2="150" y2="178" stroke="#A9A9A9" stroke-width="1.5"/>
  <line x1="132" y1="160" x2="168" y2="160" stroke="#A9A9A9" stroke-width="1.5"/>
  <line x1="138" y1="148" x2="162" y2="172" stroke="#A9A9A9" stroke-width="1"/>
  <line x1="162" y1="148" x2="138" y2="172" stroke="#A9A9A9" stroke-width="1"/>
  
  <!-- Headlights -->
  <circle cx="15" cy="120" r="6" fill="#FFFF00" stroke="#FFD700" stroke-width="1"/>
  <circle cx="15" cy="120" r="4" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="15" cy="120" r="2" fill="#FFFF00"/>
  
  <circle cx="15" cy="135" r="6" fill="#FFFF00" stroke="#FFD700" stroke-width="1"/>
  <circle cx="15" cy="135" r="4" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="15" cy="135" r="2" fill="#FFFF00"/>
  
  <!-- Headlight beams -->
  <ellipse cx="5" cy="120" rx="12" ry="4" fill="#FFFF00" opacity="0.3"/>
  <ellipse cx="5" cy="135" rx="12" ry="4" fill="#FFFF00" opacity="0.3"/>
  
  <!-- Taillights -->
  <circle cx="175" cy="120" r="4" fill="#FF0000" stroke="#CC0000" stroke-width="1"/>
  <circle cx="175" cy="120" r="3" fill="#FF4500"/>
  
  <circle cx="175" cy="130" r="4" fill="#FF0000" stroke="#CC0000" stroke-width="1"/>
  <circle cx="175" cy="130" r="3" fill="#FF4500"/>
  
  <!-- Grille -->
  <rect x="20" y="120" width="8" height="20" fill="#2F2F2F" stroke="#000000" stroke-width="1"/>
  <line x1="21" y1="125" x2="27" y2="125" stroke="#C0C0C0" stroke-width="0.5"/>
  <line x1="21" y1="128" x2="27" y2="128" stroke="#C0C0C0" stroke-width="0.5"/>
  <line x1="21" y1="131" x2="27" y2="131" stroke="#C0C0C0" stroke-width="0.5"/>
  <line x1="21" y1="134" x2="27" y2="134" stroke="#C0C0C0" stroke-width="0.5"/>
  <line x1="21" y1="137" x2="27" y2="137" stroke="#C0C0C0" stroke-width="0.5"/>
  
  <!-- Side mirrors -->
  <ellipse cx="12" cy="110" rx="3" ry="2" fill="#2F2F2F" stroke="#000000" stroke-width="0.5"/>
  <ellipse cx="12" cy="110" rx="2" ry="1.5" fill="#87CEEB" opacity="0.6"/>
  
  <ellipse cx="73" cy="110" rx="3" ry="2" fill="#2F2F2F" stroke="#000000" stroke-width="0.5"/>
  <ellipse cx="73" cy="110" rx="2" ry="1.5" fill="#87CEEB" opacity="0.6"/>
  
  <!-- Cab door -->
  <rect x="45" y="120" width="20" height="25" fill="#000080" stroke="#000040" stroke-width="1" rx="2"/>
  <rect x="47" y="122" width="16" height="21" fill="#4169E1" rx="1"/>
  <circle cx="62" cy="132" r="1.5" fill="#FFD700"/>
  <line x1="55" y1="125" x2="55" y2="140" stroke="#000040" stroke-width="0.5"/>
  
  <!-- Cargo items -->
  <rect x="80" y="115" width="15" height="10" fill="#8B4513" stroke="#654321" stroke-width="1" rx="1"/>
  <rect x="100" y="115" width="12" height="12" fill="#FF0000" stroke="#CC0000" stroke-width="1" rx="1"/>
  <rect x="120" y="115" width="18" height="8" fill="#00FF00" stroke="#00CC00" stroke-width="1" rx="1"/>
  <rect x="145" y="115" width="10" height="15" fill="#0000FF" stroke="#000080" stroke-width="1" rx="1"/>
  
  <!-- Cargo straps -->
  <line x1="75" y1="120" x2="165" y2="120" stroke="#8B4513" stroke-width="2"/>
  <line x1="75" y1="125" x2="165" y2="125" stroke="#8B4513" stroke-width="2"/>
  
  <!-- License plate -->
  <rect x="85" y="150" width="25" height="8" fill="#FFFFFF" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="97.5" y="156" text-anchor="middle" font-family="Arial" font-size="5" fill="#000000">TRUCK-1</text>
  
  <!-- Exhaust pipe -->
  <rect x="65" y="95" width="4" height="20" fill="#696969" stroke="#2F2F2F" stroke-width="1" rx="1"/>
  <ellipse cx="67" cy="95" rx="3" ry="2" fill="#2F2F2F"/>
  
  <!-- Exhaust smoke -->
  <circle cx="67" cy="90" r="3" fill="#D3D3D3" opacity="0.6"/>
  <circle cx="70" cy="85" r="2.5" fill="#D3D3D3" opacity="0.4"/>
  <circle cx="73" cy="80" r="2" fill="#D3D3D3" opacity="0.3"/>
  
  <!-- Company logo -->
  <rect x="85" y="125" width="20" height="10" fill="#FFFFFF" stroke="#000000" stroke-width="1" rx="2"/>
  <text x="95" y="130" text-anchor="middle" font-family="Arial" font-size="4" fill="#000000">FREIGHT</text>
  <text x="95" y="134" text-anchor="middle" font-family="Arial" font-size="3" fill="#000000">CO.</text>
  
  <!-- Mud flaps -->
  <rect x="35" y="175" width="10" height="8" fill="#2F2F2F" stroke="#000000" stroke-width="0.5" rx="1"/>
  <rect x="125" y="175" width="10" height="8" fill="#2F2F2F" stroke="#000000" stroke-width="0.5" rx="1"/>
  <rect x="145" y="175" width="10" height="8" fill="#2F2F2F" stroke="#000000" stroke-width="0.5" rx="1"/>
  
  <!-- Cab roof lights -->
  <circle cx="30" cy="100" r="2" fill="#FFA500" opacity="0.8"/>
  <circle cx="40" cy="100" r="2" fill="#FFA500" opacity="0.8"/>
  <circle cx="50" cy="100" r="2" fill="#FFA500" opacity="0.8"/>
  <circle cx="60" cy="100" r="2" fill="#FFA500" opacity="0.8"/>
  
  <!-- Air horn -->
  <rect x="55" y="95" width="6" height="8" fill="#C0C0C0" stroke="#A9A9A9" stroke-width="0.5" rx="1"/>
  <circle cx="58" cy="95" r="2" fill="#FFD700"/>
  
  <!-- Windshield wipers -->
  <line x1="30" y1="107" x2="35" y2="115" stroke="#2F2F2F" stroke-width="1"/>
  <line x1="40" y1="107" x2="35" y2="115" stroke="#2F2F2F" stroke-width="1"/>
  
  <!-- Tire treads -->
  <circle cx="40" cy="160" r="16" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="130" cy="160" r="16" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="150" cy="160" r="16" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Ground contact -->
  <ellipse cx="40" cy="178" rx="12" ry="3" fill="#000000" opacity="0.2"/>
  <ellipse cx="130" cy="178" rx="12" ry="3" fill="#000000" opacity="0.2"/>
  <ellipse cx="150" cy="178" rx="12" ry="3" fill="#000000" opacity="0.2"/>
  
  <!-- Truck nameplate -->
  <rect x="75" y="190" width="50" height="8" fill="#0000FF" stroke="#000080" stroke-width="0.5"/>
  <text x="100" y="196" text-anchor="middle" font-family="Arial" font-size="6" fill="#FFFFFF">TRUCK</text>
</svg>