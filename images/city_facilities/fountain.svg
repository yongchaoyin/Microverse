<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="100" cy="190" rx="80" ry="8" fill="#000000" opacity="0.2"/>
  
  <!-- Ground area -->
  <ellipse cx="100" cy="185" rx="85" ry="12" fill="#8FBC8F"/>
  
  <!-- Outer fountain basin -->
  <ellipse cx="100" cy="160" rx="70" ry="15" fill="#D3D3D3" stroke="#A9A9A9" stroke-width="2"/>
  <ellipse cx="100" cy="155" rx="70" ry="15" fill="#E6F3FF"/>
  
  <!-- Water in outer basin -->
  <ellipse cx="100" cy="155" rx="65" ry="12" fill="#87CEEB" opacity="0.8"/>
  <ellipse cx="100" cy="153" rx="60" ry="10" fill="#B0E0E6" opacity="0.6"/>
  
  <!-- Middle fountain tier -->
  <ellipse cx="100" cy="140" rx="45" ry="10" fill="#D3D3D3" stroke="#A9A9A9" stroke-width="1.5"/>
  <ellipse cx="100" cy="137" rx="45" ry="10" fill="#E6F3FF"/>
  
  <!-- Water in middle tier -->
  <ellipse cx="100" cy="137" rx="40" ry="8" fill="#87CEEB" opacity="0.8"/>
  <ellipse cx="100" cy="136" rx="35" ry="6" fill="#B0E0E6" opacity="0.6"/>
  
  <!-- Central fountain column -->
  <rect x="95" y="90" width="10" height="50" fill="#D3D3D3" stroke="#A9A9A9" stroke-width="1"/>
  <rect x="93" y="88" width="14" height="4" fill="#C0C0C0"/>
  
  <!-- Top fountain tier -->
  <ellipse cx="100" cy="95" rx="20" ry="5" fill="#D3D3D3" stroke="#A9A9A9" stroke-width="1"/>
  <ellipse cx="100" cy="93" rx="20" ry="5" fill="#E6F3FF"/>
  
  <!-- Water in top tier -->
  <ellipse cx="100" cy="93" rx="18" ry="4" fill="#87CEEB" opacity="0.8"/>
  
  <!-- Central water spout -->
  <rect x="98" y="85" width="4" height="8" fill="#D3D3D3"/>
  
  <!-- Water jets and splashes -->
  <!-- Central water jet -->
  <line x1="100" y1="85" x2="100" y2="60" stroke="#87CEEB" stroke-width="3" opacity="0.8"/>
  <line x1="100" y1="85" x2="100" y2="55" stroke="#B0E0E6" stroke-width="2" opacity="0.6"/>
  
  <!-- Side water jets from middle tier -->
  <line x1="85" y1="137" x2="80" y2="120" stroke="#87CEEB" stroke-width="2" opacity="0.7"/>
  <line x1="115" y1="137" x2="120" y2="120" stroke="#87CEEB" stroke-width="2" opacity="0.7"/>
  <line x1="75" y1="140" x2="70" y2="125" stroke="#87CEEB" stroke-width="1.5" opacity="0.6"/>
  <line x1="125" y1="140" x2="130" y2="125" stroke="#87CEEB" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Water droplets -->
  <circle cx="95" cy="70" r="1.5" fill="#87CEEB" opacity="0.8"/>
  <circle cx="105" cy="65" r="1" fill="#B0E0E6" opacity="0.7"/>
  <circle cx="90" cy="75" r="1" fill="#87CEEB" opacity="0.6"/>
  <circle cx="110" cy="72" r="1.2" fill="#B0E0E6" opacity="0.8"/>
  <circle cx="85" cy="80" r="0.8" fill="#87CEEB" opacity="0.5"/>
  <circle cx="115" cy="78" r="0.9" fill="#B0E0E6" opacity="0.6"/>
  
  <!-- Water splash effects -->
  <circle cx="75" cy="130" r="2" fill="#87CEEB" opacity="0.4"/>
  <circle cx="125" cy="132" r="1.8" fill="#B0E0E6" opacity="0.4"/>
  <circle cx="70" cy="145" r="1.5" fill="#87CEEB" opacity="0.3"/>
  <circle cx="130" cy="143" r="1.3" fill="#B0E0E6" opacity="0.3"/>
  
  <!-- Fountain decorative elements -->
  <circle cx="100" cy="88" r="3" fill="#FFD700" stroke="#FFA500" stroke-width="0.5"/>
  <polygon points="100,85 102,90 98,90" fill="#FF6347"/>
  
  <!-- Basin decorative rim -->
  <ellipse cx="100" cy="160" rx="70" ry="15" fill="none" stroke="#B8860B" stroke-width="1" opacity="0.6"/>
  <ellipse cx="100" cy="140" rx="45" ry="10" fill="none" stroke="#B8860B" stroke-width="0.8" opacity="0.6"/>
  
  <!-- Water ripples -->
  <ellipse cx="100" cy="155" rx="30" ry="6" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
  <ellipse cx="100" cy="155" rx="50" ry="10" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.3"/>
  <ellipse cx="100" cy="137" rx="20" ry="4" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.4"/>
  
  <!-- Surrounding decorative elements -->
  <!-- Small plants around fountain -->
  <ellipse cx="50" cy="175" rx="8" ry="4" fill="#228B22"/>
  <ellipse cx="150" cy="175" rx="8" ry="4" fill="#228B22"/>
  <ellipse cx="60" cy="185" rx="6" ry="3" fill="#32CD32"/>
  <ellipse cx="140" cy="185" rx="6" ry="3" fill="#32CD32"/>
  
  <!-- Small flowers -->
  <circle cx="55" cy="172" r="2" fill="#FF69B4"/>
  <circle cx="145" cy="172" r="2" fill="#FF1493"/>
  <circle cx="65" cy="182" r="1.5" fill="#FFB6C1"/>
  <circle cx="135" cy="182" r="1.5" fill="#FFC0CB"/>
  
  <!-- Fountain base details -->
  <rect x="95" y="160" width="10" height="3" fill="#A9A9A9"/>
  <rect x="93" y="140" width="14" height="2" fill="#A9A9A9"/>
  
  <!-- Light reflections on water -->
  <ellipse cx="90" cy="153" rx="8" ry="3" fill="#FFFFFF" opacity="0.3"/>
  <ellipse cx="110" cy="136" rx="6" ry="2" fill="#FFFFFF" opacity="0.4"/>
  <ellipse cx="85" cy="138" rx="4" ry="1.5" fill="#FFFFFF" opacity="0.3"/>
  
  <!-- Fountain nameplate -->
  <rect x="75" y="170" width="50" height="8" fill="#8B4513" stroke="#654321" stroke-width="0.5"/>
  <text x="100" y="176" text-anchor="middle" font-family="Arial" font-size="6" fill="#FFFFFF">FOUNTAIN</text>
</svg>