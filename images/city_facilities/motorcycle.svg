<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="100" cy="185" rx="75" ry="8" fill="#000000" opacity="0.3"/>
  
  <!-- Rear wheel -->
  <circle cx="60" cy="155" r="22" fill="#2F2F2F" stroke="#000000" stroke-width="2"/>
  <circle cx="60" cy="155" r="19" fill="#696969"/>
  <circle cx="60" cy="155" r="15" fill="#2F2F2F"/>
  
  <!-- Rear wheel spokes -->
  <line x1="60" y1="133" x2="60" y2="177" stroke="#C0C0C0" stroke-width="1.5"/>
  <line x1="38" y1="155" x2="82" y2="155" stroke="#C0C0C0" stroke-width="1.5"/>
  <line x1="45" y1="140" x2="75" y2="170" stroke="#C0C0C0" stroke-width="1"/>
  <line x1="75" y1="140" x2="45" y2="170" stroke="#C0C0C0" stroke-width="1"/>
  <line x1="49" y1="136" x2="71" y2="174" stroke="#C0C0C0" stroke-width="1"/>
  <line x1="71" y1="136" x2="49" y2="174" stroke="#C0C0C0" stroke-width="1"/>
  
  <!-- Front wheel -->
  <circle cx="140" cy="155" r="20" fill="#2F2F2F" stroke="#000000" stroke-width="2"/>
  <circle cx="140" cy="155" r="17" fill="#696969"/>
  <circle cx="140" cy="155" r="13" fill="#2F2F2F"/>
  
  <!-- Front wheel spokes -->
  <line x1="140" y1="135" x2="140" y2="175" stroke="#C0C0C0" stroke-width="1.5"/>
  <line x1="120" y1="155" x2="160" y2="155" stroke="#C0C0C0" stroke-width="1.5"/>
  <line x1="126" y1="141" x2="154" y2="169" stroke="#C0C0C0" stroke-width="1"/>
  <line x1="154" y1="141" x2="126" y2="169" stroke="#C0C0C0" stroke-width="1"/>
  <line x1="129" y1="138" x2="151" y2="172" stroke="#C0C0C0" stroke-width="1"/>
  <line x1="151" y1="138" x2="129" y2="172" stroke="#C0C0C0" stroke-width="1"/>
  
  <!-- Wheel hubs -->
  <circle cx="60" cy="155" r="4" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
  <circle cx="140" cy="155" r="4" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
  
  <!-- Main frame -->
  <rect x="80" y="125" width="40" height="15" fill="#FF0000" stroke="#CC0000" stroke-width="2" rx="3"/>
  <rect x="82" y="127" width="36" height="11" fill="#FF4500" rx="2"/>
  
  <!-- Engine -->
  <rect x="75" y="140" width="30" height="20" fill="#2F2F2F" stroke="#000000" stroke-width="2" rx="2"/>
  <rect x="77" y="142" width="26" height="16" fill="#696969" rx="1"/>
  
  <!-- Engine details -->
  <rect x="80" y="145" width="20" height="8" fill="#C0C0C0" stroke="#A9A9A9" stroke-width="1" rx="1"/>
  <circle cx="85" cy="149" r="2" fill="#FFD700"/>
  <circle cx="95" cy="149" r="2" fill="#FFD700"/>
  
  <!-- Exhaust pipe -->
  <rect x="105" y="150" width="25" height="4" fill="#696969" stroke="#2F2F2F" stroke-width="1" rx="2"/>
  <rect x="130" y="148" width="8" height="8" fill="#2F2F2F" stroke="#000000" stroke-width="1" rx="2"/>
  
  <!-- Exhaust smoke -->
  <circle cx="142" cy="152" r="3" fill="#D3D3D3" opacity="0.6"/>
  <circle cx="147" cy="149" r="2.5" fill="#D3D3D3" opacity="0.4"/>
  <circle cx="151" cy="146" r="2" fill="#D3D3D3" opacity="0.3"/>
  
  <!-- Fuel tank -->
  <ellipse cx="100" cy="115" rx="18" ry="8" fill="#FF0000" stroke="#CC0000" stroke-width="2"/>
  <ellipse cx="100" cy="114" rx="15" ry="6" fill="#FF4500"/>
  
  <!-- Fuel tank cap -->
  <circle cx="100" cy="110" r="3" fill="#2F2F2F" stroke="#000000" stroke-width="1"/>
  <circle cx="100" cy="110" r="2" fill="#C0C0C0"/>
  
  <!-- Seat -->
  <ellipse cx="95" cy="125" rx="15" ry="5" fill="#000000" stroke="#2F2F2F" stroke-width="1"/>
  <ellipse cx="95" cy="124" rx="12" ry="4" fill="#8B4513"/>
  
  <!-- Handlebars -->
  <line x1="115" y1="105" x2="135" y2="105" stroke="#000000" stroke-width="3"/>
  <circle cx="115" cy="105" r="2" fill="#000000"/>
  <circle cx="135" cy="105" r="2" fill="#000000"/>
  
  <!-- Handlebar grips -->
  <rect x="113" y="103" width="4" height="4" fill="#8B4513" rx="2"/>
  <rect x="133" y="103" width="4" height="4" fill="#8B4513" rx="2"/>
  
  <!-- Fork -->
  <line x1="125" y1="105" x2="140" y2="135" stroke="#C0C0C0" stroke-width="4"/>
  <line x1="125" y1="105" x2="125" y2="125" stroke="#C0C0C0" stroke-width="3"/>
  
  <!-- Headlight -->
  <circle cx="125" cy="115" r="6" fill="#FFFF00" stroke="#FFD700" stroke-width="1"/>
  <circle cx="125" cy="115" r="4" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="125" cy="115" r="2" fill="#FFFF00"/>
  
  <!-- Headlight beam -->
  <ellipse cx="135" cy="115" rx="15" ry="3" fill="#FFFF00" opacity="0.3"/>
  
  <!-- Taillight -->
  <circle cx="75" cy="130" r="3" fill="#FF0000" opacity="0.8"/>
  <circle cx="75" cy="130" r="2" fill="#FF4500"/>
  
  <!-- Footpegs -->
  <rect x="85" y="160" width="8" height="3" fill="#2F2F2F" stroke="#000000" stroke-width="0.5" rx="1"/>
  <rect x="107" y="160" width="8" height="3" fill="#2F2F2F" stroke="#000000" stroke-width="0.5" rx="1"/>
  
  <!-- Brake disc (front) -->
  <circle cx="140" cy="155" r="8" fill="#C0C0C0" stroke="#A9A9A9" stroke-width="1"/>
  <circle cx="140" cy="155" r="6" fill="none" stroke="#696969" stroke-width="0.5" stroke-dasharray="1,1"/>
  
  <!-- Brake disc (rear) -->
  <circle cx="60" cy="155" r="7" fill="#C0C0C0" stroke="#A9A9A9" stroke-width="1"/>
  <circle cx="60" cy="155" r="5" fill="none" stroke="#696969" stroke-width="0.5" stroke-dasharray="1,1"/>
  
  <!-- Brake calipers -->
  <rect x="132" y="150" width="6" height="10" fill="#FFD700" stroke="#FFA500" stroke-width="0.5" rx="1"/>
  <rect x="52" y="150" width="6" height="10" fill="#FFD700" stroke="#FFA500" stroke-width="0.5" rx="1"/>
  
  <!-- Chain -->
  <ellipse cx="90" cy="155" rx="12" ry="6" fill="none" stroke="#696969" stroke-width="1.5" stroke-dasharray="2,2"/>
  
  <!-- Sprockets -->
  <circle cx="85" cy="155" r="5" fill="#C0C0C0" stroke="#A9A9A9" stroke-width="1"/>
  <circle cx="60" cy="155" r="6" fill="#C0C0C0" stroke="#A9A9A9" stroke-width="1"/>
  
  <!-- Mirrors -->
  <line x1="115" y1="105" x2="110" y2="100" stroke="#2F2F2F" stroke-width="1"/>
  <circle cx="110" cy="100" r="3" fill="#87CEEB" stroke="#4682B4" stroke-width="0.5" opacity="0.8"/>
  
  <line x1="135" y1="105" x2="140" y2="100" stroke="#2F2F2F" stroke-width="1"/>
  <circle cx="140" cy="100" r="3" fill="#87CEEB" stroke="#4682B4" stroke-width="0.5" opacity="0.8"/>
  
  <!-- Speedometer -->
  <circle cx="125" cy="110" r="4" fill="#000000" stroke="#2F2F2F" stroke-width="1"/>
  <circle cx="125" cy="110" r="3" fill="#FFFFFF"/>
  <line x1="125" y1="110" x2="127" y2="108" stroke="#FF0000" stroke-width="1"/>
  
  <!-- Turn signals -->
  <circle cx="120" cy="120" r="2" fill="#FFA500" opacity="0.8"/>
  <circle cx="130" cy="120" r="2" fill="#FFA500" opacity="0.8"/>
  
  <!-- License plate -->
  <rect x="70" y="165" width="20" height="6" fill="#FFFFFF" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="80" y="170" text-anchor="middle" font-family="Arial" font-size="4" fill="#000000">MOTO-01</text>
  
  <!-- Kickstand -->
  <line x1="85" y1="155" x2="80" y2="175" stroke="#2F2F2F" stroke-width="2"/>
  <circle cx="80" cy="175" r="1.5" fill="#2F2F2F"/>
  
  <!-- Tire treads -->
  <circle cx="60" cy="155" r="20" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="140" cy="155" r="18" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Suspension (front) -->
  <rect x="138" y="135" width="4" height="15" fill="#C0C0C0" stroke="#A9A9A9" stroke-width="0.5"/>
  <rect x="139" y="137" width="2" height="11" fill="#FFD700"/>
  
  <!-- Suspension (rear) -->
  <rect x="70" y="140" width="3" height="12" fill="#C0C0C0" stroke="#A9A9A9" stroke-width="0.5"/>
  <rect x="70.5" y="142" width="2" height="8" fill="#FFD700"/>
  
  <!-- Ground contact -->
  <ellipse cx="60" cy="177" rx="10" ry="2" fill="#000000" opacity="0.2"/>
  <ellipse cx="140" cy="175" rx="8" ry="2" fill="#000000" opacity="0.2"/>
  <ellipse cx="80" cy="175" rx="3" ry="1" fill="#000000" opacity="0.2"/>
  
  <!-- Motorcycle nameplate -->
  <rect x="75" y="190" width="50" height="8" fill="#FF0000" stroke="#CC0000" stroke-width="0.5"/>
  <text x="100" y="196" text-anchor="middle" font-family="Arial" font-size="6" fill="#FFFFFF">MOTORCYCLE</text>
</svg>