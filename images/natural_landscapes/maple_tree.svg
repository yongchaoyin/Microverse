<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="100" cy="185" rx="65" ry="8" fill="#000000" opacity="0.3"/>
  
  <!-- Ground area -->
  <ellipse cx="100" cy="185" rx="60" ry="6" fill="#8FBC8F"/>
  <ellipse cx="100" cy="185" rx="55" ry="4" fill="#9ACD32"/>
  
  <!-- Tree trunk -->
  <rect x="90" y="120" width="20" height="65" fill="#8B4513" stroke="#654321" stroke-width="2" rx="5"/>
  <rect x="92" y="122" width="16" height="61" fill="#A0522D" rx="4"/>
  
  <!-- Trunk texture and bark details -->
  <line x1="95" y1="125" x2="95" y2="180" stroke="#654321" stroke-width="1" opacity="0.6"/>
  <line x1="105" y1="125" x2="105" y2="180" stroke="#654321" stroke-width="1" opacity="0.6"/>
  <ellipse cx="98" cy="135" rx="2.5" ry="1.5" fill="#654321" opacity="0.4"/>
  <ellipse cx="102" cy="155" rx="2" ry="1" fill="#654321" opacity="0.4"/>
  <ellipse cx="97" cy="175" rx="3" ry="1.8" fill="#654321" opacity="0.4"/>
  
  <!-- Tree roots -->
  <ellipse cx="75" cy="182" rx="12" ry="4" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  <ellipse cx="125" cy="182" rx="12" ry="4" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  <ellipse cx="100" cy="185" rx="18" ry="3" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  
  <!-- Main branches -->
  <rect x="75" y="115" width="18" height="5" fill="#8B4513" stroke="#654321" stroke-width="1" rx="2.5" transform="rotate(-30 84 117.5)"/>
  <rect x="107" y="115" width="18" height="5" fill="#8B4513" stroke="#654321" stroke-width="1" rx="2.5" transform="rotate(30 116 117.5)"/>
  <rect x="80" y="105" width="15" height="4" fill="#8B4513" stroke="#654321" stroke-width="1" rx="2" transform="rotate(-45 87.5 107)"/>
  <rect x="105" y="105" width="15" height="4" fill="#8B4513" stroke="#654321" stroke-width="1" rx="2" transform="rotate(45 112.5 107)"/>
  <rect x="95" y="100" width="10" height="3" fill="#8B4513" stroke="#654321" stroke-width="1" rx="1.5"/>
  
  <!-- Maple crown - multiple layers for fullness -->
  <ellipse cx="100" cy="85" rx="40" ry="30" fill="#FF6347" stroke="#DC143C" stroke-width="1" opacity="0.8"/>
  <ellipse cx="100" cy="80" rx="35" ry="25" fill="#FF4500" stroke="#FF6347" stroke-width="1" opacity="0.9"/>
  <ellipse cx="100" cy="75" rx="30" ry="20" fill="#FFD700" stroke="#FF4500" stroke-width="1" opacity="0.8"/>
  
  <!-- Additional crown layers for autumn colors -->
  <ellipse cx="85" cy="90" rx="20" ry="15" fill="#FF8C00" opacity="0.7"/>
  <ellipse cx="115" cy="90" rx="20" ry="15" fill="#FF8C00" opacity="0.7"/>
  <ellipse cx="100" cy="70" rx="25" ry="18" fill="#FFA500" opacity="0.8"/>
  
  <!-- Maple leaf clusters -->
  <!-- Large maple leaves -->
  <g transform="translate(80,85) rotate(-15)">
    <path d="M 0,0 L -5,-8 L -3,-12 L 0,-10 L 3,-12 L 5,-8 L 8,-5 L 5,-2 L 8,2 L 5,5 L 0,3 L -5,5 L -8,2 L -5,-2 L -8,-5 Z" fill="#DC143C" stroke="#8B0000" stroke-width="0.5"/>
  </g>
  <g transform="translate(120,85) rotate(15)">
    <path d="M 0,0 L -5,-8 L -3,-12 L 0,-10 L 3,-12 L 5,-8 L 8,-5 L 5,-2 L 8,2 L 5,5 L 0,3 L -5,5 L -8,2 L -5,-2 L -8,-5 Z" fill="#FF4500" stroke="#8B0000" stroke-width="0.5"/>
  </g>
  <g transform="translate(100,75) rotate(0)">
    <path d="M 0,0 L -4,-6 L -2,-9 L 0,-8 L 2,-9 L 4,-6 L 6,-4 L 4,-1 L 6,1 L 4,4 L 0,2 L -4,4 L -6,1 L -4,-1 L -6,-4 Z" fill="#FFD700" stroke="#8B0000" stroke-width="0.5"/>
  </g>
  <g transform="translate(90,95) rotate(-25)">
    <path d="M 0,0 L -4,-6 L -2,-9 L 0,-8 L 2,-9 L 4,-6 L 6,-4 L 4,-1 L 6,1 L 4,4 L 0,2 L -4,4 L -6,1 L -4,-1 L -6,-4 Z" fill="#FF6347" stroke="#8B0000" stroke-width="0.5"/>
  </g>
  <g transform="translate(110,95) rotate(25)">
    <path d="M 0,0 L -4,-6 L -2,-9 L 0,-8 L 2,-9 L 4,-6 L 6,-4 L 4,-1 L 6,1 L 4,4 L 0,2 L -4,4 L -6,1 L -4,-1 L -6,-4 Z" fill="#FF8C00" stroke="#8B0000" stroke-width="0.5"/>
  </g>
  
  <!-- Medium maple leaves -->
  <g transform="translate(75,100) rotate(-30)">
    <path d="M 0,0 L -3,-5 L -1.5,-7 L 0,-6 L 1.5,-7 L 3,-5 L 4.5,-3 L 3,-1 L 4.5,1 L 3,3 L 0,1.5 L -3,3 L -4.5,1 L -3,-1 L -4.5,-3 Z" fill="#FFA500" stroke="#8B0000" stroke-width="0.3"/>
  </g>
  <g transform="translate(125,100) rotate(30)">
    <path d="M 0,0 L -3,-5 L -1.5,-7 L 0,-6 L 1.5,-7 L 3,-5 L 4.5,-3 L 3,-1 L 4.5,1 L 3,3 L 0,1.5 L -3,3 L -4.5,1 L -3,-1 L -4.5,-3 Z" fill="#DC143C" stroke="#8B0000" stroke-width="0.3"/>
  </g>
  <g transform="translate(95,110) rotate(-10)">
    <path d="M 0,0 L -3,-5 L -1.5,-7 L 0,-6 L 1.5,-7 L 3,-5 L 4.5,-3 L 3,-1 L 4.5,1 L 3,3 L 0,1.5 L -3,3 L -4.5,1 L -3,-1 L -4.5,-3 Z" fill="#FF4500" stroke="#8B0000" stroke-width="0.3"/>
  </g>
  <g transform="translate(105,110) rotate(10)">
    <path d="M 0,0 L -3,-5 L -1.5,-7 L 0,-6 L 1.5,-7 L 3,-5 L 4.5,-3 L 3,-1 L 4.5,1 L 3,3 L 0,1.5 L -3,3 L -4.5,1 L -3,-1 L -4.5,-3 Z" fill="#FFD700" stroke="#8B0000" stroke-width="0.3"/>
  </g>
  
  <!-- Small maple leaves scattered -->
  <g transform="translate(70,110) rotate(-45)">
    <path d="M 0,0 L -2,-3 L -1,-4.5 L 0,-4 L 1,-4.5 L 2,-3 L 3,-2 L 2,-0.5 L 3,0.5 L 2,2 L 0,1 L -2,2 L -3,0.5 L -2,-0.5 L -3,-2 Z" fill="#FF6347" stroke="#8B0000" stroke-width="0.2"/>
  </g>
  <g transform="translate(130,110) rotate(45)">
    <path d="M 0,0 L -2,-3 L -1,-4.5 L 0,-4 L 1,-4.5 L 2,-3 L 3,-2 L 2,-0.5 L 3,0.5 L 2,2 L 0,1 L -2,2 L -3,0.5 L -2,-0.5 L -3,-2 Z" fill="#FFA500" stroke="#8B0000" stroke-width="0.2"/>
  </g>
  
  <!-- Maple seeds (helicopters) -->
  <g transform="translate(85,120) rotate(-20)">
    <ellipse cx="0" cy="0" rx="1" ry="8" fill="#8B4513"/>
    <ellipse cx="0" cy="-6" rx="0.5" ry="2" fill="#654321"/>
  </g>
  <g transform="translate(115,120) rotate(20)">
    <ellipse cx="0" cy="0" rx="1" ry="8" fill="#8B4513"/>
    <ellipse cx="0" cy="-6" rx="0.5" ry="2" fill="#654321"/>
  </g>
  <g transform="translate(100,125) rotate(0)">
    <ellipse cx="0" cy="0" rx="1" ry="8" fill="#8B4513"/>
    <ellipse cx="0" cy="-6" rx="0.5" ry="2" fill="#654321"/>
  </g>
  
  <!-- Small branches visible through leaves -->
  <line x1="85" y1="95" x2="75" y2="105" stroke="#8B4513" stroke-width="2" opacity="0.6"/>
  <line x1="115" y1="95" x2="125" y2="105" stroke="#8B4513" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="85" x2="95" y2="75" stroke="#8B4513" stroke-width="1.5" opacity="0.6"/>
  <line x1="100" y1="85" x2="105" y2="75" stroke="#8B4513" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Birds in tree -->
  <ellipse cx="75" cy="85" rx="2.5" ry="1.5" fill="#000000" opacity="0.7"/>
  <circle cx="73" cy="85" r="0.8" fill="#000000" opacity="0.7"/>
  <ellipse cx="125" cy="90" rx="2.5" ry="1.5" fill="#000000" opacity="0.7"/>
  <circle cx="123" cy="90" r="0.8" fill="#000000" opacity="0.7"/>
  
  <!-- Fallen maple leaves around base -->
  <g transform="translate(75,180) rotate(25)">
    <path d="M 0,0 L -3,-5 L -1.5,-7 L 0,-6 L 1.5,-7 L 3,-5 L 4.5,-3 L 3,-1 L 4.5,1 L 3,3 L 0,1.5 L -3,3 L -4.5,1 L -3,-1 L -4.5,-3 Z" fill="#DC143C" stroke="#8B0000" stroke-width="0.3" opacity="0.8"/>
  </g>
  <g transform="translate(125,182) rotate(-15)">
    <path d="M 0,0 L -3,-5 L -1.5,-7 L 0,-6 L 1.5,-7 L 3,-5 L 4.5,-3 L 3,-1 L 4.5,1 L 3,3 L 0,1.5 L -3,3 L -4.5,1 L -3,-1 L -4.5,-3 Z" fill="#FF8C00" stroke="#8B0000" stroke-width="0.3" opacity="0.8"/>
  </g>
  <g transform="translate(90,185) rotate(45)">
    <path d="M 0,0 L -2.5,-4 L -1.2,-5.5 L 0,-5 L 1.2,-5.5 L 2.5,-4 L 3.5,-2.5 L 2.5,-0.8 L 3.5,0.8 L 2.5,2.5 L 0,1.2 L -2.5,2.5 L -3.5,0.8 L -2.5,-0.8 L -3.5,-2.5 Z" fill="#FFD700" stroke="#8B0000" stroke-width="0.3" opacity="0.8"/>
  </g>
  <g transform="translate(110,183) rotate(-30)">
    <path d="M 0,0 L -2.5,-4 L -1.2,-5.5 L 0,-5 L 1.2,-5.5 L 2.5,-4 L 3.5,-2.5 L 2.5,-0.8 L 3.5,0.8 L 2.5,2.5 L 0,1.2 L -2.5,2.5 L -3.5,0.8 L -2.5,-0.8 L -3.5,-2.5 Z" fill="#FF4500" stroke="#8B0000" stroke-width="0.3" opacity="0.8"/>
  </g>
  <g transform="translate(100,187) rotate(10)">
    <path d="M 0,0 L -2.5,-4 L -1.2,-5.5 L 0,-5 L 1.2,-5.5 L 2.5,-4 L 3.5,-2.5 L 2.5,-0.8 L 3.5,0.8 L 2.5,2.5 L 0,1.2 L -2.5,2.5 L -3.5,0.8 L -2.5,-0.8 L -3.5,-2.5 Z" fill="#FFA500" stroke="#8B0000" stroke-width="0.3" opacity="0.8"/>
  </g>
  
  <!-- Squirrel in tree -->
  <ellipse cx="95" cy="105" rx="3" ry="2" fill="#8B4513"/>
  <circle cx="93" cy="104" r="1.5" fill="#8B4513"/>
  <ellipse cx="92" cy="103" rx="0.5" ry="1" fill="#654321"/>
  <circle cx="91.5" cy="102.5" r="0.3" fill="#000000"/>
  
  <!-- Tree name plate -->
  <rect x="75" y="190" width="50" height="8" fill="#DC143C" stroke="#8B0000" stroke-width="0.5"/>
  <text x="100" y="196" text-anchor="middle" font-family="Arial" font-size="6" fill="#FFFFFF">MAPLE TREE</text>
</svg>