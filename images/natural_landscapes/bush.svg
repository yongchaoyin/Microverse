<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="100" cy="185" rx="60" ry="8" fill="#000000" opacity="0.3"/>
  
  <!-- Ground area -->
  <ellipse cx="100" cy="185" rx="55" ry="6" fill="#8FBC8F"/>
  <ellipse cx="100" cy="185" rx="50" ry="4" fill="#9ACD32"/>
  
  <!-- Bush base and root area -->
  <ellipse cx="100" cy="180" rx="45" ry="8" fill="#654321" stroke="#8B4513" stroke-width="1"/>
  <ellipse cx="100" cy="182" rx="40" ry="6" fill="#8B4513"/>
  
  <!-- Main bush structure - multiple rounded clusters -->
  <ellipse cx="100" cy="140" rx="40" ry="35" fill="#228B22" stroke="#006400" stroke-width="1" opacity="0.8"/>
  <ellipse cx="100" cy="135" rx="35" ry="30" fill="#32CD32" stroke="#228B22" stroke-width="1" opacity="0.9"/>
  
  <!-- Additional bush clusters for natural shape -->
  <ellipse cx="80" cy="150" rx="25" ry="20" fill="#228B22" opacity="0.7"/>
  <ellipse cx="120" cy="150" rx="25" ry="20" fill="#228B22" opacity="0.7"/>
  <ellipse cx="90" cy="125" rx="20" ry="15" fill="#32CD32" opacity="0.8"/>
  <ellipse cx="110" cy="125" rx="20" ry="15" fill="#32CD32" opacity="0.8"/>
  <ellipse cx="100" cy="115" rx="18" ry="12" fill="#9ACD32" opacity="0.8"/>
  
  <!-- Side clusters for fuller appearance -->
  <ellipse cx="70" cy="160" rx="18" ry="15" fill="#228B22" opacity="0.6"/>
  <ellipse cx="130" cy="160" rx="18" ry="15" fill="#228B22" opacity="0.6"/>
  <ellipse cx="75" cy="140" rx="15" ry="12" fill="#32CD32" opacity="0.7"/>
  <ellipse cx="125" cy="140" rx="15" ry="12" fill="#32CD32" opacity="0.7"/>
  
  <!-- Small branches and stems -->
  <rect x="95" y="170" width="3" height="15" fill="#8B4513" stroke="#654321" stroke-width="0.5" rx="1.5"/>
  <rect x="105" y="172" width="2.5" height="12" fill="#8B4513" stroke="#654321" stroke-width="0.5" rx="1.25"/>
  <rect x="88" y="175" width="2" height="10" fill="#8B4513" stroke="#654321" stroke-width="0.5" rx="1"/>
  <rect x="112" y="174" width="2" height="11" fill="#8B4513" stroke="#654321" stroke-width="0.5" rx="1"/>
  
  <!-- Detailed leaves scattered throughout -->
  <ellipse cx="85" cy="145" rx="3" ry="5" fill="#32CD32" transform="rotate(-20 85 145)" opacity="0.9"/>
  <ellipse cx="115" cy="145" rx="3" ry="5" fill="#32CD32" transform="rotate(20 115 145)" opacity="0.9"/>
  <ellipse cx="95" cy="130" rx="2.5" ry="4" fill="#9ACD32" transform="rotate(-10 95 130)" opacity="0.9"/>
  <ellipse cx="105" cy="130" rx="2.5" ry="4" fill="#9ACD32" transform="rotate(10 105 130)" opacity="0.9"/>
  <ellipse cx="75" cy="155" rx="2" ry="3.5" fill="#228B22" transform="rotate(-30 75 155)" opacity="0.8"/>
  <ellipse cx="125" cy="155" rx="2" ry="3.5" fill="#228B22" transform="rotate(30 125 155)" opacity="0.8"/>
  
  <!-- More scattered leaves for density -->
  <ellipse cx="90" cy="140" rx="2" ry="3" fill="#32CD32" transform="rotate(-15 90 140)" opacity="0.8"/>
  <ellipse cx="110" cy="140" rx="2" ry="3" fill="#32CD32" transform="rotate(15 110 140)" opacity="0.8"/>
  <ellipse cx="80" cy="135" rx="1.8" ry="2.8" fill="#9ACD32" transform="rotate(-25 80 135)" opacity="0.8"/>
  <ellipse cx="120" cy="135" rx="1.8" ry="2.8" fill="#9ACD32" transform="rotate(25 120 135)" opacity="0.8"/>
  <ellipse cx="100" cy="120" rx="2.2" ry="3.2" fill="#ADFF2F" transform="rotate(0 100 120)" opacity="0.8"/>
  
  <!-- Bush flowers (small colorful blooms) -->
  <circle cx="88" cy="135" r="2" fill="#FF69B4" stroke="#FF1493" stroke-width="0.5"/>
  <circle cx="112" cy="135" r="2" fill="#FF69B4" stroke="#FF1493" stroke-width="0.5"/>
  <circle cx="95" cy="125" r="1.8" fill="#FFB6C1" stroke="#FF69B4" stroke-width="0.5"/>
  <circle cx="105" cy="125" r="1.8" fill="#FFB6C1" stroke="#FF69B4" stroke-width="0.5"/>
  <circle cx="100" cy="115" r="1.5" fill="#FFC0CB" stroke="#FFB6C1" stroke-width="0.5"/>
  <circle cx="82" cy="150" r="1.6" fill="#DA70D6" stroke="#BA55D3" stroke-width="0.5"/>
  <circle cx="118" cy="150" r="1.6" fill="#DA70D6" stroke="#BA55D3" stroke-width="0.5"/>
  
  <!-- Flower centers -->
  <circle cx="88" cy="135" r="0.8" fill="#FFD700"/>
  <circle cx="112" cy="135" r="0.8" fill="#FFD700"/>
  <circle cx="95" cy="125" r="0.7" fill="#FFD700"/>
  <circle cx="105" cy="125" r="0.7" fill="#FFD700"/>
  <circle cx="100" cy="115" r="0.6" fill="#FFD700"/>
  <circle cx="82" cy="150" r="0.6" fill="#FFD700"/>
  <circle cx="118" cy="150" r="0.6" fill="#FFD700"/>
  
  <!-- Berries on bush -->
  <circle cx="92" cy="140" r="1.2" fill="#DC143C"/>
  <circle cx="108" cy="140" r="1.2" fill="#DC143C"/>
  <circle cx="85" cy="155" r="1" fill="#8B0000"/>
  <circle cx="115" cy="155" r="1" fill="#8B0000"/>
  <circle cx="98" cy="148" r="0.8" fill="#B22222"/>
  <circle cx="102" cy="148" r="0.8" fill="#B22222"/>
  
  <!-- Small twigs and branch details -->
  <line x1="85" y1="145" x2="80" y2="140" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
  <line x1="115" y1="145" x2="120" y2="140" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
  <line x1="95" y1="130" x2="90" y2="125" stroke="#8B4513" stroke-width="0.8" opacity="0.6"/>
  <line x1="105" y1="130" x2="110" y2="125" stroke="#8B4513" stroke-width="0.8" opacity="0.6"/>
  <line x1="100" y1="120" x2="100" y2="115" stroke="#8B4513" stroke-width="0.6" opacity="0.6"/>
  
  <!-- Insects around bush -->
  <circle cx="78" cy="130" r="0.8" fill="#FFD700" opacity="0.7"/>
  <ellipse cx="77" cy="129" rx="1.5" ry="0.5" fill="#000000" opacity="0.3"/>
  <circle cx="122" cy="135" r="0.8" fill="#FFD700" opacity="0.7"/>
  <ellipse cx="121" cy="134" rx="1.5" ry="0.5" fill="#000000" opacity="0.3"/>
  
  <!-- Butterfly near flowers -->
  <ellipse cx="90" cy="120" rx="2" ry="1" fill="#FF69B4" opacity="0.8"/>
  <ellipse cx="88" cy="120" rx="1.5" ry="0.8" fill="#FFB6C1" opacity="0.8"/>
  <ellipse cx="92" cy="120" rx="1.5" ry="0.8" fill="#FFB6C1" opacity="0.8"/>
  <line x1="90" y1="119" x2="90" y2="121" stroke="#000000" stroke-width="0.3"/>
  
  <!-- Fallen leaves around bush -->
  <ellipse cx="70" cy="180" rx="2.5" ry="4" fill="#32CD32" transform="rotate(25 70 180)" opacity="0.7"/>
  <ellipse cx="130" cy="182" rx="2.5" ry="4" fill="#228B22" transform="rotate(-15 130 182)" opacity="0.7"/>
  <ellipse cx="85" cy="185" rx="2" ry="3" fill="#9ACD32" transform="rotate(45 85 185)" opacity="0.7"/>
  <ellipse cx="115" cy="183" rx="2" ry="3" fill="#32CD32" transform="rotate(-30 115 183)" opacity="0.7"/>
  <ellipse cx="100" cy="187" rx="2.2" ry="3.5" fill="#ADFF2F" transform="rotate(10 100 187)" opacity="0.7"/>
  
  <!-- Small seedlings around bush -->
  <rect x="65" y="175" width="1" height="8" fill="#228B22" rx="0.5"/>
  <ellipse cx="65" cy="172" rx="2" ry="1.5" fill="#32CD32" opacity="0.6"/>
  <rect x="135" y="177" width="1" height="6" fill="#228B22" rx="0.5"/>
  <ellipse cx="135" cy="175" rx="1.8" ry="1.2" fill="#32CD32" opacity="0.6"/>
  
  <!-- Wind effect on leaves -->
  <path d="M 75 140 Q 70 145 75 150" fill="none" stroke="#228B22" stroke-width="1" opacity="0.5"/>
  <path d="M 125 140 Q 130 145 125 150" fill="none" stroke="#228B22" stroke-width="1" opacity="0.5"/>
  <path d="M 95 125 Q 90 130 95 135" fill="none" stroke="#32CD32" stroke-width="0.8" opacity="0.5"/>
  <path d="M 105 125 Q 110 130 105 135" fill="none" stroke="#32CD32" stroke-width="0.8" opacity="0.5"/>
  
  <!-- Bush name plate -->
  <rect x="75" y="190" width="50" height="8" fill="#228B22" stroke="#006400" stroke-width="0.5"/>
  <text x="100" y="196" text-anchor="middle" font-family="Arial" font-size="6" fill="#FFFFFF">BUSH</text>
</svg>