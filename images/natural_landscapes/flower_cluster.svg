<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="100" cy="185" rx="55" ry="8" fill="#000000" opacity="0.3"/>
  
  <!-- Ground area -->
