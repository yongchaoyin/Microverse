    <ellipse cx="0" cy="0" rx="8" ry="6" fill="#FF69B4" stroke="#FF1493" stroke-width="0.5" transform="rotate(0)"/>
    <ellipse cx="0" cy="0" rx="8" ry="6" fill="#FF69B4" stroke="#FF1493" stroke-width="0.5" transform="rotate(45)"/>
    <ellipse cx="0" cy="0" rx="8" ry="6" fill="#FF69B4" stroke="#FF1493" stroke-width="0.5" transform="rotate(90)"/>
    <ellipse cx="0" cy="0" rx="8" ry="6" fill="#FF69B4" stroke="#FF1493" stroke-width="0.5" transform="rotate(135)"/>
    <!-- Middle petals -->
    <ellipse cx="0" cy="0" rx="6" ry="4" fill="#FFB6C1" stroke="#FF69B4" stroke-width="0.5" transform="rotate(22.5)"/>
    <ellipse cx="0" cy="0" rx="6" ry="4" fill="#FFB6C1" stroke="#FF69B4" stroke-width="0.5" transform="rotate(67.5)"/>
    <ellipse cx="0" cy="0" rx="6" ry="4" fill="#FFB6C1" stroke="#FF69B4" stroke-width="0.5" transform="rotate(112.5)"/>
    <ellipse cx="0" cy="0" rx="6" ry="4" fill="#FFB6C1" stroke="#FF69B4" stroke-width="0.5" transform="rotate(157.5)"/>
