  <line x1="110" y1="167" x2="110" y2="177" stroke="#006400" stroke-width="0.5" opacity="0.7"/>
  <line x1="100" y1="163" x2="100" y2="173" stroke="#006400" stroke-width="0.5" opacity="0.7"/>
  
