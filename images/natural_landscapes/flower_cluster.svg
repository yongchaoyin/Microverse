  <line x1="111" y1="144" x2="113" y2="144" stroke="#000000" stroke-width="0.2"/>
  <line x1="111" y1="146" x2="113" y2="146" stroke="#000000" stroke-width="0.2"/>
  
  <ellipse cx="94" cy="165" rx="1.5" ry="0.8" fill="#FFD700"/>
  <ellipse cx="94" cy="165" rx="1.2" ry="0.6" fill="#000000" opacity="0.3"/>
  <line x1="93" y1="164" x2="95" y2="164" stroke="#000000" stroke-width="0.2"/>
  <line x1="93" y1="166" x2="95" y2="166" stroke="#000000" stroke-width="0.2"/>
  
