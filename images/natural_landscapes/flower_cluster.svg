    <ellipse cx="0" cy="0" rx="5" ry="4" fill="#DA70D6" stroke="#BA55D3" stroke-width="0.4" transform="rotate(0)"/>
    <ellipse cx="0" cy="0" rx="5" ry="4" fill="#DA70D6" stroke="#BA55D3" stroke-width="0.4" transform="rotate(72)"/>
    <ellipse cx="0" cy="0" rx="5" ry="4" fill="#DA70D6" stroke="#BA55D3" stroke-width="0.4" transform="rotate(144)"/>
    <ellipse cx="0" cy="0" rx="5" ry="4" fill="#DA70D6" stroke="#BA55D3" stroke-width="0.4" transform="rotate(216)"/>
    <ellipse cx="0" cy="0" rx="5" ry="4" fill="#DA70D6" stroke="#BA55D3" stroke-width="0.4" transform="rotate(288)"/>
