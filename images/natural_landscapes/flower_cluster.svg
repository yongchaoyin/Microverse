    <ellipse cx="0" cy="0" rx="3" ry="2.5" fill="#ADFF2F" stroke="#9ACD32" stroke-width="0.3" transform="rotate(180)"/>
    <ellipse cx="0" cy="0" rx="3" ry="2.5" fill="#ADFF2F" stroke="#9ACD32" stroke-width="0.3" transform="rotate(240)"/>
    <ellipse cx="0" cy="0" rx="3" ry="2.5" fill="#ADFF2F" stroke="#9ACD32" stroke-width="0.3" transform="rotate(300)"/>
