  <ellipse cx="100" cy="185" rx="45" ry="4" fill="#9ACD32"/>
  
  <!-- Soil and root area -->
  <ellipse cx="100" cy="182" rx="40" ry="6" fill="#654321" stroke="#8B4513" stroke-width="1"/>
  <ellipse cx="100" cy="184" rx="35" ry="4" fill="#8B4513"/>
  
  <!-- Flower stems -->
  <rect x="95" y="150" width="2" height="35" fill="#228B22" stroke="#006400" stroke-width="0.5" rx="1"/>
  <rect x="105" y="155" width="2" height="30" fill="#228B22" stroke="#006400" stroke-width="0.5" rx="1"/>
  <rect x="88" y="160" width="1.8" height="25" fill="#228B22" stroke="#006400" stroke-width="0.5" rx="0.9"/>
  <rect x="112" y="158" width="1.8" height="27" fill="#228B22" stroke="#006400" stroke-width="0.5" rx="0.9"/>
  <rect x="100" y="145" width="2.2" height="40" fill="#228B22" stroke="#006400" stroke-width="0.5" rx="1.1"/>
