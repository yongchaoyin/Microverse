  <ellipse cx="125" cy="182" rx="1.8" ry="0.9" fill="#DA70D6" transform="rotate(-15 125 182)" opacity="0.7"/>
  <ellipse cx="85" cy="185" rx="1.5" ry="0.8" fill="#FFD700" transform="rotate(45 85 185)" opacity="0.7"/>
  <ellipse cx="115" cy="183" rx="1.5" ry="0.8" fill="#87CEEB" transform="rotate(-30 115 183)" opacity="0.7"/>
  <ellipse cx="100" cy="187" rx="1.8" ry="1" fill="#FF6347" transform="rotate(10 100 187)" opacity="0.7"/>
  <ellipse cx="90" cy="186" rx="1.2" ry="0.6" fill="#DDA0DD" transform="rotate(-20 90 186)" opacity="0.7"/>
  <ellipse cx="110" cy="186" rx="1.2" ry="0.6" fill="#ADFF2F" transform="rotate(35 110 186)" opacity="0.7"/>
  
