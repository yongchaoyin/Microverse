    <ellipse cx="0" cy="0" rx="5" ry="4" fill="#FF6347" stroke="#DC143C" stroke-width="0.4" transform="rotate(144)"/>
    <ellipse cx="0" cy="0" rx="5" ry="4" fill="#FF6347" stroke="#DC143C" stroke-width="0.4" transform="rotate(216)"/>
    <ellipse cx="0" cy="0" rx="5" ry="4" fill="#FF6347" stroke="#DC143C" stroke-width="0.4" transform="rotate(288)"/>
