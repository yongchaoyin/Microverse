    <ellipse cx="0" cy="0" rx="2.5" ry="2" fill="#DDA0DD" stroke="#9370DB" stroke-width="0.3" transform="rotate(45)"/>
    <ellipse cx="0" cy="0" rx="2.5" ry="2" fill="#DDA0DD" stroke="#9370DB" stroke-width="0.3" transform="rotate(90)"/>
    <ellipse cx="0" cy="0" rx="2.5" ry="2" fill="#DDA0DD" stroke="#9370DB" stroke-width="0.3" transform="rotate(135)"/>
