  <rect x="70" y="175" width="0.8" height="10" fill="#228B22" rx="0.4"/>
  <rect x="72" y="177" width="0.6" height="8" fill="#32CD32" rx="0.3"/>
  <rect x="128" y="176" width="0.8" height="9" fill="#228B22" rx="0.4"/>
  <rect x="130" y="178" width="0.6" height="7" fill="#32CD32" rx="0.3"/>
  <rect x="75" y="172" width="0.5" height="13" fill="#9ACD32" rx="0.25"/>
  <rect x="125" y="173" width="0.5" height="12" fill="#9ACD32" rx="0.25"/>
  
  <!-- Dewdrops on petals -->
  <circle cx="98" cy="142" r="0.8" fill="#E0F6FF" stroke="#B0E0E6" stroke-width="0.2" opacity="0.8"/>
  <circle cx="102" cy="157" r="0.6" fill="#E0F6FF" stroke="#B0E0E6" stroke-width="0.2" opacity="0.8"/>
  <circle cx="91" cy="162" r="0.5" fill="#E0F6FF" stroke="#B0E0E6" stroke-width="0.2" opacity="0.8"/>
  
  <!-- Flower cluster name plate -->
  <rect x="70" y="190" width="60" height="8" fill="#FF69B4" stroke="#FF1493" stroke-width="0.5"/>
  <text x="100" y="196" text-anchor="middle" font-family="Arial" font-size="6" fill="#FFFFFF">FLOWER CLUSTER</text>
