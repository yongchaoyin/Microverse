    <ellipse cx="1" cy="0" rx="2" ry="1" fill="#FFB6C1" opacity="0.8"/>
    <line x1="0" y1="-1" x2="0" y2="1" stroke="#000000" stroke-width="0.3"/>
    <circle cx="-0.5" cy="-0.5" r="0.2" fill="#000000"/>
    <circle cx="0.5" cy="-0.5" r="0.2" fill="#000000"/>
  </g>
  
  <g transform="translate(88,152)">
    <ellipse cx="0" cy="0" rx="2.5" ry="1.2" fill="#FFD700" opacity="0.8"/>
    <ellipse cx="-0.8" cy="0" rx="1.5" ry="0.8" fill="#FFA500" opacity="0.8"/>
    <ellipse cx="0.8" cy="0" rx="1.5" ry="0.8" fill="#FFA500" opacity="0.8"/>
    <line x1="0" y1="-0.8" x2="0" y2="0.8" stroke="#000000" stroke-width="0.2"/>
