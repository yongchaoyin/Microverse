    <ellipse cx="0" cy="0" rx="3" ry="2.5" fill="#FFD700" stroke="#FFA500" stroke-width="0.3" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="3" ry="2.5" fill="#FFD700" stroke="#FFA500" stroke-width="0.3" transform="rotate(120)"/>
