    <ellipse cx="0" cy="0" rx="4" ry="3" fill="#FFC0CB" stroke="#FFB6C1" stroke-width="0.5" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="4" ry="3" fill="#FFC0CB" stroke="#FFB6C1" stroke-width="0.5" transform="rotate(120)"/>
