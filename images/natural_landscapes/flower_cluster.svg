  <ellipse cx="108" cy="148" rx="1.8" ry="3.5" fill="#DA70D6" stroke="#BA55D3" stroke-width="0.5" transform="rotate(15 108 148)"/>
  <ellipse cx="85" cy="155" rx="1.5" ry="3" fill="#FFD700" stroke="#FFA500" stroke-width="0.5" transform="rotate(-20 85 155)"/>
