  <ellipse cx="115" cy="174" rx="3.5" ry="7" fill="#32CD32" stroke="#228B22" stroke-width="0.5" transform="rotate(45 115 174)"/>
  <ellipse cx="100" cy="168" rx="5" ry="9" fill="#228B22" stroke="#006400" stroke-width="0.5" transform="rotate(0 100 168)"/>
  <ellipse cx="95" cy="175" rx="3" ry="6" fill="#32CD32" stroke="#228B22" stroke-width="0.5" transform="rotate(-15 95 175)"/>
  <ellipse cx="105" cy="176" rx="3" ry="6" fill="#32CD32" stroke="#228B22" stroke-width="0.5" transform="rotate(15 105 176)"/>
  
