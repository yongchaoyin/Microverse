<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="100" cy="185" rx="45" ry="8" fill="#000000" opacity="0.4"/>
  
  <!-- Ground area -->
  <ellipse cx="100" cy="185" rx="40" ry="6" fill="#8FBC8F"/>
  <ellipse cx="100" cy="185" rx="35" ry="4" fill="#9ACD32"/>
  
  <!-- Main rock body -->
  <ellipse cx="100" cy="150" rx="35" ry="30" fill="#696969" stroke="#2F4F4F" stroke-width="2"/>
  <ellipse cx="100" cy="145" rx="30" ry="25" fill="#778899" stroke="#696969" stroke-width="1"/>
  
  <!-- Rock surface details and texture -->
  <ellipse cx="100" cy="140" rx="25" ry="20" fill="#808080" stroke="#696969" stroke-width="1"/>
  <ellipse cx="100" cy="138" rx="20" ry="15" fill="#A9A9A9" stroke="#808080" stroke-width="0.5"/>
  
  <!-- Rock cracks and fissures -->
  <path d="M 80 135 Q 90 140 100 135 Q 110 130 120 140" fill="none" stroke="#2F4F4F" stroke-width="1.5"/>
  <path d="M 85 150 Q 95 155 105 150 Q 115 145 125 155" fill="none" stroke="#2F4F4F" stroke-width="1.2"/>
  <path d="M 75 160 Q 85 165 95 160" fill="none" stroke="#2F4F4F" stroke-width="1"/>
  <path d="M 105 165 Q 115 170 125 165" fill="none" stroke="#2F4F4F" stroke-width="1"/>
  <path d="M 90 125 Q 100 130 110 125" fill="none" stroke="#2F4F4F" stroke-width="0.8"/>
  
  <!-- Vertical cracks -->
  <line x1="88" y1="130" x2="85" y2="165" stroke="#2F4F4F" stroke-width="1" opacity="0.8"/>
  <line x1="112" y1="128" x2="115" y2="168" stroke="#2F4F4F" stroke-width="1" opacity="0.8"/>
  <line x1="100" y1="125" x2="98" y2="170" stroke="#2F4F4F" stroke-width="0.8" opacity="0.6"/>
  
  <!-- Rock surface highlights -->
  <ellipse cx="92" cy="135" rx="8" ry="6" fill="#C0C0C0" opacity="0.6"/>
  <ellipse cx="108" cy="140" rx="6" ry="4" fill="#C0C0C0" opacity="0.5"/>
  <ellipse cx="100" cy="128" rx="5" ry="3" fill="#DCDCDC" opacity="0.7"/>
  <ellipse cx="85" cy="145" rx="4" ry="3" fill="#C0C0C0" opacity="0.4"/>
  <ellipse cx="115" cy="148" rx="4" ry="3" fill="#C0C0C0" opacity="0.4"/>
  
  <!-- Rock surface shadows -->
  <ellipse cx="105" cy="155" rx="12" ry="8" fill="#2F4F4F" opacity="0.3"/>
  <ellipse cx="88" cy="160" rx="8" ry="5" fill="#2F4F4F" opacity="0.2"/>
  <ellipse cx="112" cy="162" rx="8" ry="5" fill="#2F4F4F" opacity="0.2"/>
  
  <!-- Smaller rocks around main rock -->
  <ellipse cx="75" cy="170" rx="8" ry="6" fill="#696969" stroke="#2F4F4F" stroke-width="1"/>
  <ellipse cx="75" cy="168" rx="6" ry="4" fill="#778899"/>
  <ellipse cx="74" cy="167" rx="4" ry="3" fill="#A9A9A9" opacity="0.8"/>
  
  <ellipse cx="125" cy="175" rx="10" ry="8" fill="#696969" stroke="#2F4F4F" stroke-width="1"/>
  <ellipse cx="125" cy="173" rx="8" ry="6" fill="#778899"/>
  <ellipse cx="124" cy="172" rx="6" ry="4" fill="#A9A9A9" opacity="0.8"/>
  
  <ellipse cx="65" cy="180" rx="6" ry="4" fill="#696969" stroke="#2F4F4F" stroke-width="0.8"/>
  <ellipse cx="65" cy="179" rx="4" ry="3" fill="#778899"/>
  
  <ellipse cx="135" cy="182" rx="7" ry="5" fill="#696969" stroke="#2F4F4F" stroke-width="0.8"/>
  <ellipse cx="135" cy="181" rx="5" ry="4" fill="#778899"/>
  
  <!-- Pebbles scattered around -->
  <circle cx="70" cy="185" r="2" fill="#696969"/>
  <circle cx="72" cy="183" r="1.5" fill="#778899"/>
  <circle cx="130" cy="186" r="2.5" fill="#696969"/>
  <circle cx="132" cy="184" r="1.8" fill="#778899"/>
  <circle cx="85" cy="182" r="1.2" fill="#A9A9A9"/>
  <circle cx="115" cy="184" r="1.5" fill="#A9A9A9"/>
  <circle cx="95" cy="185" r="1" fill="#696969"/>
  <circle cx="105" cy="186" r="1.3" fill="#696969"/>
  
  <!-- Moss growing on rock -->
  <ellipse cx="82" cy="155" rx="6" ry="4" fill="#228B22" opacity="0.7" transform="rotate(-20 82 155)"/>
  <ellipse cx="118" cy="158" rx="5" ry="3" fill="#32CD32" opacity="0.6" transform="rotate(15 118 158)"/>
  <ellipse cx="95" cy="165" rx="4" ry="2.5" fill="#9ACD32" opacity="0.5" transform="rotate(-10 95 165)"/>
  <ellipse cx="108" cy="168" rx="3.5" ry="2" fill="#228B22" opacity="0.6" transform="rotate(25 108 168)"/>
  
  <!-- Lichen patches -->
  <circle cx="90" cy="140" r="2.5" fill="#ADFF2F" opacity="0.4"/>
  <circle cx="110" cy="145" r="2" fill="#7CFC00" opacity="0.4"/>
  <circle cx="85" cy="150" r="1.8" fill="#ADFF2F" opacity="0.3"/>
  <circle cx="115" cy="152" r="2.2" fill="#7CFC00" opacity="0.3"/>
  <circle cx="100" cy="160" r="1.5" fill="#9ACD32" opacity="0.4"/>
  
  <!-- Small plants growing in rock crevices -->
  <rect x="87" y="145" width="0.8" height="8" fill="#228B22" rx="0.4"/>
  <ellipse cx="87" cy="142" rx="1.5" ry="1" fill="#32CD32" opacity="0.7"/>
  <rect x="113" y="148" width="0.6" height="6" fill="#228B22" rx="0.3"/>
  <ellipse cx="113" cy="146" rx="1.2" ry="0.8" fill="#32CD32" opacity="0.7"/>
  <rect x="98" y="152" width="0.5" height="5" fill="#228B22" rx="0.25"/>
  <ellipse cx="98" cy="150" rx="1" ry="0.6" fill="#9ACD32" opacity="0.7"/>
  
  <!-- Insects on rock -->
  <ellipse cx="92" cy="148" rx="1.5" ry="0.8" fill="#000000" opacity="0.6"/>
  <circle cx="91" cy="148" r="0.4" fill="#000000" opacity="0.6"/>
  <ellipse cx="108" cy="155" rx="1.2" ry="0.6" fill="#8B4513" opacity="0.6"/>
  <circle cx="107" cy="155" r="0.3" fill="#8B4513" opacity="0.6"/>
  
  <!-- Lizard on rock -->
  <ellipse cx="105" cy="135" rx="4" ry="1.5" fill="#228B22"/>
  <ellipse cx="103" cy="134" rx="1.5" ry="0.8" fill="#32CD32"/>
  <circle cx="102" cy="133.5" r="0.3" fill="#000000"/>
  <ellipse cx="107" cy="135" rx="2" ry="0.5" fill="#228B22"/>
  <line x1="101" y1="134" x2="99" y2="133" stroke="#228B22" stroke-width="0.5"/>
  <line x1="101" y1="136" x2="99" y2="137" stroke="#228B22" stroke-width="0.5"/>
  <line x1="107" y1="134" x2="109" y2="133" stroke="#228B22" stroke-width="0.5"/>
  <line x1="107" y1="136" x2="109" y2="137" stroke="#228B22" stroke-width="0.5"/>
  
  <!-- Water stains and weathering -->
  <ellipse cx="95" cy="150" rx="8" ry="5" fill="#2F4F4F" opacity="0.1"/>
  <ellipse cx="110" cy="160" rx="6" ry="4" fill="#2F4F4F" opacity="0.1"/>
  <ellipse cx="88" cy="165" rx="5" ry="3" fill="#2F4F4F" opacity="0.1"/>
  
  <!-- Crystal formations in rock -->
  <polygon points="93,142 95,140 97,142 95,144" fill="#E6E6FA" stroke="#9370DB" stroke-width="0.5" opacity="0.8"/>
  <polygon points="107,147 109,145 111,147 109,149" fill="#E6E6FA" stroke="#9370DB" stroke-width="0.5" opacity="0.8"/>
  <polygon points="100,158 101,156 102,158 101,160" fill="#E6E6FA" stroke="#9370DB" stroke-width="0.3" opacity="0.6"/>
  
  <!-- Fallen leaves on rock -->
  <ellipse cx="88" cy="162" rx="2" ry="3" fill="#8B4513" transform="rotate(25 88 162)" opacity="0.7"/>
  <ellipse cx="112" cy="165" rx="1.8" ry="2.5" fill="#A0522D" transform="rotate(-15 112 165)" opacity="0.7"/>
  <ellipse cx="102" cy="170" rx="1.5" ry="2" fill="#D2691E" transform="rotate(45 102 170)" opacity="0.7"/>
  
  <!-- Rock name plate -->
  <rect x="75" y="190" width="50" height="8" fill="#696969" stroke="#2F4F4F" stroke-width="0.5"/>
  <text x="100" y="196" text-anchor="middle" font-family="Arial" font-size="6" fill="#FFFFFF">ROCK</text>
</svg>