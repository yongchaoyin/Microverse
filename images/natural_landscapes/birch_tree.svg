<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="100" cy="185" rx="50" ry="8" fill="#000000" opacity="0.3"/>
  
  <!-- Ground area -->
  <ellipse cx="100" cy="185" rx="45" ry="6" fill="#8FBC8F"/>
  <ellipse cx="100" cy="185" rx="40" ry="4" fill="#9ACD32"/>
  
  <!-- Main birch trunk (characteristic white bark) -->
  <rect x="94" y="100" width="12" height="85" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1" rx="3"/>
  <rect x="95" y="101" width="10" height="83" fill="#FFFFFF" rx="2.5"/>
  
  <!-- Birch bark horizontal markings (distinctive feature) -->
  <line x1="94" y1="110" x2="106" y2="110" stroke="#000000" stroke-width="1.5"/>
  <line x1="94" y1="120" x2="106" y2="120" stroke="#000000" stroke-width="1"/>
  <line x1="94" y1="130" x2="106" y2="130" stroke="#000000" stroke-width="1.5"/>
  <line x1="94" y1="140" x2="106" y2="140" stroke="#000000" stroke-width="1"/>
  <line x1="94" y1="150" x2="106" y2="150" stroke="#000000" stroke-width="1.5"/>
  <line x1="94" y1="160" x2="106" y2="160" stroke="#000000" stroke-width="1"/>
  <line x1="94" y1="170" x2="106" y2="170" stroke="#000000" stroke-width="1.5"/>
  <line x1="94" y1="180" x2="106" y2="180" stroke="#000000" stroke-width="1"/>
  
  <!-- Birch bark texture and peeling details -->
  <rect x="96" y="125" width="2" height="8" fill="#E0E0E0" opacity="0.6" transform="rotate(5 97 129)"/>
  <rect x="102" y="145" width="1.5" height="6" fill="#E0E0E0" opacity="0.6" transform="rotate(-3 102.75 148)"/>
  <rect x="97" y="165" width="2.5" height="7" fill="#E0E0E0" opacity="0.6" transform="rotate(8 98.25 168.5)"/>
  
  <!-- Secondary birch trunks (birch often grows in clusters) -->
  <rect x="82" y="110" width="8" height="75" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1" rx="2"/>
  <rect x="83" y="111" width="6" height="73" fill="#FFFFFF" rx="1.5"/>
  
  <rect x="110" y="115" width="10" height="70" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1" rx="2.5"/>
  <rect x="111" y="116" width="8" height="68" fill="#FFFFFF" rx="2"/>
  
  <!-- Bark markings on secondary trunks -->
  <line x1="82" y1="125" x2="90" y2="125" stroke="#000000" stroke-width="1"/>
  <line x1="82" y1="140" x2="90" y2="140" stroke="#000000" stroke-width="1"/>
  <line x1="82" y1="155" x2="90" y2="155" stroke="#000000" stroke-width="1"/>
  <line x1="82" y1="170" x2="90" y2="170" stroke="#000000" stroke-width="1"/>
  
  <line x1="110" y1="130" x2="120" y2="130" stroke="#000000" stroke-width="1"/>
  <line x1="110" y1="145" x2="120" y2="145" stroke="#000000" stroke-width="1"/>
  <line x1="110" y1="160" x2="120" y2="160" stroke="#000000" stroke-width="1"/>
  <line x1="110" y1="175" x2="120" y2="175" stroke="#000000" stroke-width="1"/>
  
  <!-- Tree roots -->
  <ellipse cx="75" cy="182" rx="10" ry="3" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  <ellipse cx="125" cy="182" rx="10" ry="3" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  <ellipse cx="100" cy="185" rx="15" ry="2" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  
  <!-- Main branches -->
  <rect x="75" y="95" width="12" height="3" fill="#8B4513" stroke="#654321" stroke-width="1" rx="1.5" transform="rotate(-35 81 96.5)"/>
  <rect x="113" y="95" width="12" height="3" fill="#8B4513" stroke="#654321" stroke-width="1" rx="1.5" transform="rotate(35 119 96.5)"/>
  <rect x="80" y="85" width="10" height="2.5" fill="#8B4513" stroke="#654321" stroke-width="1" rx="1.25" transform="rotate(-50 85 86.25)"/>
  <rect x="110" y="85" width="10" height="2.5" fill="#8B4513" stroke="#654321" stroke-width="1" rx="1.25" transform="rotate(50 115 86.25)"/>
  
  <!-- Birch crown - delicate and airy appearance -->
  <ellipse cx="100" cy="70" rx="35" ry="25" fill="#9ACD32" stroke="#32CD32" stroke-width="1" opacity="0.7"/>
  <ellipse cx="100" cy="65" rx="30" ry="20" fill="#ADFF2F" stroke="#9ACD32" stroke-width="1" opacity="0.8"/>
  <ellipse cx="100" cy="60" rx="25" ry="15" fill="#7CFC00" stroke="#32CD32" stroke-width="1" opacity="0.7"/>
  
  <!-- Additional crown clusters for natural look -->
  <ellipse cx="80" cy="75" rx="18" ry="12" fill="#9ACD32" opacity="0.6"/>
  <ellipse cx="120" cy="75" rx="18" ry="12" fill="#9ACD32" opacity="0.6"/>
  <ellipse cx="90" cy="55" rx="15" ry="10" fill="#ADFF2F" opacity="0.7"/>
  <ellipse cx="110" cy="55" rx="15" ry="10" fill="#ADFF2F" opacity="0.7"/>
  
  <!-- Birch leaves (small and delicate) -->
  <ellipse cx="75" cy="80" rx="3" ry="5" fill="#32CD32" transform="rotate(-20 75 80)" opacity="0.8"/>
  <ellipse cx="125" cy="80" rx="3" ry="5" fill="#32CD32" transform="rotate(20 125 80)" opacity="0.8"/>
  <ellipse cx="85" cy="65" rx="2.5" ry="4" fill="#7CFC00" transform="rotate(-10 85 65)" opacity="0.8"/>
  <ellipse cx="115" cy="65" rx="2.5" ry="4" fill="#7CFC00" transform="rotate(10 115 65)" opacity="0.8"/>
  <ellipse cx="95" cy="50" rx="2" ry="3.5" fill="#ADFF2F" transform="rotate(-5 95 50)" opacity="0.8"/>
  <ellipse cx="105" cy="50" rx="2" ry="3.5" fill="#ADFF2F" transform="rotate(5 105 50)" opacity="0.8"/>
  
  <!-- More scattered leaves for fullness -->
  <ellipse cx="70" cy="85" rx="2" ry="3" fill="#9ACD32" transform="rotate(-30 70 85)" opacity="0.7"/>
  <ellipse cx="130" cy="85" rx="2" ry="3" fill="#9ACD32" transform="rotate(30 130 85)" opacity="0.7"/>
  <ellipse cx="80" cy="70" rx="1.8" ry="2.8" fill="#32CD32" transform="rotate(-15 80 70)" opacity="0.7"/>
  <ellipse cx="120" cy="70" rx="1.8" ry="2.8" fill="#32CD32" transform="rotate(15 120 70)" opacity="0.7"/>
  <ellipse cx="90" cy="45" rx="1.5" ry="2.5" fill="#7CFC00" transform="rotate(-8 90 45)" opacity="0.7"/>
  <ellipse cx="110" cy="45" rx="1.5" ry="2.5" fill="#7CFC00" transform="rotate(8 110 45)" opacity="0.7"/>
  
  <!-- Birch catkins (spring flowers) -->
  <ellipse cx="88" cy="90" rx="1" ry="8" fill="#FFFF99" transform="rotate(-15 88 90)"/>
  <ellipse cx="112" cy="90" rx="1" ry="8" fill="#FFFF99" transform="rotate(15 112 90)"/>
  <ellipse cx="95" cy="85" rx="0.8" ry="6" fill="#FFFF99" transform="rotate(-5 95 85)"/>
  <ellipse cx="105" cy="85" rx="0.8" ry="6" fill="#FFFF99" transform="rotate(5 105 85)"/>
  
  <!-- Small branches visible through leaves -->
  <line x1="85" y1="75" x2="75" y2="85" stroke="#8B4513" stroke-width="1.5" opacity="0.5"/>
  <line x1="115" y1="75" x2="125" y2="85" stroke="#8B4513" stroke-width="1.5" opacity="0.5"/>
  <line x1="95" y1="65" x2="90" y2="55" stroke="#8B4513" stroke-width="1" opacity="0.5"/>
  <line x1="105" y1="65" x2="110" y2="55" stroke="#8B4513" stroke-width="1" opacity="0.5"/>
  
  <!-- Birds in birch tree -->
  <ellipse cx="78" cy="75" rx="2" ry="1" fill="#000000" opacity="0.6"/>
  <circle cx="77" cy="75" r="0.5" fill="#000000" opacity="0.6"/>
  <ellipse cx="122" cy="80" rx="2" ry="1" fill="#000000" opacity="0.6"/>
  <circle cx="121" cy="80" r="0.5" fill="#000000" opacity="0.6"/>
  
  <!-- Fallen birch leaves -->
  <ellipse cx="75" cy="180" rx="2.5" ry="4" fill="#ADFF2F" transform="rotate(25 75 180)" opacity="0.7"/>
  <ellipse cx="125" cy="182" rx="2.5" ry="4" fill="#9ACD32" transform="rotate(-15 125 182)" opacity="0.7"/>
  <ellipse cx="85" cy="185" rx="2" ry="3" fill="#32CD32" transform="rotate(45 85 185)" opacity="0.7"/>
  <ellipse cx="115" cy="183" rx="2" ry="3" fill="#7CFC00" transform="rotate(-30 115 183)" opacity="0.7"/>
  <ellipse cx="100" cy="187" rx="2.2" ry="3.5" fill="#ADFF2F" transform="rotate(10 100 187)" opacity="0.7"/>
  <ellipse cx="90" cy="186" rx="1.8" ry="3" fill="#9ACD32" transform="rotate(-20 90 186)" opacity="0.7"/>
  <ellipse cx="110" cy="186" rx="1.8" ry="3" fill="#32CD32" transform="rotate(35 110 186)" opacity="0.7"/>
  
  <!-- Birch seeds -->
  <ellipse cx="82" cy="95" rx="0.5" ry="2" fill="#8B4513" transform="rotate(-10 82 95)"/>
  <ellipse cx="118" cy="95" rx="0.5" ry="2" fill="#8B4513" transform="rotate(10 118 95)"/>
  <ellipse cx="100" cy="90" rx="0.4" ry="1.8" fill="#8B4513"/>
  
  <!-- Wind effect on delicate branches -->
  <path d="M 70 80 Q 65 85 70 90" fill="none" stroke="#228B22" stroke-width="1" opacity="0.5"/>
  <path d="M 130 80 Q 135 85 130 90" fill="none" stroke="#228B22" stroke-width="1" opacity="0.5"/>
  <path d="M 85 60 Q 80 65 85 70" fill="none" stroke="#228B22" stroke-width="0.8" opacity="0.5"/>
  <path d="M 115 60 Q 120 65 115 70" fill="none" stroke="#228B22" stroke-width="0.8" opacity="0.5"/>
  
  <!-- Small insects around birch -->
  <circle cx="88" cy="110" r="0.6" fill="#FFD700" opacity="0.6"/>
  <circle cx="112" cy="115" r="0.6" fill="#FFD700" opacity="0.6"/>
  <circle cx="95" cy="125" r="0.5" fill="#FF69B4" opacity="0.6"/>
  
  <!-- Tree name plate -->
  <rect x="75" y="190" width="50" height="8" fill="#32CD32" stroke="#228B22" stroke-width="0.5"/>
  <text x="100" y="196" text-anchor="middle" font-family="Arial" font-size="6" fill="#FFFFFF">BIRCH TREE</text>
</svg>