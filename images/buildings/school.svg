<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="32" cy="60" rx="30" ry="3" fill="#000000" opacity="0.2"/>
  
  <!-- Main building -->
  <rect x="6" y="16" width="52" height="36" fill="#F5DEB3"/>
  
  <!-- Roof -->
  <polygon points="4,16 32,4 60,16" fill="#8B4513"/>
  <polygon points="4,16 32,4 60,16 58,18 32,6 6,18" fill="#A0522D"/>
  
  <!-- Central tower -->
  <rect x="28" y="8" width="8" height="8" fill="#F5DEB3"/>
  <polygon points="26,8 32,2 38,8" fill="#8B4513"/>
  
  <!-- Bell in tower -->
  <circle cx="32" cy="12" r="1.5" fill="#FFD700"/>
  <rect x="31.5" y="10.5" width="1" height="3" fill="#8B4513"/>
  
  <!-- Main entrance -->
  <rect x="28" y="40" width="8" height="12" fill="#8B4513"/>
  <rect x="28" y="40" width="8" height="2" fill="#A0522D"/>
  <circle cx="32" cy="46" r="0.5" fill="#FFD700"/>
  <rect x="30" y="42" width="4" height="6" fill="#654321"/>
  
  <!-- School sign -->
  <rect x="18" y="20" width="28" height="6" fill="#4169E1"/>
  <text x="32" y="24.5" text-anchor="middle" font-family="Arial" font-size="4" font-weight="bold" fill="#FFFFFF">SCHOOL</text>
  
  <!-- Windows -->
  <g fill="#87CEEB" stroke="#333333" stroke-width="0.3">
    <!-- Left side windows -->
    <rect x="10" y="28" width="6" height="6"/>
    <rect x="18" y="28" width="6" height="6"/>
    <rect x="10" y="36" width="6" height="6"/>
    <rect x="18" y="36" width="6" height="6"/>
    
    <!-- Right side windows -->
    <rect x="40" y="28" width="6" height="6"/>
    <rect x="48" y="28" width="6" height="6"/>
    <rect x="40" y="36" width="6" height="6"/>
    <rect x="48" y="36" width="6" height="6"/>
  </g>
  
  <!-- Window frames -->
  <g stroke="#8B4513" stroke-width="0.5" fill="none">
    <line x1="13" y1="28" x2="13" y2="34"/>
    <line x1="10" y1="31" x2="16" y2="31"/>
    <line x1="21" y1="28" x2="21" y2="34"/>
    <line x1="18" y1="31" x2="24" y2="31"/>
    <line x1="13" y1="36" x2="13" y2="42"/>
    <line x1="10" y1="39" x2="16" y2="39"/>
    <line x1="21" y1="36" x2="21" y2="42"/>
    <line x1="18" y1="39" x2="24" y2="39"/>
    
    <line x1="43" y1="28" x2="43" y2="34"/>
    <line x1="40" y1="31" x2="46" y2="31"/>
    <line x1="51" y1="28" x2="51" y2="34"/>
    <line x1="48" y1="31" x2="54" y2="31"/>
    <line x1="43" y1="36" x2="43" y2="42"/>
    <line x1="40" y1="39" x2="46" y2="39"/>
    <line x1="51" y1="36" x2="51" y2="42"/>
    <line x1="48" y1="39" x2="54" y2="39"/>
  </g>
  
  <!-- Classroom scenes in windows -->
  <rect x="11" y="29" width="4" height="2" fill="#8B4513"/>
  <circle cx="12" cy="32" r="0.5" fill="#FFB6C1"/>
  <circle cx="14" cy="32" r="0.5" fill="#FFB6C1"/>
  
  <rect x="19" y="29" width="4" height="2" fill="#8B4513"/>
  <circle cx="20" cy="32" r="0.5" fill="#FFB6C1"/>
  <circle cx="22" cy="32" r="0.5" fill="#FFB6C1"/>
  
  <!-- Flag pole -->
  <rect x="2" y="20" width="1" height="20" fill="#8B4513"/>
  <rect x="3" y="20" width="6" height="4" fill="#FF0000"/>
  <rect x="3" y="22" width="6" height="2" fill="#FFFFFF"/>
  
  <!-- Playground equipment -->
  <rect x="60" y="48" width="2" height="8" fill="#8B4513"/>
  <rect x="58" y="48" width="6" height="2" fill="#FFD700"/>
  <circle cx="61" cy="50" r="1" fill="#FF69B4"/>
  
  <!-- Basketball hoop -->
  <rect x="4" y="44" width="1" height="8" fill="#8B4513"/>
  <rect x="2" y="44" width="5" height="1" fill="#FF8C00"/>
  <circle cx="4.5" cy="45" r="1.5" fill="none" stroke="#FF8C00" stroke-width="0.5"/>
  
  <!-- School bus -->
  <rect x="8" y="54" width="16" height="4" fill="#FFD700"/>
  <rect x="8" y="54" width="16" height="1" fill="#FFA500"/>
  <rect x="10" y="55" width="2" height="1.5" fill="#87CEEB"/>
  <rect x="14" y="55" width="2" height="1.5" fill="#87CEEB"/>
  <rect x="18" y="55" width="2" height="1.5" fill="#87CEEB"/>
  <circle cx="11" cy="58" r="1" fill="#333333"/>
  <circle cx="21" cy="58" r="1" fill="#333333"/>
  <rect x="22" y="55" width="1.5" height="1" fill="#FF0000"/>
  <text x="22.7" y="55.7" text-anchor="middle" font-family="Arial" font-size="0.8" fill="#FFFFFF">STOP</text>
  
  <!-- Entrance steps -->
  <rect x="24" y="52" width="16" height="2" fill="#D3D3D3"/>
  <rect x="26" y="54" width="12" height="2" fill="#C0C0C0"/>
  
  <!-- Landscaping -->
  <circle cx="12" cy="58" r="2" fill="#228B22"/>
  <circle cx="52" cy="58" r="2" fill="#228B22"/>
  <circle cx="14" cy="59" r="0.5" fill="#FF69B4"/>
  <circle cx="50" cy="59" r="0.5" fill="#FF69B4"/>
  
  <!-- Parking area -->
  <rect x="0" y="56" width="64" height="4" fill="#A0A0A0"/>
  <line x1="0" y1="58" x2="64" y2="58" stroke="#FFFFFF" stroke-width="0.5" stroke-dasharray="2,2"/>
  
  <!-- Building details -->
  <rect x="6" y="16" width="2" height="36" fill="#DEB887"/>
  <rect x="56" y="16" width="2" height="36" fill="#DEB887"/>
  
  <!-- Chimney -->
  <rect x="48" y="6" width="3" height="10" fill="#8B4513"/>
  <rect x="47" y="6" width="5" height="1" fill="#A0522D"/>
  
  <!-- Smoke from chimney -->
  <circle cx="49.5" cy="4" r="0.8" fill="#D3D3D3" opacity="0.7"/>
  <circle cx="50.5" cy="2" r="1" fill="#D3D3D3" opacity="0.5"/>
  <circle cx="51.5" cy="0.5" r="0.6" fill="#D3D3D3" opacity="0.3"/>
</svg>