<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="32" cy="60" rx="28" ry="3" fill="#000000" opacity="0.2"/>
  
  <!-- Main building -->
  <rect x="10" y="16" width="44" height="40" fill="#F5F5DC"/>
  
  <!-- Roof -->
  <polygon points="8,16 32,4 56,16" fill="#8B4513"/>
  <polygon points="8,16 32,4 56,16 54,14 32,2 10,14" fill="#A0522D"/>
  
  <!-- Front columns -->
  <rect x="16" y="32" width="3" height="24" fill="#DCDCDC"/>
  <rect x="22" y="32" width="3" height="24" fill="#DCDCDC"/>
  <rect x="28" y="32" width="3" height="24" fill="#DCDCDC"/>
  <rect x="34" y="32" width="3" height="24" fill="#DCDCDC"/>
  <rect x="40" y="32" width="3" height="24" fill="#DCDCDC"/>
  <rect x="46" y="32" width="3" height="24" fill="#DCDCDC"/>
  
  <!-- Column capitals -->
  <rect x="15" y="30" width="5" height="2" fill="#E0E0E0"/>
  <rect x="21" y="30" width="5" height="2" fill="#E0E0E0"/>
  <rect x="27" y="30" width="5" height="2" fill="#E0E0E0"/>
  <rect x="33" y="30" width="5" height="2" fill="#E0E0E0"/>
  <rect x="39" y="30" width="5" height="2" fill="#E0E0E0"/>
  <rect x="45" y="30" width="5" height="2" fill="#E0E0E0"/>
  
  <!-- Main entrance -->
  <rect x="26" y="44" width="12" height="12" fill="#8B4513"/>
  <rect x="26" y="44" width="12" height="3" fill="#A0522D"/>
  <circle cx="32" cy="50" r="0.8" fill="#FFD700"/>
  <rect x="28" y="46" width="8" height="8" fill="#654321"/>
  
  <!-- Large windows -->
  <rect x="12" y="20" width="8" height="10" fill="#87CEEB"/>
  <rect x="44" y="20" width="8" height="10" fill="#87CEEB"/>
  
  <!-- Side windows -->
  <rect x="12" y="36" width="6" height="8" fill="#87CEEB"/>
  <rect x="46" y="36" width="6" height="8" fill="#87CEEB"/>
  
  <!-- Window frames -->
  <g stroke="#333333" stroke-width="0.5" fill="none">
    <rect x="12" y="20" width="8" height="10"/>
    <rect x="44" y="20" width="8" height="10"/>
    <rect x="12" y="36" width="6" height="8"/>
    <rect x="46" y="36" width="6" height="8"/>
    
    <!-- Window cross frames -->
    <line x1="16" y1="20" x2="16" y2="30"/>
    <line x1="12" y1="25" x2="20" y2="25"/>
    <line x1="48" y1="20" x2="48" y2="30"/>
    <line x1="44" y1="25" x2="52" y2="25"/>
    <line x1="15" y1="36" x2="15" y2="44"/>
    <line x1="12" y1="40" x2="18" y2="40"/>
    <line x1="49" y1="36" x2="49" y2="44"/>
    <line x1="46" y1="40" x2="52" y2="40"/>
  </g>
  
  <!-- Library sign -->
  <rect x="18" y="8" width="28" height="6" fill="#4B0082"/>
  <text x="32" y="12" text-anchor="middle" font-family="Arial" font-size="4" font-weight="bold" fill="#FFFFFF">LIBRARY</text>
  
  <!-- Book symbol -->
  <rect x="30" y="18" width="4" height="6" fill="#8B4513"/>
  <rect x="30.5" y="18.5" width="3" height="5" fill="#DEB887"/>
  <line x1="30.5" y1="20" x2="33.5" y2="20" stroke="#8B4513" stroke-width="0.2"/>
  <line x1="30.5" y1="21.5" x2="33.5" y2="21.5" stroke="#8B4513" stroke-width="0.2"/>
  <line x1="30.5" y1="23" x2="33.5" y2="23" stroke="#8B4513" stroke-width="0.2"/>
  
  <!-- Entrance steps -->
  <rect x="22" y="56" width="20" height="2" fill="#D3D3D3"/>
  <rect x="24" y="58" width="16" height="2" fill="#C0C0C0"/>
  
  <!-- Reading area outside -->
  <rect x="6" y="48" width="8" height="6" fill="#32CD32"/>
  <rect x="50" y="48" width="8" height="6" fill="#32CD32"/>
  
  <!-- Outdoor benches -->
  <rect x="7" y="50" width="6" height="1" fill="#8B4513"/>
  <rect x="51" y="50" width="6" height="1" fill="#8B4513"/>
  
  <!-- Book return box -->
  <rect x="54" y="40" width="4" height="6" fill="#4682B4"/>
  <rect x="54.5" y="41" width="3" height="2" fill="#87CEEB"/>
  <text x="56" y="44" text-anchor="middle" font-family="Arial" font-size="2" fill="#FFFFFF">BOOKS</text>
  
  <!-- Landscaping -->
  <circle cx="8" cy="58" r="1.5" fill="#228B22"/>
  <circle cx="56" cy="58" r="1.5" fill="#228B22"/>
  <circle cx="10" cy="59" r="0.5" fill="#FF69B4"/>
  <circle cx="54" cy="59" r="0.5" fill="#FF69B4"/>
  
  <!-- Front plaza -->
  <rect x="6" y="54" width="52" height="4" fill="#F0F8FF"/>
  
  <!-- Building details -->
  <rect x="10" y="16" width="2" height="40" fill="#E0E0E0"/>
  <rect x="52" y="16" width="2" height="40" fill="#E0E0E0"/>
  
  <!-- Decorative frieze -->
  <rect x="10" y="28" width="44" height="2" fill="#DDD"/>
  <g fill="#999" font-family="Arial" font-size="1.5">
    <text x="14" y="29.5">📚</text>
    <text x="20" y="29.5">📖</text>
    <text x="26" y="29.5">📚</text>
    <text x="32" y="29.5">📖</text>
    <text x="38" y="29.5">📚</text>
    <text x="44" y="29.5">📖</text>
    <text x="50" y="29.5">📚</text>
  </g>
</svg>