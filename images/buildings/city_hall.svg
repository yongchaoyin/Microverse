<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="32" cy="60" rx="30" ry="3" fill="#000000" opacity="0.2"/>
  
  <!-- Main building base -->
  <rect x="8" y="20" width="48" height="36" fill="#F5F5DC"/>
  
  <!-- Central tower -->
  <rect x="26" y="8" width="12" height="48" fill="#F0F0F0"/>
  
  <!-- Left wing -->
  <rect x="8" y="24" width="18" height="32" fill="#F5F5DC"/>
  
  <!-- Right wing -->
  <rect x="38" y="24" width="18" height="32" fill="#F5F5DC"/>
  
  <!-- Central dome -->
  <circle cx="32" cy="12" r="6" fill="#4682B4"/>
  <circle cx="32" cy="12" r="5" fill="#5A9BD4"/>
  <circle cx="32" cy="12" r="3" fill="#6BB6FF"/>
  
  <!-- Dome flag pole -->
  <rect x="31.5" y="6" width="1" height="6" fill="#8B4513"/>
  <rect x="32.5" y="7" width="3" height="2" fill="#FF0000"/>
  
  <!-- Main entrance columns -->
  <rect x="28" y="40" width="2" height="16" fill="#DCDCDC"/>
  <rect x="32" y="40" width="2" height="16" fill="#DCDCDC"/>
  <rect x="36" y="40" width="2" height="16" fill="#DCDCDC"/>
  
  <!-- Column capitals -->
  <rect x="27" y="38" width="4" height="2" fill="#E0E0E0"/>
  <rect x="31" y="38" width="4" height="2" fill="#E0E0E0"/>
  <rect x="35" y="38" width="4" height="2" fill="#E0E0E0"/>
  
  <!-- Main entrance -->
  <rect x="29" y="48" width="6" height="8" fill="#8B4513"/>
  <rect x="29" y="48" width="6" height="2" fill="#A0522D"/>
  <circle cx="32" cy="52" r="0.5" fill="#FFD700"/>
  <rect x="30" y="50" width="4" height="4" fill="#654321"/>
  
  <!-- Entrance steps -->
  <rect x="26" y="56" width="12" height="2" fill="#D3D3D3"/>
  <rect x="28" y="58" width="8" height="2" fill="#C0C0C0"/>
  
  <!-- Central tower windows -->
  <rect x="28" y="16" width="3" height="4" fill="#87CEEB"/>
  <rect x="33" y="16" width="3" height="4" fill="#87CEEB"/>
  <rect x="28" y="22" width="3" height="4" fill="#87CEEB"/>
  <rect x="33" y="22" width="3" height="4" fill="#87CEEB"/>
  <rect x="28" y="28" width="3" height="4" fill="#87CEEB"/>
  <rect x="33" y="28" width="3" height="4" fill="#87CEEB"/>
  <rect x="28" y="34" width="3" height="4" fill="#87CEEB"/>
  <rect x="33" y="34" width="3" height="4" fill="#87CEEB"/>
  
  <!-- Left wing windows -->
  <rect x="12" y="28" width="3" height="4" fill="#87CEEB"/>
  <rect x="18" y="28" width="3" height="4" fill="#87CEEB"/>
  <rect x="12" y="36" width="3" height="4" fill="#87CEEB"/>
  <rect x="18" y="36" width="3" height="4" fill="#87CEEB"/>
  <rect x="12" y="44" width="3" height="4" fill="#87CEEB"/>
  <rect x="18" y="44" width="3" height="4" fill="#87CEEB"/>
  
  <!-- Right wing windows -->
  <rect x="42" y="28" width="3" height="4" fill="#87CEEB"/>
  <rect x="48" y="28" width="3" height="4" fill="#87CEEB"/>
  <rect x="42" y="36" width="3" height="4" fill="#87CEEB"/>
  <rect x="48" y="36" width="3" height="4" fill="#87CEEB"/>
  <rect x="42" y="44" width="3" height="4" fill="#87CEEB"/>
  <rect x="48" y="44" width="3" height="4" fill="#87CEEB"/>
  
  <!-- Window frames -->
  <g stroke="#333333" stroke-width="0.5" fill="none">
    <!-- Central tower -->
    <rect x="28" y="16" width="3" height="4"/>
    <rect x="33" y="16" width="3" height="4"/>
    <rect x="28" y="22" width="3" height="4"/>
    <rect x="33" y="22" width="3" height="4"/>
    <rect x="28" y="28" width="3" height="4"/>
    <rect x="33" y="28" width="3" height="4"/>
    <rect x="28" y="34" width="3" height="4"/>
    <rect x="33" y="34" width="3" height="4"/>
    
    <!-- Left wing -->
    <rect x="12" y="28" width="3" height="4"/>
    <rect x="18" y="28" width="3" height="4"/>
    <rect x="12" y="36" width="3" height="4"/>
    <rect x="18" y="36" width="3" height="4"/>
    <rect x="12" y="44" width="3" height="4"/>
    <rect x="18" y="44" width="3" height="4"/>
    
    <!-- Right wing -->
    <rect x="42" y="28" width="3" height="4"/>
    <rect x="48" y="28" width="3" height="4"/>
    <rect x="42" y="36" width="3" height="4"/>
    <rect x="48" y="36" width="3" height="4"/>
    <rect x="42" y="44" width="3" height="4"/>
    <rect x="48" y="44" width="3" height="4"/>
  </g>
  
  <!-- Building sign -->
  <rect x="20" y="4" width="24" height="4" fill="#4169E1"/>
  <text x="32" y="7" text-anchor="middle" font-family="Arial" font-size="3" font-weight="bold" fill="#FFFFFF">CITY HALL</text>
  
  <!-- Clock on tower -->
  <circle cx="32" cy="30" r="2" fill="#FFFFFF"/>
  <circle cx="32" cy="30" r="2" fill="none" stroke="#333333" stroke-width="0.3"/>
  <line x1="32" y1="30" x2="32" y2="28.5" stroke="#333333" stroke-width="0.2"/>
  <line x1="32" y1="30" x2="33" y2="30" stroke="#333333" stroke-width="0.2"/>
  
  <!-- Front plaza -->
  <rect x="4" y="54" width="56" height="4" fill="#E6E6FA"/>
  
  <!-- Fountain in plaza -->
  <circle cx="16" cy="56" r="2" fill="#87CEEB"/>
  <circle cx="16" cy="56" r="1" fill="#B0E0E6"/>
  <circle cx="48" cy="56" r="2" fill="#87CEEB"/>
  <circle cx="48" cy="56" r="1" fill="#B0E0E6"/>
  
  <!-- Landscaping -->
  <circle cx="10" cy="58" r="1" fill="#228B22"/>
  <circle cx="54" cy="58" r="1" fill="#228B22"/>
  <circle cx="12" cy="59" r="0.5" fill="#FF69B4"/>
  <circle cx="52" cy="59" r="0.5" fill="#FF69B4"/>
  
  <!-- Building corners -->
  <rect x="8" y="20" width="2" height="36" fill="#E0E0E0"/>
  <rect x="54" y="20" width="2" height="36" fill="#E0E0E0"/>
  <rect x="26" y="8" width="2" height="48" fill="#E0E0E0"/>
  <rect x="36" y="8" width="2" height="48" fill="#E0E0E0"/>
