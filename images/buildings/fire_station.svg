<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="32" cy="60" rx="30" ry="3" fill="#000000" opacity="0.2"/>
  
  <!-- Main building -->
  <rect x="8" y="16" width="48" height="36" fill="#DC143C"/>
  
  <!-- Roof -->
  <polygon points="6,16 32,6 58,16" fill="#8B0000"/>
  <polygon points="6,16 32,6 58,16 56,18 32,8 10,18" fill="#A0522D"/>
  
  <!-- Fire department emblem on roof -->
  <circle cx="32" cy="12" r="2" fill="#FFD700"/>
  <rect x="30.5" y="10.5" width="3" height="3" fill="#FF0000"/>
  <rect x="31.5" y="11.5" width="1" height="1" fill="#FFFFFF"/>
  
  <!-- Large garage doors -->
  <rect x="12" y="32" width="16" height="20" fill="#8B0000"/>
  <rect x="36" y="32" width="16" height="20" fill="#8B0000"/>
  
  <!-- Garage door panels -->
  <g stroke="#A0522D" stroke-width="0.5">
    <line x1="12" y1="36" x2="28" y2="36"/>
    <line x1="12" y1="40" x2="28" y2="40"/>
    <line x1="12" y1="44" x2="28" y2="44"/>
    <line x1="12" y1="48" x2="28" y2="48"/>
    
    <line x1="36" y1="36" x2="52" y2="36"/>
    <line x1="36" y1="40" x2="52" y2="40"/>
    <line x1="36" y1="44" x2="52" y2="44"/>
    <line x1="36" y1="48" x2="52" y2="48"/>
  </g>
  
  <!-- Garage door handles -->
  <circle cx="26" cy="42" r="0.8" fill="#FFD700"/>
  <circle cx="50" cy="42" r="0.8" fill="#FFD700"/>
  
  <!-- Fire department sign -->
  <rect x="16" y="20" width="32" height="6" fill="#FFFFFF"/>
  <text x="32" y="24.5" text-anchor="middle" font-family="Arial" font-size="3" font-weight="bold" fill="#DC143C">FIRE DEPARTMENT</text>
  
  <!-- Windows -->
  <g fill="#87CEEB" stroke="#8B0000" stroke-width="0.3">
    <rect x="30" y="28" width="4" height="4"/>
  </g>
  
  <!-- Fire truck in left garage -->
  <rect x="14" y="44" width="12" height="6" fill="#FF0000"/>
  <rect x="14" y="44" width="12" height="1.5" fill="#FFFFFF"/>
  <rect x="16" y="45.5" width="2" height="2" fill="#87CEEB"/>
  <rect x="20" y="45.5" width="2" height="2" fill="#87CEEB"/>
  <circle cx="17" cy="50" r="1" fill="#333333"/>
  <circle cx="23" cy="50" r="1" fill="#333333"/>
  
  <!-- Fire truck ladder -->
  <rect x="15" y="43" width="10" height="1" fill="#C0C0C0"/>
  <g stroke="#8B4513" stroke-width="0.3">
    <line x1="16" y1="43" x2="16" y2="44"/>
    <line x1="18" y1="43" x2="18" y2="44"/>
    <line x1="20" y1="43" x2="20" y2="44"/>
    <line x1="22" y1="43" x2="22" y2="44"/>
    <line x1="24" y1="43" x2="24" y2="44"/>
  </g>
  
  <!-- Fire truck equipment -->
  <rect x="18" y="46" width="1" height="2" fill="#FFD700"/>
  <rect x="21" y="46" width="1" height="2" fill="#C0C0C0"/>
  
  <!-- Ambulance in right garage -->
  <rect x="38" y="44" width="12" height="6" fill="#FFFFFF"/>
  <rect x="38" y="44" width="12" height="1.5" fill="#FF0000"/>
  <rect x="40" y="45.5" width="2" height="2" fill="#87CEEB"/>
  <rect x="44" y="45.5" width="2" height="2" fill="#87CEEB"/>
  <circle cx="41" cy="50" r="1" fill="#333333"/>
  <circle cx="47" cy="50" r="1" fill="#333333"/>
  
  <!-- Red cross on ambulance -->
  <rect x="46" y="45" width="2" height="0.5" fill="#FF0000"/>
  <rect x="46.75" y="44.25" width="0.5" height="2" fill="#FF0000"/>
  
  <!-- Fire pole -->
  <rect x="31.5" y="16" width="1" height="16" fill="#C0C0C0"/>
  <circle cx="32" cy="16" r="0.5" fill="#FFD700"/>
  
  <!-- Fire alarm -->
  <rect x="54" y="26" width="2" height="2" fill="#FF0000"/>
  <circle cx="55" cy="27" r="0.5" fill="#FFFFFF"/>
  
  <!-- Fire hydrant -->
  <rect x="4" y="48" width="2" height="4" fill="#FF0000"/>
  <rect x="3" y="50" width="4" height="1" fill="#FF0000"/>
  <circle cx="5" cy="49" r="0.3" fill="#C0C0C0"/>
  <circle cx="5" cy="51" r="0.3" fill="#C0C0C0"/>
  
  <!-- Emergency lights -->
  <rect x="10" y="30" width="1" height="1" fill="#FF0000"/>
  <rect x="53" y="30" width="1" height="1" fill="#FF0000"/>
  
  <!-- Entrance steps -->
  <rect x="28" y="52" width="8" height="2" fill="#D3D3D3"/>
  <rect x="30" y="54" width="4" height="2" fill="#C0C0C0"/>
  
  <!-- Parking area -->
  <rect x="0" y="54" width="64" height="4" fill="#A0A0A0"/>
  <line x1="0" y1="56" x2="64" y2="56" stroke="#FFFFFF" stroke-width="0.5" stroke-dasharray="2,2"/>
  
  <!-- Emergency vehicle parking -->
  <rect x="56" y="54" width="8" height="4" fill="#FF0000" opacity="0.3"/>
  <text x="60" y="57" text-anchor="middle" font-family="Arial" font-size="1.5" font-weight="bold" fill="#FFFFFF">FIRE</text>
  
  <!-- Landscaping -->
  <circle cx="12" cy="58" r="1.5" fill="#228B22"/>
  <circle cx="52" cy="58" r="1.5" fill="#228B22"/>
  <circle cx="14" cy="59" r="0.5" fill="#FF0000"/>
  <circle cx="50" cy="59" r="0.5" fill="#FF0000"/>
  
  <!-- Building details -->
  <rect x="8" y="16" width="2" height="36" fill="#B22222"/>
  <rect x="54" y="16" width="2" height="36" fill="#B22222"/>
  
  <!-- Fire station number -->
  <circle cx="32" cy="28" r="2" fill="#FFFFFF"/>
  <text x="32" y="29.5" text-anchor="middle" font-family="Arial" font-size="2.5" font-weight="bold" fill="#DC143C">1</text>
  
  <!-- Smoke detector -->
  <circle cx="20" cy="30" r="0.8" fill="#FFFFFF"/>
  <circle cx="20" cy="30" r="0.4" fill="#FF0000"/>
  
  <!-- Fire extinguisher -->
  <rect x="58" y="46" width="2" height="4" fill="#FF0000"/>
  <rect x="58.5" y="45" width="1" height="1" fill="#C0C0C0"/>
  <circle cx="59" cy="46" r="0.3" fill="#333333"/>
</svg>