<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="32" cy="60" rx="28" ry="3" fill="#000000" opacity="0.2"/>
  
  <!-- Main building base -->
  <rect x="12" y="16" width="40" height="40" fill="#E0E0E0"/>
  <rect x="12" y="16" width="40" height="4" fill="#F0F0F0"/>
  
  <!-- Building floors -->
  <rect x="12" y="20" width="40" height="12" fill="#D0D0D0"/>
  <rect x="12" y="32" width="40" height="12" fill="#D0D0D0"/>
  <rect x="12" y="44" width="40" height="12" fill="#D0D0D0"/>
  
  <!-- Floor separators -->
  <line x1="12" y1="32" x2="52" y2="32" stroke="#B0B0B0" stroke-width="1"/>
  <line x1="12" y1="44" x2="52" y2="44" stroke="#B0B0B0" stroke-width="1"/>
  
  <!-- Windows - Floor 1 -->
  <rect x="16" y="22" width="6" height="8" fill="#87CEEB"/>
  <rect x="26" y="22" width="6" height="8" fill="#87CEEB"/>
  <rect x="36" y="22" width="6" height="8" fill="#87CEEB"/>
  <rect x="46" y="22" width="4" height="8" fill="#87CEEB"/>
  
  <!-- Windows - Floor 2 -->
  <rect x="16" y="34" width="6" height="8" fill="#87CEEB"/>
  <rect x="26" y="34" width="6" height="8" fill="#87CEEB"/>
  <rect x="36" y="34" width="6" height="8" fill="#87CEEB"/>
  <rect x="46" y="34" width="4" height="8" fill="#87CEEB"/>
  
  <!-- Windows - Floor 3 -->
  <rect x="16" y="46" width="6" height="8" fill="#87CEEB"/>
  <rect x="26" y="46" width="6" height="8" fill="#87CEEB"/>
  <rect x="36" y="46" width="6" height="8" fill="#87CEEB"/>
  <rect x="46" y="46" width="4" height="8" fill="#87CEEB"/>
  
  <!-- Window frames -->
  <g stroke="#333333" stroke-width="0.5" fill="none">
    <!-- Floor 1 -->
    <rect x="16" y="22" width="6" height="8"/>
    <rect x="26" y="22" width="6" height="8"/>
    <rect x="36" y="22" width="6" height="8"/>
    <rect x="46" y="22" width="4" height="8"/>
    <!-- Floor 2 -->
    <rect x="16" y="34" width="6" height="8"/>
    <rect x="26" y="34" width="6" height="8"/>
    <rect x="36" y="34" width="6" height="8"/>
    <rect x="46" y="34" width="4" height="8"/>
    <!-- Floor 3 -->
    <rect x="16" y="46" width="6" height="8"/>
    <rect x="26" y="46" width="6" height="8"/>
    <rect x="36" y="46" width="6" height="8"/>
    <rect x="46" y="46" width="4" height="8"/>
  </g>
  
  <!-- Window cross frames -->
  <g stroke="#333333" stroke-width="0.3">
    <!-- Floor 1 -->
    <line x1="19" y1="22" x2="19" y2="30"/>
    <line x1="16" y1="26" x2="22" y2="26"/>
    <line x1="29" y1="22" x2="29" y2="30"/>
    <line x1="26" y1="26" x2="32" y2="26"/>
    <line x1="39" y1="22" x2="39" y2="30"/>
    <line x1="36" y1="26" x2="42" y2="26"/>
    <line x1="48" y1="22" x2="48" y2="30"/>
    <line x1="46" y1="26" x2="50" y2="26"/>
    
    <!-- Floor 2 -->
    <line x1="19" y1="34" x2="19" y2="42"/>
    <line x1="16" y1="38" x2="22" y2="38"/>
    <line x1="29" y1="34" x2="29" y2="42"/>
    <line x1="26" y1="38" x2="32" y2="38"/>
    <line x1="39" y1="34" x2="39" y2="42"/>
    <line x1="36" y1="38" x2="42" y2="38"/>
    <line x1="48" y1="34" x2="48" y2="42"/>
    <line x1="46" y1="38" x2="50" y2="38"/>
    
    <!-- Floor 3 -->
    <line x1="19" y1="46" x2="19" y2="54"/>
    <line x1="16" y1="50" x2="22" y2="50"/>
    <line x1="29" y1="46" x2="29" y2="54"/>
    <line x1="26" y1="50" x2="32" y2="50"/>
    <line x1="39" y1="46" x2="39" y2="54"/>
    <line x1="36" y1="50" x2="42" y2="50"/>
    <line x1="48" y1="46" x2="48" y2="54"/>
    <line x1="46" y1="50" x2="50" y2="50"/>
  </g>
  
  <!-- Entrance -->
  <rect x="28" y="48" width="8" height="8" fill="#8B4513"/>
  <rect x="28" y="48" width="8" height="2" fill="#A0522D"/>
  <circle cx="34" cy="52" r="0.5" fill="#FFD700"/>
  <rect x="30" y="50" width="4" height="4" fill="#654321"/>
  
  <!-- Company sign -->
  <rect x="20" y="12" width="24" height="6" fill="#4169E1"/>
  <text x="32" y="16.5" text-anchor="middle" font-family="Arial" font-size="4" font-weight="bold" fill="#FFFFFF">OFFICE</text>
  
  <!-- Roof -->
  <rect x="10" y="14" width="44" height="4" fill="#A0A0A0"/>
  <rect x="10" y="14" width="44" height="2" fill="#B0B0B0"/>
  
  <!-- Air conditioning units -->
  <rect x="14" y="15" width="4" height="2" fill="#666666"/>
  <rect x="46" y="15" width="4" height="2" fill="#666666"/>
  
  <!-- Front landscaping -->
  <rect x="8" y="54" width="48" height="4" fill="#32CD32"/>
  <circle cx="16" cy="56" r="1" fill="#FF69B4"/>
  <circle cx="48" cy="56" r="1" fill="#FF69B4"/>
  
  <!-- Entrance steps -->
  <rect x="26" y="56" width="12" height="2" fill="#C0C0C0"/>
  <rect x="28" y="58" width="8" height="2" fill="#B0B0B0"/>
  
  <!-- Building corners -->
  <rect x="12" y="16" width="2" height="40" fill="#C0C0C0"/>
  <rect x="50" y="16" width="2" height="40" fill="#C0C0C0"/>
</svg>