<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="32" cy="60" rx="28" ry="3" fill="#000000" opacity="0.2"/>
  
  <!-- Main walls -->
  <rect x="8" y="20" width="48" height="36" fill="#4A4A4A"/>
  <rect x="8" y="20" width="48" height="4" fill="#5A5A5A"/>
  
  <!-- Roof -->
  <polygon points="6,20 32,8 58,20" fill="#2C2C2C"/>
  <polygon points="6,20 32,8 58,20 56,18 32,6 8,18" fill="#3C3C3C"/>
  
  <!-- GYM sign -->
  <rect x="20" y="12" width="24" height="8" fill="#FF4444"/>
  <text x="32" y="18" text-anchor="middle" font-family="Arial" font-size="6" font-weight="bold" fill="#FFFFFF">GYM</text>
  
  <!-- Large window showing interior -->
  <rect x="12" y="28" width="20" height="16" fill="#87CEEB"/>
  <rect x="12" y="28" width="20" height="16" fill="none" stroke="#333333" stroke-width="1"/>
  
  <!-- Interior gym equipment visible through window -->
  <rect x="14" y="32" width="4" height="8" fill="#666666"/>
  <rect x="20" y="34" width="6" height="4" fill="#444444"/>
  <circle cx="28" cy="36" r="2" fill="#333333"/>
  
  <!-- Door -->
  <rect x="36" y="32" width="8" height="24" fill="#8B4513"/>
  <rect x="36" y="32" width="8" height="2" fill="#A0522D"/>
  <circle cx="42" cy="44" r="0.5" fill="#FFD700"/>
  <rect x="38" y="36" width="4" height="6" fill="#654321"/>
  
  <!-- Small window on right -->
  <rect x="48" y="36" width="6" height="8" fill="#87CEEB"/>
  <rect x="48" y="36" width="6" height="8" fill="none" stroke="#333333" stroke-width="1"/>
  <line x1="51" y1="36" x2="51" y2="44" stroke="#333333" stroke-width="0.5"/>
  
  <!-- Awning -->
  <rect x="34" y="30" width="12" height="3" fill="#FF6666"/>
  <polygon points="34,30 46,30 48,33 32,33" fill="#FF4444"/>
  
  <!-- Outdoor exercise area -->
  <rect x="10" y="48" width="8" height="6" fill="#228B22"/>
  <rect x="12" y="50" width="4" height="2" fill="#32CD32"/>
  
  <!-- Exercise equipment outside -->
  <rect x="46" y="48" width="6" height="4" fill="#666666"/>
  <circle cx="49" cy="50" r="1" fill="#444444"/>
  
  <!-- Dumbbell decoration -->
  <rect x="24" y="50" width="6" height="1" fill="#333333"/>
  <rect x="23" y="49.5" width="2" height="2" fill="#444444"/>
  <rect x="29" y="49.5" width="2" height="2" fill="#444444"/>
  
  <!-- Front yard -->
  <rect x="8" y="54" width="48" height="4" fill="#32CD32"/>
  
  <!-- Motivational banner -->
  <rect x="14" y="24" width="16" height="3" fill="#FFD700"/>
  <text x="22" y="26.5" text-anchor="middle" font-family="Arial" font-size="3" fill="#000000">FITNESS</text>
  
  <!-- Small path -->
  <rect x="28" y="56" width="8" height="6" fill="#8B7355"/>
  
  <!-- Parking area markings -->
  <rect x="4" y="52" width="2" height="8" fill="#FFFFFF"/>
  <rect x="58" y="52" width="2" height="8" fill="#FFFFFF"/>
</svg>