<svg width="64" height="80" viewBox="0 0 64 80" xmlns="http://www.w3.org/2000/svg">
  <!-- 地面阴影 -->
  <ellipse cx="32" cy="75" rx="28" ry="4" fill="#000000" opacity="0.2"/>
  
  <!-- 房屋主体墙壁 -->
  <rect x="8" y="40" width="48" height="32" fill="#F5F5F5"/>
  
  <!-- 屋顶 -->
  <polygon points="4,40 32,16 60,40" fill="#1976D2"/>
  
  <!-- 屋顶瓦片纹理 -->
  <rect x="8" y="20" width="48" height="2" fill="#0D47A1"/>
  <rect x="8" y="24" width="48" height="2" fill="#0D47A1"/>
  <rect x="8" y="28" width="48" height="2" fill="#0D47A1"/>
  <rect x="8" y="32" width="48" height="2" fill="#0D47A1"/>
  <rect x="8" y="36" width="48" height="2" fill="#0D47A1"/>
  
  <!-- 屋顶高光 -->
  <polygon points="4,40 32,16 36,20 8,40" fill="#2196F3"/>
  
  <!-- 烟囱 -->
  <rect x="44" y="20" width="8" height="16" fill="#795548"/>
  <rect x="42" y="18" width="12" height="4" fill="#8D6E63"/>
  
  <!-- 烟雾 -->
  <circle cx="48" cy="14" r="2" fill="#E0E0E0" opacity="0.7"/>
  <circle cx="50" cy="10" r="1.5" fill="#E0E0E0" opacity="0.5"/>
  <circle cx="46" cy="8" r="1" fill="#E0E0E0" opacity="0.3"/>
  
  <!-- 前门 -->
  <rect x="26" y="52" width="12" height="20" fill="#795548"/>
  <rect x="27" y="53" width="10" height="18" fill="#8D6E63"/>
  
  <!-- 门把手 -->
  <circle cx="35" cy="62" r="1" fill="#FFD700"/>
  
  <!-- 门框 -->
  <rect x="25" y="51" width="14" height="2" fill="#5D4037"/>
  <rect x="25" y="51" width="2" height="21" fill="#5D4037"/>
  <rect x="37" y="51" width="2" height="21" fill="#5D4037"/>
  
  <!-- 左窗户 -->
  <rect x="12" y="48" width="10" height="8" fill="#81D4FA"/>
  <rect x="11" y="47" width="12" height="10" fill="#5D4037"/>
  <rect x="16" y="47" width="2" height="10" fill="#5D4037"/>
  <rect x="11" y="51" width="12" height="2" fill="#5D4037"/>
  
