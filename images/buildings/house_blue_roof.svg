  <rect x="41" y="47" width="12" height="10" fill="#5D4037"/>
  <rect x="46" y="47" width="2" height="10" fill="#5D4037"/>
  <rect x="41" y="51" width="12" height="2" fill="#5D4037"/>
  
  <!-- 窗户反光 -->
  <rect x="13" y="49" width="3" height="3" fill="#FFFFFF" opacity="0.6"/>
  <rect x="43" y="49" width="3" height="3" fill="#FFFFFF" opacity="0.6"/>
  
  <!-- 前院小花园 -->
  <rect x="4" y="72" width="56" height="8" fill="#4CAF50"/>
  
  <!-- 花朵装饰 -->
  <circle cx="12" cy="76" r="1" fill="#FFFFFF"/>
  <circle cx="20" cy="74" r="1" fill="#E91E63"/>
  <circle cx="44" cy="76" r="1" fill="#FFEB3B"/>
  <circle cx="52" cy="74" r="1" fill="#FFFFFF"/>
  
