<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="200" cy="385" rx="70" ry="12" fill="#000000" opacity="0.3"/>
  
  <!-- Ground area -->
  <rect x="0" y="370" width="400" height="30" fill="#f5f5f5"/>
  
  <!-- Safe base -->
  <rect x="150" y="350" width="100" height="20" fill="#1a1a1a"/>
  <rect x="148" y="348" width="104" height="4" fill="#2c2c2c"/>
  
  <!-- Main safe body -->
  <rect x="150" y="150" width="100" height="200" rx="3" fill="#2c3e50"/>
  <rect x="152" y="152" width="96" height="196" rx="2" fill="#34495e"/>
  
  <!-- Safe sides (3D effect) -->
  <polygon points="250,150 260,140 260,340 250,350" fill="#1a252f"/>
  <polygon points="150,150 160,140 260,140 250,150" fill="#4a5f7a"/>
  
  <!-- Safe door -->
  <rect x="155" y="155" width="86" height="186" rx="2" fill="#2c3e50"/>
  <rect x="157" y="157" width="82" height="182" rx="1" fill="#34495e"/>
  
  <!-- Door frame/seal -->
  <rect x="154" y="154" width="88" height="188" rx="2" fill="none" stroke="#1a252f" stroke-width="2"/>
  <rect x="156" y="156" width="84" height="184" rx="1" fill="none" stroke="#4a5f7a" stroke-width="1"/>
  
  <!-- Digital lock display -->
  <rect x="180" y="220" width="40" height="25" rx="3" fill="#000000"/>
  <rect x="182" y="222" width="36" height="21" rx="2" fill="#1a1a1a"/>
  <rect x="185" y="225" width="30" height="15" rx="1" fill="#2ecc71"/>
  <text x="200" y="235" text-anchor="middle" font-family="Arial" font-size="8" fill="#000000">8 8 8 8</text>
  
  <!-- Number pad -->
  <g>
    <!-- Row 1 -->
    <rect x="175" y="255" width="12" height="10" rx="2" fill="#7f8c8d"/>
    <rect x="190" y="255" width="12" height="10" rx="2" fill="#7f8c8d"/>
    <rect x="205" y="255" width="12" height="10" rx="2" fill="#7f8c8d"/>
    
    <!-- Row 2 -->
    <rect x="175" y="270" width="12" height="10" rx="2" fill="#7f8c8d"/>
    <rect x="190" y="270" width="12" height="10" rx="2" fill="#7f8c8d"/>
    <rect x="205" y="270" width="12" height="10" rx="2" fill="#7f8c8d"/>
    
    <!-- Row 3 -->
    <rect x="175" y="285" width="12" height="10" rx="2" fill="#7f8c8d"/>
    <rect x="190" y="285" width="12" height="10" rx="2" fill="#7f8c8d"/>
    <rect x="205" y="285" width="12" height="10" rx="2" fill="#7f8c8d"/>
    
    <!-- Row 4 -->
    <rect x="175" y="300" width="12" height="10" rx="2" fill="#7f8c8d"/>
    <rect x="190" y="300" width="12" height="10" rx="2" fill="#7f8c8d"/>
    <rect x="205" y="300" width="12" height="10" rx="2" fill="#7f8c8d"/>
    
    <!-- Numbers -->
    <text x="181" y="262" text-anchor="middle" font-family="Arial" font-size="6" fill="#2c3e50">1</text>
    <text x="196" y="262" text-anchor="middle" font-family="Arial" font-size="6" fill="#2c3e50">2</text>
    <text x="211" y="262" text-anchor="middle" font-family="Arial" font-size="6" fill="#2c3e50">3</text>
    <text x="181" y="277" text-anchor="middle" font-family="Arial" font-size="6" fill="#2c3e50">4</text>
    <text x="196" y="277" text-anchor="middle" font-family="Arial" font-size="6" fill="#2c3e50">5</text>
    <text x="211" y="277" text-anchor="middle" font-family="Arial" font-size="6" fill="#2c3e50">6</text>
    <text x="181" y="292" text-anchor="middle" font-family="Arial" font-size="6" fill="#2c3e50">7</text>
    <text x="196" y="292" text-anchor="middle" font-family="Arial" font-size="6" fill="#2c3e50">8</text>
    <text x="211" y="292" text-anchor="middle" font-family="Arial" font-size="6" fill="#2c3e50">9</text>
    <text x="181" y="307" text-anchor="middle" font-family="Arial" font-size="6" fill="#2c3e50">*</text>
    <text x="196" y="307" text-anchor="middle" font-family="Arial" font-size="6" fill="#2c3e50">0</text>
    <text x="211" y="307" text-anchor="middle" font-family="Arial" font-size="6" fill="#2c3e50">#</text>
  </g>
  
  <!-- Door handle -->
  <rect x="225" y="240" width="8" height="30" rx="4" fill="#95a5a6"/>
  <rect x="227" y="242" width="4" height="26" rx="2" fill="#bdc3c7"/>
  <circle cx="229" cy="255" r="2" fill="#7f8c8d"/>
  
  <!-- Locking bolts (visible) -->
  <g>
    <circle cx="160" cy="180" r="4" fill="#1a252f"/>
    <circle cx="160" cy="200" r="4" fill="#1a252f"/>
    <circle cx="160" cy="280" r="4" fill="#1a252f"/>
    <circle cx="160" cy="300" r="4" fill="#1a252f"/>
    <circle cx="160" cy="320" r="4" fill="#1a252f"/>
    
    <circle cx="240" cy="180" r="4" fill="#1a252f"/>
    <circle cx="240" cy="200" r="4" fill="#1a252f"/>
    <circle cx="240" cy="280" r="4" fill="#1a252f"/>
    <circle cx="240" cy="300" r="4" fill="#1a252f"/>
    <circle cx="240" cy="320" r="4" fill="#1a252f"/>
  </g>
  
  <!-- Hinges -->
  <g>
    <rect x="145" y="170" width="12" height="15" rx="2" fill="#1a252f"/>
    <rect x="147" y="172" width="8" height="11" rx="1" fill="#2c3e50"/>
    <circle cx="151" cy="177" r="2" fill="#7f8c8d"/>
    
    <rect x="145" y="240" width="12" height="15" rx="2" fill="#1a252f"/>
    <rect x="147" y="242" width="8" height="11" rx="1" fill="#2c3e50"/>
    <circle cx="151" cy="247" r="2" fill="#7f8c8d"/>
    
    <rect x="145" y="310" width="12" height="15" rx="2" fill="#1a252f"/>
    <rect x="147" y="312" width="8" height="11" rx="1" fill="#2c3e50"/>
    <circle cx="151" cy="317" r="2" fill="#7f8c8d"/>
  </g>
  
  <!-- Status LEDs -->
  <circle cx="185" cy="205" r="3" fill="#e74c3c"/>
  <circle cx="195" cy="205" r="3" fill="#f39c12"/>
  <circle cx="205" cy="205" r="3" fill="#2ecc71"/>
  <circle cx="215" cy="205" r="3" fill="#95a5a6"/>
  
  <!-- Brand/Model plate -->
  <rect x="170" y="180" width="60" height="15" rx="2" fill="#2c3e50"/>
  <text x="200" y="190" text-anchor="middle" font-family="Arial" font-size="8" fill="#ffffff">SECUREX 3000</text>
  
  <!-- Emergency key override -->
  <rect x="160" y="325" width="8" height="8" rx="1" fill="#7f8c8d"/>
  <circle cx="164" cy="329" r="2" fill="#2c3e50"/>
  <rect x="163" y="327" width="2" height="4" fill="#2c3e50"/>
  
  <!-- Ventilation holes -->
  <g>
    <circle cx="230" cy="170" r="1" fill="#1a252f"/>
    <circle cx="235" cy="170" r="1" fill="#1a252f"/>
    <circle cx="230" cy="175" r="1" fill="#1a252f"/>
    <circle cx="235" cy="175" r="1" fill="#1a252f"/>
    <circle cx="230" cy="180" r="1" fill="#1a252f"/>
    <circle cx="235" cy="180" r="1" fill="#1a252f"/>
  </g>
  
  <!-- Interior (slightly visible through gap) -->
  <rect x="158" y="158" width="78" height="178" fill="#000000" opacity="0.8"/>
  <rect x="160" y="160" width="74" height="174" fill="#1a1a1a"/>
  
  <!-- Interior shelves (barely visible) -->
  <rect x="162" y="200" width="70" height="2" fill="#2c3e50" opacity="0.5"/>
  <rect x="162" y="250" width="70" height="2" fill="#2c3e50" opacity="0.5"/>
  <rect x="162" y="300" width="70" height="2" fill="#2c3e50" opacity="0.5"/>
  
  <!-- Security certification sticker -->
  <rect x="165" y="160" width="20" height="12" rx="1" fill="#3498db"/>
  <text x="175" y="168" text-anchor="middle" font-family="Arial" font-size="5" fill="#ffffff">UL LISTED</text>
  
  <!-- Nameplate -->
  <rect x="150" y="100" width="100" height="20" rx="3" fill="#ffffff" stroke="#cccccc"/>
  <text x="200" y="113" text-anchor="middle" font-family="Arial" font-size="12" fill="#333333">SAFE</text>
</svg>