  <rect x="72" y="50" width="8" height="1" fill="#000000" opacity="0.3"/>
  <rect x="72" y="52" width="6" height="0.5" fill="#000000" opacity="0.3"/>
  <rect x="72" y="54" width="7" height="0.5" fill="#000000" opacity="0.3"/>
  <rect x="72" y="56" width="5" height="0.5" fill="#000000" opacity="0.3"/>
  
