  <ellipse cx="25" cy="52" rx="3" ry="2.5" fill="#8B4513"/>
  <ellipse cx="25" cy="50" rx="3" ry="2.5" fill="#A0522D"/>
  <ellipse cx="25" cy="50" rx="2.5" ry="2" fill="#654321"/>
  <ellipse cx="25" cy="49" rx="2.5" ry="2" fill="#8B0000"/>
  
  <!-- Mug handle -->
  <path d="M 28 50 Q 30 50 30 52 Q 30 54 28 54" stroke="#8B4513" stroke-width="1" fill="none"/>
  
  <!-- Desk lamp -->
  <rect x="100" y="35" width="2" height="15" fill="#C0C0C0"/>
  <ellipse cx="101" cy="32" rx="6" ry="3" fill="#C0C0C0"/>
  <ellipse cx="101" cy="32" rx="5" ry="2.5" fill="#E6E6E6"/>
  <circle cx="101" cy="32" r="1" fill="#FFFF00" opacity="0.8"/>
  
  <!-- Lamp base -->
  <ellipse cx="101" cy="50" rx="4" ry="2" fill="#C0C0C0"/>
  <ellipse cx="101" cy="50" rx="3.5" ry="1.5" fill="#E6E6E6"/>
  
  <!-- Cable management -->
  <path d="M 64 47 Q 66 49 68 47 Q 70 45 72 47" stroke="#000000" stroke-width="1" fill="none" opacity="0.6"/>
  
  <!-- Desk edge highlight -->
  <rect x="12" y="45" width="104" height="1" fill="#F4A460" opacity="0.8"/>
  
  <!-- Name plate -->
  <rect x="50" y="85" width="28" height="8" fill="#8B4513" opacity="0.8"/>
  <rect x="51" y="86" width="26" height="6" fill="#DEB887"/>
  <text x="64" y="90" text-anchor="middle" font-family="Arial" font-size="4" fill="#654321">OFFICE DESK</text>
