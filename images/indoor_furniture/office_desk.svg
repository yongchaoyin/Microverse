<svg width="128" height="96" viewBox="0 0 128 96" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="64" cy="88" rx="50" ry="6" fill="#000000" opacity="0.2"/>
  
  <!-- Desk legs (front) -->
  <rect x="20" y="70" width="6" height="18" fill="#8B4513"/>
  <rect x="102" y="70" width="6" height="18" fill="#8B4513"/>
  <rect x="20" y="70" width="6" height="18" fill="#A0522D" opacity="0.8"/>
  <rect x="102" y="70" width="6" height="18" fill="#A0522D" opacity="0.8"/>
  
  <!-- Desk legs (back) -->
  <rect x="20" y="45" width="6" height="25" fill="#654321"/>
  <rect x="102" y="45" width="6" height="25" fill="#654321"/>
  <rect x="20" y="45" width="6" height="25" fill="#8B4513" opacity="0.8"/>
  <rect x="102" y="45" width="6" height="25" fill="#8B4513" opacity="0.8"/>
  
