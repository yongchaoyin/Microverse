  <rect x="14" y="47" width="100" height="2" fill="#CD853F" opacity="0.8"/>
  <rect x="16" y="48" width="96" height="1" fill="#F4A460" opacity="0.6"/>
  
  <!-- Wood grain pattern -->
  <g stroke="#8B4513" stroke-width="0.3" opacity="0.4">
    <line x1="20" y1="46" x2="110" y2="46"/>
    <line x1="18" y1="48" x2="112" y2="48"/>
    <line x1="22" y1="49" x2="108" y2="49"/>
  </g>
  
  <!-- Items on desk -->
  <!-- Computer monitor -->
  <rect x="45" y="25" width="38" height="22" fill="#2F2F2F"/>
  <rect x="47" y="27" width="34" height="18" fill="#000000"/>
  <rect x="48" y="28" width="32" height="16" fill="#1E90FF" opacity="0.3"/>
  
