  <rect x="35" y="52" width="20" height="8" fill="#F5F5F5"/>
  <rect x="35" y="52" width="20" height="6" fill="#FFFFFF"/>
  
  <!-- Keyboard keys -->
  <g fill="#E0E0E0">
    <rect x="37" y="54" width="1.5" height="1" rx="0.2"/>
    <rect x="39" y="54" width="1.5" height="1" rx="0.2"/>
    <rect x="41" y="54" width="1.5" height="1" rx="0.2"/>
    <rect x="43" y="54" width="1.5" height="1" rx="0.2"/>
    <rect x="45" y="54" width="1.5" height="1" rx="0.2"/>
    <rect x="47" y="54" width="1.5" height="1" rx="0.2"/>
    <rect x="49" y="54" width="1.5" height="1" rx="0.2"/>
    <rect x="51" y="54" width="1.5" height="1" rx="0.2"/>
    
    <rect x="37" y="56" width="1.5" height="1" rx="0.2"/>
    <rect x="39" y="56" width="1.5" height="1" rx="0.2"/>
    <rect x="41" y="56" width="1.5" height="1" rx="0.2"/>
    <rect x="43" y="56" width="1.5" height="1" rx="0.2"/>
    <rect x="45" y="56" width="1.5" height="1" rx="0.2"/>
    <rect x="47" y="56" width="1.5" height="1" rx="0.2"/>
    <rect x="49" y="56" width="1.5" height="1" rx="0.2"/>
    <rect x="51" y="56" width="1.5" height="1" rx="0.2"/>
  </g>
  
  <!-- Mouse -->
  <ellipse cx="60" cy="55" rx="3" ry="4" fill="#2F2F2F"/>
  <ellipse cx="60" cy="55" rx="2.5" ry="3.5" fill="#696969"/>
  <circle cx="60" cy="53" r="0.5" fill="#FF0000" opacity="0.8"/>
  
