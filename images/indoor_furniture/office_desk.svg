  <ellipse cx="90" cy="52" rx="4" ry="3" fill="#8B4513"/>
  <ellipse cx="90" cy="50" rx="4" ry="3" fill="#A0522D"/>
  <ellipse cx="90" cy="50" rx="3.5" ry="2.5" fill="#CD853F"/>
  
