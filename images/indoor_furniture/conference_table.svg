<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="200" cy="385" rx="120" ry="15" fill="#000000" opacity="0.2"/>
  
  <!-- Ground area -->
  <rect x="0" y="370" width="400" height="30" fill="#f5f5f5"/>
  
  <!-- Table legs -->
  <g>
    <!-- Leg 1 -->
    <rect x="120" y="320" width="15" height="50" fill="#2c3e50"/>
    <rect x="118" y="318" width="19" height="4" fill="#34495e"/>
    
    <!-- Leg 2 -->
    <rect x="265" y="320" width="15" height="50" fill="#2c3e50"/>
    <rect x="263" y="318" width="19" height="4" fill="#34495e"/>
    
    <!-- Support beam -->
    <rect x="130" y="340" width="140" height="8" rx="4" fill="#34495e"/>
  </g>
  
  <!-- Table base (3D effect) -->
  <ellipse cx="200" cy="325" rx="100" ry="60" fill="#2c3e50" opacity="0.3"/>
  
  <!-- Main table surface -->
  <ellipse cx="200" cy="250" rx="150" ry="90" fill="#8b4513"/>
  <ellipse cx="200" cy="245" rx="145" ry="85" fill="#a0522d"/>
  <ellipse cx="200" cy="240" rx="140" ry="80" fill="#cd853f"/>
  
  <!-- Table edge (3D effect) -->
  <ellipse cx="200" cy="250" rx="150" ry="90" fill="none" stroke="#654321" stroke-width="3"/>
  
  <!-- Wood grain pattern -->
  <g opacity="0.3">
    <ellipse cx="200" cy="240" rx="120" ry="60" fill="none" stroke="#8b4513" stroke-width="1"/>
    <ellipse cx="200" cy="240" rx="100" ry="50" fill="none" stroke="#8b4513" stroke-width="1"/>
    <ellipse cx="200" cy="240" rx="80" ry="40" fill="none" stroke="#8b4513" stroke-width="1"/>
  </g>
  
  <!-- Conference items on table -->
  <g>
    <!-- Laptop (open) -->
    <rect x="160" y="210" width="25" height="18" rx="2" fill="#2c3e50"/>
    <rect x="162" y="212" width="21" height="14" rx="1" fill="#3498db"/>
    <rect x="164" y="214" width="17" height="10" fill="#2980b9"/>
    
    <!-- Documents/Papers -->
    <rect x="200" y="205" width="20" height="25" fill="#ffffff" stroke="#cccccc"/>
    <rect x="202" y="207" width="16" height="2" fill="#2c3e50"/>
    <rect x="202" y="210" width="14" height="1" fill="#7f8c8d"/>
    <rect x="202" y="212" width="16" height="1" fill="#7f8c8d"/>
    <rect x="202" y="214" width="12" height="1" fill="#7f8c8d"/>
    
    <!-- Coffee cups -->
    <ellipse cx="120" cy="220" rx="6" ry="4" fill="#8b4513"/>
    <ellipse cx="120" cy="218" rx="5" ry="3" fill="#d2691e"/>
    <rect x="125" y="215" width="8" height="3" rx="1" fill="#8b4513"/>
    
    <ellipse cx="280" cy="225" rx="6" ry="4" fill="#ffffff"/>
    <ellipse cx="280" cy="223" rx="5" ry="3" fill="#2c3e50"/>
    <rect x="285" y="220" width="8" height="3" rx="1" fill="#ffffff"/>
    
    <!-- Pens -->
    <rect x="190" y="235" width="12" height="2" rx="1" fill="#3498db"/>
    <rect x="205" y="238" width="12" height="2" rx="1" fill="#e74c3c"/>
    
    <!-- Notepad -->
    <rect x="250" y="215" width="18" height="22" fill="#f1c40f"/>
    <rect x="252" y="217" width="14" height="18" fill="#ffffff"/>
    <rect x="254" y="219" width="10" height="1" fill="#bdc3c7"/>
    <rect x="254" y="221" width="8" height="1" fill="#bdc3c7"/>
    <rect x="254" y="223" width="12" height="1" fill="#bdc3c7"/>
    
    <!-- Water glasses -->
    <ellipse cx="140" cy="260" rx="4" ry="3" fill="#ecf0f1" opacity="0.8"/>
    <ellipse cx="140" cy="258" rx="3" ry="2" fill="#3498db" opacity="0.3"/>
    
    <ellipse cx="260" cy="265" rx="4" ry="3" fill="#ecf0f1" opacity="0.8"/>
    <ellipse cx="260" cy="263" rx="3" ry="2" fill="#3498db" opacity="0.3"/>
    
    <!-- Projector remote -->
    <rect x="170" y="260" width="8" height="15" rx="2" fill="#2c3e50"/>
    <circle cx="174" cy="265" r="1" fill="#e74c3c"/>
    <circle cx="174" cy="268" r="1" fill="#95a5a6"/>
    <circle cx="174" cy="271" r="1" fill="#95a5a6"/>
  </g>
  
  <!-- Chairs around the table -->
  <g>
    <!-- Chair 1 (top left) -->
    <rect x="100" y="150" width="25" height="30" rx="3" fill="#34495e"/>
    <rect x="105" y="155" width="15" height="20" rx="2" fill="#5a6f8a"/>
    <rect x="110" y="180" width="5" height="15" fill="#2c3e50"/>
    
    <!-- Chair 2 (top right) -->
    <rect x="275" y="150" width="25" height="30" rx="3" fill="#34495e"/>
    <rect x="280" y="155" width="15" height="20" rx="2" fill="#5a6f8a"/>
    <rect x="285" y="180" width="5" height="15" fill="#2c3e50"/>
    
    <!-- Chair 3 (bottom left) -->
    <rect x="100" y="320" width="25" height="30" rx="3" fill="#34495e"/>
    <rect x="105" y="325" width="15" height="20" rx="2" fill="#5a6f8a"/>
    <rect x="110" y="315" width="5" height="15" fill="#2c3e50"/>
    
    <!-- Chair 4 (bottom right) -->
    <rect x="275" y="320" width="25" height="30" rx="3" fill="#34495e"/>
    <rect x="280" y="325" width="15" height="20" rx="2" fill="#5a6f8a"/>
    <rect x="285" y="315" width="5" height="15" fill="#2c3e50"/>
    
    <!-- Chair 5 (left side) -->
    <rect x="50" y="235" width="30" height="25" rx="3" fill="#34495e"/>
    <rect x="55" y="240" width="20" height="15" rx="2" fill="#5a6f8a"/>
    <rect x="75" y="245" width="15" height="5" fill="#2c3e50"/>
    
    <!-- Chair 6 (right side) -->
    <rect x="320" y="235" width="30" height="25" rx="3" fill="#34495e"/>
    <rect x="325" y="240" width="20" height="15" rx="2" fill="#5a6f8a"/>
    <rect x="310" y="245" width="15" height="5" fill="#2c3e50"/>
  </g>
  
  <!-- Conference phone (center) -->
  <ellipse cx="200" cy="250" rx="15" ry="8" fill="#2c3e50"/>
  <ellipse cx="200" cy="248" rx="12" ry="6" fill="#34495e"/>
  <circle cx="195" cy="248" r="2" fill="#e74c3c"/>
  <circle cx="200" cy="248" r="2" fill="#2ecc71"/>
  <circle cx="205" cy="248" r="2" fill="#f39c12"/>
  <rect x="190" y="245" width="20" height="2" rx="1" fill="#95a5a6"/>
  
  <!-- Table highlight -->
  <ellipse cx="180" cy="220" rx="30" ry="15" fill="#deb887" opacity="0.4"/>
  
  <!-- Nameplate -->
  <rect x="150" y="50" width="100" height="20" rx="3" fill="#ffffff" stroke="#cccccc"/>
  <text x="200" y="63" text-anchor="middle" font-family="Arial" font-size="12" fill="#333333">CONFERENCE TABLE</text>
</svg>