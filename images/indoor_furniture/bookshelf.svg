<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="200" cy="385" rx="70" ry="10" fill="#000000" opacity="0.2"/>
  
  <!-- Ground area -->
  <rect x="0" y="375" width="400" height="25" fill="#f5f5f5"/>
  
  <!-- Bookshelf base -->
  <rect x="130" y="360" width="140" height="15" fill="#8b4513"/>
  <rect x="128" y="358" width="144" height="4" fill="#a0522d"/>
  
  <!-- Main bookshelf frame -->
  <rect x="130" y="80" width="140" height="280" fill="#a0522d"/>
  <rect x="135" y="85" width="130" height="270" fill="#cd853f"/>
  
  <!-- Bookshelf sides (3D effect) -->
  <polygon points="270,80 280,70 280,350 270,360" fill="#8b4513"/>
  <polygon points="130,80 140,70 280,70 270,80" fill="#deb887"/>
  
  <!-- Shelf 1 (top) -->
  <rect x="135" y="120" width="130" height="8" fill="#8b4513"/>
  <rect x="133" y="118" width="134" height="4" fill="#a0522d"/>
  
  <!-- Books on shelf 1 -->
  <g>
    <rect x="140" y="90" width="12" height="30" fill="#e74c3c"/>
    <rect x="152" y="90" width="10" height="30" fill="#3498db"/>
    <rect x="162" y="90" width="14" height="30" fill="#2ecc71"/>
    <rect x="176" y="90" width="11" height="30" fill="#f39c12"/>
    <rect x="187" y="90" width="13" height="30" fill="#9b59b6"/>
    <rect x="200" y="90" width="9" height="30" fill="#e67e22"/>
    <rect x="209" y="90" width="15" height="30" fill="#1abc9c"/>
    <rect x="224" y="90" width="12" height="30" fill="#34495e"/>
    
    <!-- Book spines details -->
    <rect x="142" y="95" width="8" height="2" fill="#c0392b"/>
    <rect x="154" y="95" width="6" height="2" fill="#2980b9"/>
    <rect x="164" y="95" width="10" height="2" fill="#27ae60"/>
    <rect x="178" y="95" width="7" height="2" fill="#d68910"/>
    
    <!-- Small decorative plant -->
    <ellipse cx="250" cy="115" rx="8" ry="5" fill="#8b4513"/>
    <ellipse cx="248" cy="110" rx="3" ry="8" fill="#2ecc71"/>
    <ellipse cx="252" cy="108" rx="3" ry="6" fill="#27ae60"/>
  </g>
  
  <!-- Shelf 2 -->
  <rect x="135" y="170" width="130" height="8" fill="#8b4513"/>
  <rect x="133" y="168" width="134" height="4" fill="#a0522d"/>
  
  <!-- Books on shelf 2 -->
  <g>
    <rect x="140" y="140" width="11" height="30" fill="#8e44ad"/>
    <rect x="151" y="140" width="13" height="30" fill="#c0392b"/>
    <rect x="164" y="140" width="10" height="30" fill="#16a085"/>
    <rect x="174" y="140" width="12" height="30" fill="#f1c40f"/>
    <rect x="186" y="140" width="14" height="30" fill="#2c3e50"/>
    <rect x="200" y="140" width="9" height="30" fill="#e74c3c"/>
    
    <!-- Binder -->
    <rect x="210" y="140" width="20" height="30" fill="#34495e"/>
    <rect x="212" y="142" width="16" height="26" fill="#2c3e50"/>
    <circle cx="215" cy="155" r="2" fill="#95a5a6"/>
    <circle cx="225" cy="155" r="2" fill="#95a5a6"/>
    
    <!-- Small trophy -->
    <rect x="240" y="155" width="6" height="10" fill="#f39c12"/>
    <ellipse cx="243" cy="152" rx="4" ry="3" fill="#f1c40f"/>
    <rect x="242" y="148" width="2" height="4" fill="#e67e22"/>
  </g>
  
  <!-- Shelf 3 -->
  <rect x="135" y="220" width="130" height="8" fill="#8b4513"/>
  <rect x="133" y="218" width="134" height="4" fill="#a0522d"/>
  
  <!-- Books on shelf 3 -->
  <g>
    <rect x="140" y="190" width="15" height="30" fill="#d35400"/>
    <rect x="155" y="190" width="12" height="30" fill="#7f8c8d"/>
    <rect x="167" y="190" width="10" height="30" fill="#27ae60"/>
    <rect x="177" y="190" width="13" height="30" fill="#8e44ad"/>
    <rect x="190" y="190" width="11" height="30" fill="#2980b9"/>
    <rect x="201" y="190" width="14" height="30" fill="#c0392b"/>
    <rect x="215" y="190" width="9" height="30" fill="#f39c12"/>
    
    <!-- Photo frame -->
    <rect x="230" y="195" width="15" height="20" fill="#2c3e50"/>
    <rect x="232" y="197" width="11" height="16" fill="#ecf0f1"/>
    <rect x="234" y="199" width="7" height="5" fill="#3498db"/>
    <rect x="234" y="206" width="7" height="5" fill="#2ecc71"/>
  </g>
  
  <!-- Shelf 4 -->
  <rect x="135" y="270" width="130" height="8" fill="#8b4513"/>
  <rect x="133" y="268" width="134" height="4" fill="#a0522d"/>
  
  <!-- Books on shelf 4 -->
  <g>
    <rect x="140" y="240" width="12" height="30" fill="#16a085"/>
    <rect x="152" y="240" width="14" height="30" fill="#e67e22"/>
    <rect x="166" y="240" width="10" height="30" fill="#9b59b6"/>
    <rect x="176" y="240" width="13" height="30" fill="#34495e"/>
    <rect x="189" y="240" width="11" height="30" fill="#e74c3c"/>
    <rect x="200" y="240" width="15" height="30" fill="#f1c40f"/>
    
    <!-- Storage box -->
    <rect x="220" y="245" width="25" height="20" fill="#95a5a6"/>
    <rect x="222" y="247" width="21" height="16" fill="#bdc3c7"/>
    <rect x="230" y="250" width="5" height="3" fill="#7f8c8d"/>
    <text x="232" y="258" text-anchor="middle" font-family="Arial" font-size="6" fill="#2c3e50">FILES</text>
  </g>
  
  <!-- Shelf 5 (bottom) -->
  <rect x="135" y="320" width="130" height="8" fill="#8b4513"/>
  <rect x="133" y="318" width="134" height="4" fill="#a0522d"/>
  
  <!-- Books on shelf 5 -->
  <g>
    <rect x="140" y="290" width="16" height="30" fill="#2c3e50"/>
    <rect x="156" y="290" width="12" height="30" fill="#c0392b"/>
    <rect x="168" y="290" width="11" height="30" fill="#27ae60"/>
    <rect x="179" y="290" width="13" height="30" fill="#8e44ad"/>
    <rect x="192" y="290" width="10" height="30" fill="#f39c12"/>
    <rect x="202" y="290" width="14" height="30" fill="#2980b9"/>
    <rect x="216" y="290" width="12" height="30" fill="#d35400"/>
    
    <!-- Clock -->
    <circle cx="240" cy="305" r="8" fill="#2c3e50"/>
    <circle cx="240" cy="305" r="6" fill="#ecf0f1"/>
    <line x1="240" y1="305" x2="240" y2="301" stroke="#2c3e50" stroke-width="1"/>
    <line x1="240" y1="305" x2="243" y2="305" stroke="#2c3e50" stroke-width="1"/>
  </g>
  
  <!-- Bookshelf top -->
  <rect x="128" y="78" width="144" height="8" fill="#deb887"/>
  <polygon points="128,78 138,68 282,68 272,78" fill="#f5deb3"/>
  
  <!-- Book titles (readable spines) -->
  <g font-family="Arial" font-size="6" fill="#ffffff">
    <text x="146" y="108" transform="rotate(-90 146 108)">MANAGEMENT</text>
    <text x="158" y="108" transform="rotate(-90 158 108)">FINANCE</text>
    <text x="170" y="108" transform="rotate(-90 170 108)">MARKETING</text>
    <text x="182" y="108" transform="rotate(-90 182 108)">STRATEGY</text>
  </g>
  
  <!-- Nameplate -->
  <rect x="150" y="40" width="100" height="20" rx="3" fill="#ffffff" stroke="#cccccc"/>
  <text x="200" y="53" text-anchor="middle" font-family="Arial" font-size="12" fill="#333333">BOOKSHELF</text>
</svg>