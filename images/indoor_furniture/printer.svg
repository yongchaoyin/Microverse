<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="200" cy="385" rx="80" ry="12" fill="#000000" opacity="0.2"/>
  
  <!-- Ground area -->
  <rect x="0" y="370" width="400" height="30" fill="#f5f5f5"/>
  
  <!-- Printer base/stand -->
  <rect x="140" y="350" width="120" height="20" fill="#2c3e50"/>
  <rect x="138" y="348" width="124" height="4" fill="#34495e"/>
  
  <!-- Main printer body -->
  <rect x="140" y="220" width="120" height="130" rx="5" fill="#ecf0f1"/>
  <rect x="142" y="222" width="116" height="126" rx="3" fill="#ffffff"/>
  
  <!-- Printer sides (3D effect) -->
  <polygon points="260,220 270,210 270,340 260,350" fill="#bdc3c7"/>
  <polygon points="140,220 150,210 270,210 260,220" fill="#d5dbdb"/>
  
  <!-- Scanner/copier top unit -->
  <rect x="145" y="180" width="110" height="45" rx="3" fill="#34495e"/>
  <rect x="147" y="182" width="106" height="41" rx="2" fill="#2c3e50"/>
  
  <!-- Scanner glass -->
  <rect x="150" y="185" width="100" height="35" rx="2" fill="#000000" opacity="0.8"/>
  <rect x="152" y="187" width="96" height="31" rx="1" fill="#1a1a1a"/>
  
  <!-- Scanner lid handle -->
  <rect x="240" y="175" width="15" height="8" rx="4" fill="#7f8c8d"/>
  <rect x="242" y="177" width="11" height="4" rx="2" fill="#95a5a6"/>
  
  <!-- Control panel -->
  <rect x="180" y="230" width="60" height="40" rx="3" fill="#2c3e50"/>
  <rect x="182" y="232" width="56" height="36" rx="2" fill="#34495e"/>
  
  <!-- LCD display -->
  <rect x="190" y="240" width="35" height="15" rx="2" fill="#000000"/>
  <rect x="192" y="242" width="31" height="11" rx="1" fill="#3498db"/>
  <text x="207" y="250" text-anchor="middle" font-family="Arial" font-size="6" fill="#ffffff">READY</text>
  
  <!-- Control buttons -->
  <g>
    <circle cx="195" cy="260" r="3" fill="#2ecc71"/>
    <circle cx="205" cy="260" r="3" fill="#e74c3c"/>
    <circle cx="215" cy="260" r="3" fill="#f39c12"/>
    <circle cx="225" cy="260" r="3" fill="#3498db"/>
  </g>
  
  <!-- Number pad -->
  <g>
    <rect x="185" y="275" width="8" height="6" rx="1" fill="#7f8c8d"/>
    <rect x="195" y="275" width="8" height="6" rx="1" fill="#7f8c8d"/>
    <rect x="205" y="275" width="8" height="6" rx="1" fill="#7f8c8d"/>
    <rect x="185" y="285" width="8" height="6" rx="1" fill="#7f8c8d"/>
    <rect x="195" y="285" width="8" height="6" rx="1" fill="#7f8c8d"/>
    <rect x="205" y="285" width="8" height="6" rx="1" fill="#7f8c8d"/>
    <rect x="185" y="295" width="8" height="6" rx="1" fill="#7f8c8d"/>
    <rect x="195" y="295" width="8" height="6" rx="1" fill="#7f8c8d"/>
    <rect x="205" y="295" width="8" height="6" rx="1" fill="#7f8c8d"/>
    <rect x="195" y="305" width="8" height="6" rx="1" fill="#7f8c8d"/>
    
    <!-- Number labels -->
    <text x="189" y="280" text-anchor="middle" font-family="Arial" font-size="4" fill="#2c3e50">1</text>
    <text x="199" y="280" text-anchor="middle" font-family="Arial" font-size="4" fill="#2c3e50">2</text>
    <text x="209" y="280" text-anchor="middle" font-family="Arial" font-size="4" fill="#2c3e50">3</text>
    <text x="189" y="290" text-anchor="middle" font-family="Arial" font-size="4" fill="#2c3e50">4</text>
    <text x="199" y="290" text-anchor="middle" font-family="Arial" font-size="4" fill="#2c3e50">5</text>
    <text x="209" y="290" text-anchor="middle" font-family="Arial" font-size="4" fill="#2c3e50">6</text>
    <text x="189" y="300" text-anchor="middle" font-family="Arial" font-size="4" fill="#2c3e50">7</text>
    <text x="199" y="300" text-anchor="middle" font-family="Arial" font-size="4" fill="#2c3e50">8</text>
    <text x="209" y="300" text-anchor="middle" font-family="Arial" font-size="4" fill="#2c3e50">9</text>
    <text x="199" y="310" text-anchor="middle" font-family="Arial" font-size="4" fill="#2c3e50">0</text>
  </g>
  
  <!-- Paper input tray -->
  <rect x="145" y="320" width="110" height="25" rx="2" fill="#95a5a6"/>
  <rect x="147" y="322" width="106" height="21" rx="1" fill="#bdc3c7"/>
  
  <!-- Paper in tray -->
  <rect x="150" y="325" width="100" height="15" fill="#ffffff"/>
  <rect x="152" y="327" width="96" height="11" fill="#f8f9fa"/>
  
  <!-- Paper guides -->
  <rect x="148" y="330" width="4" height="10" fill="#7f8c8d"/>
  <rect x="248" y="330" width="4" height="10" fill="#7f8c8d"/>
  
  <!-- Output tray -->
  <rect x="145" y="280" width="110" height="8" rx="1" fill="#7f8c8d"/>
  <rect x="147" y="282" width="106" height="4" rx="1" fill="#95a5a6"/>
  
  <!-- Printed papers in output tray -->
  <rect x="150" y="275" width="100" height="3" fill="#ffffff"/>
  <rect x="152" y="273" width="96" height="2" fill="#f8f9fa"/>
  
  <!-- Ink cartridge access -->
  <rect x="220" y="300" width="25" height="15" rx="2" fill="#2c3e50"/>
  <rect x="222" y="302" width="21" height="11" rx="1" fill="#34495e"/>
  <circle cx="232" cy="307" r="2" fill="#e74c3c"/>
  
  <!-- Status LEDs -->
  <circle cx="150" cy="235" r="2" fill="#2ecc71"/>
  <circle cx="155" cy="235" r="2" fill="#f39c12"/>
  <circle cx="160" cy="235" r="2" fill="#95a5a6"/>
  
  <!-- USB port -->
  <rect x="265" y="250" width="8" height="4" rx="1" fill="#2c3e50"/>
  <rect x="267" y="251" width="4" height="2" fill="#34495e"/>
  
  <!-- Power button -->
  <circle cx="270" cy="235" r="4" fill="#2c3e50"/>
  <circle cx="270" cy="235" r="2" fill="#2ecc71"/>
  <text x="270" y="237" text-anchor="middle" font-family="Arial" font-size="3" fill="#ffffff">⏻</text>
  
  <!-- Brand logo -->
  <rect x="160" y="240" width="15" height="8" rx="2" fill="#3498db"/>
  <text x="167" y="246" text-anchor="middle" font-family="Arial" font-size="5" fill="#ffffff">HP</text>
  
  <!-- Ventilation grilles -->
  <g>
    <rect x="275" y="260" width="2" height="20" fill="#7f8c8d"/>
    <rect x="278" y="260" width="2" height="20" fill="#7f8c8d"/>
    <rect x="281" y="260" width="2" height="20" fill="#7f8c8d"/>
    <rect x="284" y="260" width="2" height="20" fill="#7f8c8d"/>
  </g>
  
  <!-- Cable -->
  <path d="M 275 270 Q 290 275 300 285 Q 310 295 320 300" stroke="#2c3e50" stroke-width="3" fill="none"/>
  <circle cx="320" cy="300" r="4" fill="#2c3e50"/>
  
  <!-- Nameplate -->
  <rect x="150" y="120" width="100" height="20" rx="3" fill="#ffffff" stroke="#cccccc"/>
  <text x="200" y="133" text-anchor="middle" font-family="Arial" font-size="12" fill="#333333">PRINTER</text>
</svg>