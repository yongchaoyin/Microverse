<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground shadow -->
  <ellipse cx="200" cy="380" rx="80" ry="15" fill="#000000" opacity="0.2"/>
  
  <!-- Ground area -->
  <rect x="0" y="370" width="400" height="30" fill="#f5f5f5"/>
  
  <!-- Chair base (5-star base) -->
  <g transform="translate(200,320)">
    <!-- Base center -->
    <circle cx="0" cy="0" r="12" fill="#333333"/>
    
    <!-- Base arms -->
    <g>
      <rect x="-40" y="-3" width="80" height="6" rx="3" fill="#444444"/>
      <rect x="-3" y="-40" width="6" height="80" rx="3" fill="#444444"/>
      <rect x="-28" y="-28" width="56" height="6" rx="3" fill="#444444" transform="rotate(45)"/>
      <rect x="-28" y="-28" width="56" height="6" rx="3" fill="#444444" transform="rotate(-45)"/>
    </g>
    
    <!-- Wheels -->
    <circle cx="35" cy="0" r="8" fill="#666666"/>
    <circle cx="35" cy="0" r="5" fill="#888888"/>
    <circle cx="-35" cy="0" r="8" fill="#666666"/>
    <circle cx="-35" cy="0" r="5" fill="#888888"/>
    <circle cx="0" cy="35" r="8" fill="#666666"/>
    <circle cx="0" cy="35" r="5" fill="#888888"/>
    <circle cx="25" cy="25" r="8" fill="#666666"/>
    <circle cx="25" cy="25" r="5" fill="#888888"/>
    <circle cx="-25" cy="-25" r="8" fill="#666666"/>
    <circle cx="-25" cy="-25" r="5" fill="#888888"/>
  </g>
  
  <!-- Gas cylinder -->
  <rect x="195" y="280" width="10" height="40" fill="#333333"/>
  <rect x="193" y="275" width="14" height="8" fill="#444444" rx="2"/>
  
  <!-- Seat mechanism -->
  <rect x="185" y="270" width="30" height="8" fill="#444444" rx="4"/>
  
  <!-- Chair seat -->
  <g>
    <!-- Seat base -->
    <ellipse cx="200" cy="260" rx="55" ry="45" fill="#2c3e50"/>
    <ellipse cx="200" cy="258" rx="52" ry="42" fill="#34495e"/>
    
    <!-- Seat cushion -->
    <ellipse cx="200" cy="255" rx="48" ry="38" fill="#4a5f7a"/>
    <ellipse cx="200" cy="252" rx="45" ry="35" fill="#5a6f8a"/>
    
    <!-- Seat stitching -->
    <path d="M 160 240 Q 200 235 240 240" stroke="#3a4f6a" stroke-width="2" fill="none"/>
    <path d="M 165 250 Q 200 245 235 250" stroke="#3a4f6a" stroke-width="2" fill="none"/>
    <path d="M 170 260 Q 200 255 230 260" stroke="#3a4f6a" stroke-width="2" fill="none"/>
    
    <!-- Seat highlight -->
    <ellipse cx="190" cy="245" rx="15" ry="10" fill="#6a7f9a" opacity="0.6"/>
  </g>
  
  <!-- Chair back support -->
  <rect x="195" y="180" width="10" height="80" fill="#333333"/>
  
  <!-- Chair back -->
  <g>
    <!-- Back frame -->
    <rect x="150" y="80" width="100" height="120" rx="15" fill="#2c3e50"/>
    <rect x="155" y="85" width="90" height="110" rx="12" fill="#34495e"/>
    
    <!-- Back cushion -->
    <rect x="160" y="90" width="80" height="100" rx="10" fill="#4a5f7a"/>
    <rect x="165" y="95" width="70" height="90" rx="8" fill="#5a6f8a"/>
    
    <!-- Back stitching -->
    <line x1="175" y1="110" x2="225" y2="110" stroke="#3a4f6a" stroke-width="2"/>
    <line x1="175" y1="130" x2="225" y2="130" stroke="#3a4f6a" stroke-width="2"/>
    <line x1="175" y1="150" x2="225" y2="150" stroke="#3a4f6a" stroke-width="2"/>
    <line x1="175" y1="170" x2="225" y2="170" stroke="#3a4f6a" stroke-width="2"/>
    
    <!-- Vertical stitching -->
    <line x1="190" y1="100" x2="190" y2="180" stroke="#3a4f6a" stroke-width="2"/>
    <line x1="210" y1="100" x2="210" y2="180" stroke="#3a4f6a" stroke-width="2"/>
    
    <!-- Back highlight -->
    <rect x="170" y="100" width="20" height="30" rx="5" fill="#6a7f9a" opacity="0.6"/>
  </g>
  
  <!-- Armrests -->
  <g>
    <!-- Left armrest -->
    <rect x="120" y="200" width="40" height="8" rx="4" fill="#2c3e50"/>
    <rect x="125" y="195" width="30" height="18" rx="6" fill="#4a5f7a"/>
    <rect x="130" y="198" width="20" height="12" rx="4" fill="#5a6f8a"/>
    
    <!-- Left armrest support -->
    <rect x="135" y="208" width="10" height="40" fill="#333333"/>
    
    <!-- Right armrest -->
    <rect x="240" y="200" width="40" height="8" rx="4" fill="#2c3e50"/>
    <rect x="245" y="195" width="30" height="18" rx="6" fill="#4a5f7a"/>
    <rect x="250" y="198" width="20" height="12" rx="4" fill="#5a6f8a"/>
    
    <!-- Right armrest support -->
    <rect x="255" y="208" width="10" height="40" fill="#333333"/>
  </g>
  
  <!-- Chair details -->
  <g>
    <!-- Adjustment lever -->
    <rect x="170" y="275" width="15" height="4" rx="2" fill="#666666"/>
    <circle cx="167" cy="277" r="3" fill="#888888"/>
    
    <!-- Brand logo area -->
    <rect x="190" y="120" width="20" height="15" rx="3" fill="#3a4f6a" opacity="0.8"/>
    <text x="200" y="132" text-anchor="middle" font-family="Arial" font-size="8" fill="#ffffff">OFFICE</text>
  </g>
  
  <!-- Nameplate -->
  <rect x="150" y="350" width="100" height="20" rx="3" fill="#ffffff" stroke="#cccccc"/>
  <text x="200" y="363" text-anchor="middle" font-family="Arial" font-size="12" fill="#333333">OFFICE CHAIR</text>
</svg>