  <circle cx="34" cy="30" r="0.3" fill="#FFA500" opacity="0.8"/>
  <circle cx="32" cy="26" r="0.4" fill="#FFA500" opacity="0.8"/>
  <circle cx="29" cy="35" r="0.3" fill="#FFA500" opacity="0.8"/>
