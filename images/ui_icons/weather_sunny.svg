  <path d="M 26 34 Q 32 37 38 34" stroke="#FF4500" stroke-width="1" fill="none" stroke-linecap="round"/>
  
  <!-- Cheeks -->
  <circle cx="24" cy="32" r="1.5" fill="#FF8C00" opacity="0.6"/>
  <circle cx="40" cy="32" r="1.5" fill="#FF8C00" opacity="0.6"/>
  
