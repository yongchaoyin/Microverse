    <line x1="32" y1="56" x2="32" y2="62"/>
    <line x1="8" y1="32" x2="2" y2="32"/>
    <line x1="56" y1="32" x2="62" y2="32"/>
    
    <!-- Diagonal rays -->
    <line x1="13.86" y1="13.86" x2="9.64" y2="9.64"/>
    <line x1="50.14" y1="13.86" x2="54.36" y2="9.64"/>
    <line x1="13.86" y1="50.14" x2="9.64" y2="54.36"/>
    <line x1="50.14" y1="50.14" x2="54.36" y2="54.36"/>
