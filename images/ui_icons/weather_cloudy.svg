<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <circle cx="32" cy="32" r="30" fill="#B0C4DE" opacity="0.3"/>
  
  <!-- Sun behind clouds -->
  <circle cx="20" cy="20" r="8" fill="#FFD700" opacity="0.6"/>
  <circle cx="20" cy="20" r="7" fill="#FFA500" opacity="0.7"/>
  <circle cx="20" cy="20" r="6" fill="#FFD700" opacity="0.8"/>
  
  <!-- Sun rays (partially visible) -->
  <g stroke="#FFD700" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <line x1="20" y1="8" x2="20" y2="4"/>
    <line x1="8" y1="20" x2="4" y2="20"/>
    <line x1="11.86" y1="11.86" x2="8.64" y2="8.64"/>
    <line x1="28.14" y1="11.86" x2="31.36" y2="8.64"/>
  </g>
  
  <!-- Main cloud (large) -->
  <ellipse cx="40" cy="35" rx="18" ry="12" fill="#F5F5F5"/>
  <ellipse cx="40" cy="35" rx="17" ry="11" fill="#FFFFFF"/>
  
  <!-- Cloud bumps for realistic shape -->
  <circle cx="25" cy="35" r="8" fill="#F5F5F5"/>
  <circle cx="25" cy="35" r="7" fill="#FFFFFF"/>
  
  <circle cx="35" cy="28" r="9" fill="#F5F5F5"/>
  <circle cx="35" cy="28" r="8" fill="#FFFFFF"/>
  
  <circle cx="45" cy="30" r="7" fill="#F5F5F5"/>
  <circle cx="45" cy="30" r="6" fill="#FFFFFF"/>
  
  <circle cx="52" cy="38" r="6" fill="#F5F5F5"/>
  <circle cx="52" cy="38" r="5" fill="#FFFFFF"/>
  
  <!-- Secondary cloud (smaller) -->
  <ellipse cx="25" cy="45" rx="12" ry="8" fill="#E6E6FA"/>
  <ellipse cx="25" cy="45" rx="11" ry="7" fill="#F0F8FF"/>
  
  <circle cx="15" cy="45" r="6" fill="#E6E6FA"/>
  <circle cx="15" cy="45" r="5" fill="#F0F8FF"/>
  
  <circle cx="32" cy="42" r="5" fill="#E6E6FA"/>
  <circle cx="32" cy="42" r="4" fill="#F0F8FF"/>
  
  <!-- Cloud shadows -->
  <ellipse cx="40" cy="37" rx="16" ry="10" fill="#D3D3D3" opacity="0.3"/>
  <ellipse cx="25" cy="47" rx="10" ry="6" fill="#D3D3D3" opacity="0.3"/>
  
  <!-- Cloud highlights -->
  <ellipse cx="35" cy="30" rx="4" ry="3" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="45" cy="32" rx="3" ry="2" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="20" cy="42" rx="3" ry="2" fill="#FFFFFF" opacity="0.8"/>
  
  <!-- Small cloud details -->
  <circle cx="42" cy="33" r="1" fill="#F8F8FF" opacity="0.9"/>
  <circle cx="28" cy="38" r="0.8" fill="#F8F8FF" opacity="0.9"/>
  <circle cx="48" cy="36" r="0.6" fill="#F8F8FF" opacity="0.9"/>
  <circle cx="22" cy="48" r="0.7" fill="#F8F8FF" opacity="0.9"/>
  
  <!-- Wispy cloud edges -->
  <path d="M 22 30 Q 18 28 16 32 Q 20 34 24 32" fill="#FFFFFF" opacity="0.6"/>
  <path d="M 55 35 Q 58 33 60 37 Q 56 39 54 37" fill="#FFFFFF" opacity="0.6"/>
  <path d="M 12 48 Q 8 46 6 50 Q 10 52 14 50" fill="#F0F8FF" opacity="0.6"/>
  <path d="M 38 48 Q 42 46 44 50 Q 40 52 36 50" fill="#F0F8FF" opacity="0.6"/>
  
  <!-- Additional small clouds in background -->
  <ellipse cx="50" cy="15" rx="6" ry="4" fill="#F5F5F5" opacity="0.7"/>
  <ellipse cx="50" cy="15" rx="5" ry="3" fill="#FFFFFF" opacity="0.7"/>
  
  <circle cx="45" cy="15" r="3" fill="#F5F5F5" opacity="0.7"/>
  <circle cx="45" cy="15" r="2.5" fill="#FFFFFF" opacity="0.7"/>
  
  <ellipse cx="10" cy="50" rx="4" ry="3" fill="#E6E6FA" opacity="0.6"/>
  <ellipse cx="10" cy="50" rx="3" ry="2" fill="#F0F8FF" opacity="0.6"/>
  
  <!-- Cloud motion lines -->
  <g stroke="#D3D3D3" stroke-width="1" stroke-linecap="round" opacity="0.4">
    <line x1="58" y1="25" x2="62" y2="25"/>
    <line x1="58" y1="27" x2="61" y2="27"/>
    <line x1="2" y1="40" x2="6" y2="40"/>
    <line x1="2" y1="42" x2="5" y2="42"/>
  </g>
</svg>