<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <circle cx="32" cy="32" r="30" fill="#E6F3FF" opacity="0.4"/>
  
  <!-- Snow cloud -->
  <ellipse cx="32" cy="22" rx="18" ry="10" fill="#D3D3D3"/>
  <ellipse cx="32" cy="22" rx="17" ry="9" fill="#E6E6E6"/>
  <ellipse cx="32" cy="22" rx="16" ry="8" fill="#F5F5F5"/>
  
  <!-- Cloud bumps for realistic shape -->
  <circle cx="17" cy="22" r="7" fill="#D3D3D3"/>
  <circle cx="17" cy="22" r="6" fill="#E6E6E6"/>
  <circle cx="17" cy="22" r="5" fill="#F5F5F5"/>
  
  <circle cx="26" cy="16" r="8" fill="#D3D3D3"/>
  <circle cx="26" cy="16" r="7" fill="#E6E6E6"/>
  <circle cx="26" cy="16" r="6" fill="#F5F5F5"/>
  
  <circle cx="38" cy="16" r="7" fill="#D3D3D3"/>
  <circle cx="38" cy="16" r="6" fill="#E6E6E6"/>
  <circle cx="38" cy="16" r="5" fill="#F5F5F5"/>
  
  <circle cx="47" cy="22" r="6" fill="#D3D3D3"/>
  <circle cx="47" cy="22" r="5" fill="#E6E6E6"/>
  <circle cx="47" cy="22" r="4" fill="#F5F5F5"/>
  
  <!-- Cloud highlights -->
  <ellipse cx="28" cy="18" rx="3" ry="2" fill="#FFFFFF" opacity="0.9"/>
  <ellipse cx="38" cy="18" rx="2.5" ry="1.5" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Snowflakes (large) -->
  <g fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5">
    <!-- Snowflake 1 -->
    <g transform="translate(20,35)">
      <line x1="-3" y1="0" x2="3" y2="0"/>
      <line x1="0" y1="-3" x2="0" y2="3"/>
      <line x1="-2.1" y1="-2.1" x2="2.1" y2="2.1"/>
      <line x1="-2.1" y1="2.1" x2="2.1" y2="-2.1"/>
      <circle cx="0" cy="0" r="0.8" fill="#FFFFFF"/>
      <circle cx="2" cy="0" r="0.3"/>
      <circle cx="-2" cy="0" r="0.3"/>
      <circle cx="0" cy="2" r="0.3"/>
      <circle cx="0" cy="-2" r="0.3"/>
    </g>
    
    <!-- Snowflake 2 -->
    <g transform="translate(35,40) rotate(30)">
      <line x1="-3" y1="0" x2="3" y2="0"/>
      <line x1="0" y1="-3" x2="0" y2="3"/>
      <line x1="-2.1" y1="-2.1" x2="2.1" y2="2.1"/>
      <line x1="-2.1" y1="2.1" x2="2.1" y2="-2.1"/>
      <circle cx="0" cy="0" r="0.8" fill="#FFFFFF"/>
      <circle cx="2" cy="0" r="0.3"/>
      <circle cx="-2" cy="0" r="0.3"/>
      <circle cx="0" cy="2" r="0.3"/>
      <circle cx="0" cy="-2" r="0.3"/>
    </g>
    
    <!-- Snowflake 3 -->
    <g transform="translate(45,38) rotate(60)">
      <line x1="-2.5" y1="0" x2="2.5" y2="0"/>
      <line x1="0" y1="-2.5" x2="0" y2="2.5"/>
      <line x1="-1.8" y1="-1.8" x2="1.8" y2="1.8"/>
      <line x1="-1.8" y1="1.8" x2="1.8" y2="-1.8"/>
      <circle cx="0" cy="0" r="0.6" fill="#FFFFFF"/>
      <circle cx="1.5" cy="0" r="0.25"/>
      <circle cx="-1.5" cy="0" r="0.25"/>
      <circle cx="0" cy="1.5" r="0.25"/>
      <circle cx="0" cy="-1.5" r="0.25"/>
    </g>
  </g>
  
  <!-- Medium snowflakes -->
  <g fill="#FFFFFF" stroke="#F0F0F0" stroke-width="0.3">
    <!-- Medium snowflake 1 -->
    <g transform="translate(25,45) rotate(45)">
      <line x1="-2" y1="0" x2="2" y2="0"/>
      <line x1="0" y1="-2" x2="0" y2="2"/>
      <line x1="-1.4" y1="-1.4" x2="1.4" y2="1.4"/>
      <line x1="-1.4" y1="1.4" x2="1.4" y2="-1.4"/>
      <circle cx="0" cy="0" r="0.5" fill="#FFFFFF"/>
    </g>
    
    <!-- Medium snowflake 2 -->
    <g transform="translate(40,48) rotate(15)">
      <line x1="-2" y1="0" x2="2" y2="0"/>
      <line x1="0" y1="-2" x2="0" y2="2"/>
      <line x1="-1.4" y1="-1.4" x2="1.4" y2="1.4"/>
      <line x1="-1.4" y1="1.4" x2="1.4" y2="-1.4"/>
      <circle cx="0" cy="0" r="0.5" fill="#FFFFFF"/>
    </g>
    
    <!-- Medium snowflake 3 -->
    <g transform="translate(15,42) rotate(75)">
      <line x1="-2" y1="0" x2="2" y2="0"/>
      <line x1="0" y1="-2" x2="0" y2="2"/>
      <line x1="-1.4" y1="-1.4" x2="1.4" y2="1.4"/>
      <line x1="-1.4" y1="1.4" x2="1.4" y2="-1.4"/>
      <circle cx="0" cy="0" r="0.5" fill="#FFFFFF"/>
    </g>
  </g>
  
  <!-- Small snowflakes -->
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="18" cy="38" r="1"/>
    <circle cx="28" cy="42" r="0.8"/>
    <circle cx="38" cy="36" r="1"/>
    <circle cx="48" cy="42" r="0.9"/>
    <circle cx="22" cy="50" r="0.7"/>
    <circle cx="32" cy="52" r="1"/>
    <circle cx="42" cy="54" r="0.8"/>
    <circle cx="52" cy="48" r="0.6"/>
    <circle cx="12" cy="48" r="0.9"/>
    <circle cx="30" cy="48" r="0.7"/>
    <circle cx="46" cy="50" r="0.8"/>
  </g>
  
  <!-- Tiny snow particles -->
  <g fill="#FFFFFF" opacity="0.7">
    <circle cx="16" cy="44" r="0.3"/>
    <circle cx="24" cy="38" r="0.4"/>
    <circle cx="34" cy="44" r="0.3"/>
    <circle cx="44" cy="40" r="0.4"/>
    <circle cx="50" cy="44" r="0.3"/>
    <circle cx="14" cy="52" r="0.3"/>
    <circle cx="26" cy="54" r="0.4"/>
    <circle cx="36" cy="50" r="0.3"/>
    <circle cx="48" cy="52" r="0.4"/>
    <circle cx="54" cy="50" r="0.3"/>
    <circle cx="20" cy="56" r="0.3"/>
    <circle cx="32" cy="58" r="0.4"/>
    <circle cx="44" cy="56" r="0.3"/>
  </g>
  
  <!-- Snow accumulation on ground -->
  <ellipse cx="32" cy="60" rx="25" ry="3" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="32" cy="60" rx="23" ry="2.5" fill="#F8F8FF"/>
  
  <!-- Small snow drifts -->
  <ellipse cx="15" cy="60" rx="8" ry="2" fill="#FFFFFF" opacity="0.7"/>
  <ellipse cx="49" cy="60" rx="10" ry="2.5" fill="#FFFFFF" opacity="0.7"/>
  
  <!-- Falling snow motion lines -->
  <g stroke="#E6E6E6" stroke-width="0.2" opacity="0.5">
    <line x1="12" y1="30" x2="10" y2="40"/>
    <line x1="22" y1="32" x2="20" y2="42"/>
    <line x1="32" y1="30" x2="30" y2="40"/>
    <line x1="42" y1="32" x2="40" y2="42"/>
    <line x1="52" y1="30" x2="50" y2="40"/>
  </g>
  
  <!-- Wind swirls in snow -->
  <g stroke="#F0F0F0" stroke-width="0.5" fill="none" opacity="0.4">
    <path d="M 8 45 Q 12 43 16 45 Q 20 47 24 45"/>
    <path d="M 40 47 Q 44 45 48 47 Q 52 49 56 47"/>
  </g>
</svg>