<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer glow -->
  <circle cx="16" cy="16" r="14" fill="#FFD700" opacity="0.1"/>
  <circle cx="16" cy="16" r="12" fill="#FFD700" opacity="0.15"/>
  <circle cx="16" cy="16" r="10" fill="#FFD700" opacity="0.2"/>
  <circle cx="16" cy="16" r="8" fill="#FFD700" opacity="0.3"/>
  
  <!-- Main particle body -->
  <circle cx="16" cy="16" r="6" fill="#FFD700" opacity="0.4"/>
  <circle cx="16" cy="16" r="5" fill="#FFA500" opacity="0.6"/>
  <circle cx="16" cy="16" r="4" fill="#FFD700" opacity="0.8"/>
  <circle cx="16" cy="16" r="3" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="16" cy="16" r="2" fill="#FFFFFF"/>
  
  <!-- Core sparkle -->
  <circle cx="16" cy="16" r="1.5" fill="#FFFFFF"/>
  <circle cx="16" cy="16" r="1" fill="#FFFF00"/>
  <circle cx="16" cy="16" r="0.5" fill="#FFFFFF"/>
  
  <!-- Star rays -->
  <g stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.8">
    <line x1="16" y1="4" x2="16" y2="8"/>
    <line x1="16" y1="24" x2="16" y2="28"/>
    <line x1="4" y1="16" x2="8" y2="16"/>
    <line x1="24" y1="16" x2="28" y2="16"/>
  </g>
  
  <!-- Diagonal rays -->
  <g stroke="#FFD700" stroke-width="0.8" stroke-linecap="round" opacity="0.7">
    <line x1="7.76" y1="7.76" x2="10.34" y2="10.34"/>
    <line x1="24.24" y1="7.76" x2="21.66" y2="10.34"/>
    <line x1="7.76" y1="24.24" x2="10.34" y2="21.66"/>
    <line x1="24.24" y1="24.24" x2="21.66" y2="21.66"/>
  </g>
  
  <!-- Additional sparkle rays -->
  <g stroke="#FFFFFF" stroke-width="0.5" stroke-linecap="round" opacity="0.6">
    <line x1="16" y1="6" x2="16" y2="9"/>
    <line x1="16" y1="23" x2="16" y2="26"/>
    <line x1="6" y1="16" x2="9" y2="16"/>
    <line x1="23" y1="16" x2="26" y2="16"/>
  </g>
  
  <!-- Floating sparkles around particle -->
  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="8" cy="8" r="0.5"/>
    <circle cx="24" cy="8" r="0.4"/>
    <circle cx="8" cy="24" r="0.6"/>
    <circle cx="24" cy="24" r="0.3"/>
  </g>
  
  <!-- Small sparkle crosses -->
  <g stroke="#FFFFFF" stroke-width="0.3" stroke-linecap="round" opacity="0.7">
    <line x1="7" y1="8" x2="9" y2="8"/>
    <line x1="8" y1="7" x2="8" y2="9"/>
    
    <line x1="23" y1="8" x2="25" y2="8"/>
    <line x1="24" y1="7" x2="24" y2="9"/>
    
    <line x1="7" y1="24" x2="9" y2="24"/>
    <line x1="8" y1="23" x2="8" y2="25"/>
    
    <line x1="23" y1="24" x2="25" y2="24"/>
    <line x1="24" y1="23" x2="24" y2="25"/>
  </g>
  
  <!-- Energy rings -->
  <circle cx="16" cy="16" r="7" fill="none" stroke="#FFD700" stroke-width="0.3" opacity="0.4"/>
  <circle cx="16" cy="16" r="9" fill="none" stroke="#FFA500" stroke-width="0.2" opacity="0.3"/>
  <circle cx="16" cy="16" r="11" fill="none" stroke="#FFD700" stroke-width="0.1" opacity="0.2"/>
  
  <!-- Pulsing effect (can be animated) -->
  <circle cx="16" cy="16" r="5" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.5">
    <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Rotating sparkles -->
  <g opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" values="0 16 16;360 16 16" dur="4s" repeatCount="indefinite"/>
    <circle cx="22" cy="16" r="0.8" fill="#FFFFFF"/>
    <circle cx="16" cy="10" r="0.6" fill="#FFD700"/>
    <circle cx="10" cy="16" r="0.7" fill="#FFFFFF"/>
    <circle cx="16" cy="22" r="0.5" fill="#FFA500"/>
  </g>
</svg>