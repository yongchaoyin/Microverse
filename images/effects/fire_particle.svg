<svg width="24" height="32" viewBox="0 0 24 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer flame glow -->
  <ellipse cx="12" cy="26" rx="10" ry="4" fill="#FF4500" opacity="0.2"/>
  <ellipse cx="12" cy="26" rx="8" ry="3" fill="#FF6347" opacity="0.3"/>
  
  <!-- Main flame body -->
  <path d="M 12 28 Q 6 24 8 18 Q 10 12 12 16 Q 14 8 16 14 Q 18 20 12 28 Z" fill="#FF4500"/>
  <path d="M 12 26 Q 7 22 9 17 Q 11 12 12 15 Q 13 9 15 13 Q 17 19 12 26 Z" fill="#FF6347"/>
  <path d="M 12 24 Q 8 20 10 16 Q 11 13 12 14 Q 13 10 14 12 Q 16 18 12 24 Z" fill="#FF8C00"/>
  
  <!-- Inner flame -->
  <path d="M 12 22 Q 9 18 10 15 Q 11 13 12 14 Q 13 11 14 13 Q 15 17 12 22 Z" fill="#FFA500"/>
  <path d="M 12 20 Q 10 17 11 15 Q 11.5 13.5 12 14 Q 12.5 12 13 13 Q 14 16 12 20 Z" fill="#FFD700"/>
  
  <!-- Core flame -->
  <path d="M 12 18 Q 10.5 16 11 14.5 Q 11.5 13.5 12 14 Q 12.5 12.5 13 13.5 Q 13.5 15.5 12 18 Z" fill="#FFFF00"/>
  <path d="M 12 16 Q 11 15 11.5 14 Q 11.8 13.5 12 13.8 Q 12.2 13 12.5 13.5 Q 13 14.5 12 16 Z" fill="#FFFFFF"/>
  
  <!-- Flame flickers -->
  <g opacity="0.8">
    <path d="M 8 20 Q 6 18 7 16 Q 8 15 8.5 16 Q 9 14 9.5 15 Q 10 17 8 20 Z" fill="#FF6347">
      <animateTransform attributeName="transform" type="scale" values="1;1.2;1" dur="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 16 20 Q 18 18 17 16 Q 16 15 15.5 16 Q 15 14 14.5 15 Q 14 17 16 20 Z" fill="#FF6347">
      <animateTransform attributeName="transform" type="scale" values="1;0.8;1" dur="0.7s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Small flame tongues -->
  <g opacity="0.7">
    <path d="M 10 12 Q 8 10 9 8 Q 10 7 10.5 8 Q 11 6 11.5 7 Q 12 9 10 12 Z" fill="#FF8C00">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="0.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 14 12 Q 16 10 15 8 Q 14 7 13.5 8 Q 13 6 12.5 7 Q 12 9 14 12 Z" fill="#FF8C00">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1s" begin="0.3s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Sparks -->
  <g fill="#FFD700" opacity="0.9">
    <circle cx="6" cy="16" r="0.5">
      <animate attributeName="cy" values="16;8;16" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="18" cy="18" r="0.4">
      <animate attributeName="cy" values="18;10;18" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="10" cy="8" r="0.3">
      <animate attributeName="cy" values="8;2;8" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="14" cy="6" r="0.4">
      <animate attributeName="cy" values="6;1;6" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Ember particles -->
  <g fill="#FF4500" opacity="0.6">
    <circle cx="4" cy="20" r="0.8">
      <animate attributeName="cy" values="20;5;20" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="4;2;4" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="22" r="0.6">
      <animate attributeName="cy" values="22;7;22" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="20;22;20" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Heat distortion lines -->
  <g stroke="#FF8C00" stroke-width="0.5" fill="none" opacity="0.4">
    <path d="M 12 28 Q 11 26 12 24 Q 13 22 12 20">
      <animate attributeName="d" values="M 12 28 Q 11 26 12 24 Q 13 22 12 20;M 12 28 Q 13 26 12 24 Q 11 22 12 20;M 12 28 Q 11 26 12 24 Q 13 22 12 20" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 10 26 Q 9 24 10 22 Q 11 20 10 18">
      <animate attributeName="d" values="M 10 26 Q 9 24 10 22 Q 11 20 10 18;M 10 26 Q 11 24 10 22 Q 9 20 10 18;M 10 26 Q 9 24 10 22 Q 11 20 10 18" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 14 26 Q 15 24 14 22 Q 13 20 14 18">
      <animate attributeName="d" values="M 14 26 Q 15 24 14 22 Q 13 20 14 18;M 14 26 Q 13 24 14 22 Q 15 20 14 18;M 14 26 Q 15 24 14 22 Q 13 20 14 18" dur="0.9s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Flame base -->
  <ellipse cx="12" cy="28" rx="4" ry="1.5" fill="#8B0000" opacity="0.5"/>
  <ellipse cx="12" cy="28" rx="3" ry="1" fill="#A0522D" opacity="0.6"/>
</svg>