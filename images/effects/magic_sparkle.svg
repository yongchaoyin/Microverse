<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Main sparkle star -->
  <g fill="#FFFFFF" stroke="#FFD700" stroke-width="0.5">
    <!-- Large star shape -->
    <path d="M 12 2 L 13.5 8.5 L 20 8.5 L 15 12.5 L 16.5 19 L 12 15 L 7.5 19 L 9 12.5 L 4 8.5 L 10.5 8.5 Z"/>
  </g>
  
  <!-- Inner star -->
  <g fill="#FFFF00" stroke="#FFA500" stroke-width="0.3">
    <path d="M 12 4 L 13 9 L 18 9 L 14 12 L 15 17 L 12 14 L 9 17 L 10 12 L 6 9 L 11 9 Z"/>
  </g>
  
  <!-- Core -->
  <circle cx="12" cy="12" r="2" fill="#FFFFFF"/>
  <circle cx="12" cy="12" r="1.5" fill="#FFFF00"/>
  <circle cx="12" cy="12" r="1" fill="#FFFFFF"/>
  
  <!-- Cross rays -->
  <g stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9">
    <line x1="12" y1="1" x2="12" y2="4"/>
    <line x1="12" y1="20" x2="12" y2="23"/>
    <line x1="1" y1="12" x2="4" y2="12"/>
    <line x1="20" y1="12" x2="23" y2="12"/>
  </g>
  
  <!-- Diagonal rays -->
  <g stroke="#FFD700" stroke-width="1" stroke-linecap="round" opacity="0.8">
    <line x1="4.93" y1="4.93" x2="6.64" y2="6.64"/>
    <line x1="19.07" y1="4.93" x2="17.36" y2="6.64"/>
    <line x1="4.93" y1="19.07" x2="6.64" y2="17.36"/>
    <line x1="19.07" y1="19.07" x2="17.36" y2="17.36"/>
  </g>
  
  <!-- Additional sparkle points -->
  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="6" cy="6" r="0.8"/>
    <circle cx="18" cy="6" r="0.6"/>
    <circle cx="6" cy="18" r="0.7"/>
    <circle cx="18" cy="18" r="0.5"/>
  </g>
  
  <!-- Small crosses around main sparkle -->
  <g stroke="#FFFFFF" stroke-width="0.5" stroke-linecap="round" opacity="0.7">
    <!-- Top left -->
    <line x1="5" y1="6" x2="7" y2="6"/>
    <line x1="6" y1="5" x2="6" y2="7"/>
    
    <!-- Top right -->
    <line x1="17" y1="6" x2="19" y2="6"/>
    <line x1="18" y1="5" x2="18" y2="7"/>
    
    <!-- Bottom left -->
    <line x1="5" y1="18" x2="7" y2="18"/>
    <line x1="6" y1="17" x2="6" y2="19"/>
    
    <!-- Bottom right -->
    <line x1="17" y1="18" x2="19" y2="18"/>
    <line x1="18" y1="17" x2="18" y2="19"/>
  </g>
  
  <!-- Tiny sparkles -->
  <g fill="#FFD700" opacity="0.6">
    <circle cx="3" cy="9" r="0.3"/>
    <circle cx="21" cy="9" r="0.4"/>
    <circle cx="3" cy="15" r="0.3"/>
    <circle cx="21" cy="15" r="0.3"/>
    <circle cx="9" cy="3" r="0.4"/>
    <circle cx="15" cy="3" r="0.3"/>
    <circle cx="9" cy="21" r="0.3"/>
    <circle cx="15" cy="21" r="0.4"/>
  </g>
  
  <!-- Glow effect -->
  <circle cx="12" cy="12" r="8" fill="none" stroke="#FFFFFF" stroke-width="0.2" opacity="0.3"/>
  <circle cx="12" cy="12" r="6" fill="none" stroke="#FFD700" stroke-width="0.3" opacity="0.4"/>
  <circle cx="12" cy="12" r="4" fill="none" stroke="#FFFFFF" stroke-width="0.4" opacity="0.5"/>
  
  <!-- Animated twinkle -->
  <g opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" values="0 12 12;360 12 12" dur="3s" repeatCount="indefinite"/>
    <circle cx="16" cy="8" r="0.5" fill="#FFFFFF"/>
    <circle cx="8" cy="16" r="0.4" fill="#FFD700"/>
    <circle cx="16" cy="16" r="0.3" fill="#FFFFFF"/>
    <circle cx="8" cy="8" r="0.4" fill="#FFFF00"/>
  </g>
  
  <!-- Pulsing core -->
  <circle cx="12" cy="12" r="0.8" fill="#FFFFFF">
    <animate attributeName="r" values="0.8;1.2;0.8" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>