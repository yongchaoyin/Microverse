<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer energy field -->
  <circle cx="24" cy="24" r="22" fill="#4169E1" opacity="0.1"/>
  <circle cx="24" cy="24" r="20" fill="#4169E1" opacity="0.15"/>
  <circle cx="24" cy="24" r="18" fill="#6495ED" opacity="0.2"/>
  <circle cx="24" cy="24" r="16" fill="#87CEEB" opacity="0.25"/>
  
  <!-- Main orb body -->
  <circle cx="24" cy="24" r="14" fill="#4169E1" opacity="0.4"/>
  <circle cx="24" cy="24" r="12" fill="#6495ED" opacity="0.6"/>
  <circle cx="24" cy="24" r="10" fill="#87CEEB" opacity="0.8"/>
  <circle cx="24" cy="24" r="8" fill="#B0E0E6"/>
  
  <!-- Inner core -->
  <circle cx="24" cy="24" r="6" fill="#E0F6FF"/>
  <circle cx="24" cy="24" r="4" fill="#FFFFFF"/>
  <circle cx="24" cy="24" r="2" fill="#E0F6FF"/>
  
  <!-- Energy swirls -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.7">
    <path d="M 24 10 Q 30 16 24 24 Q 18 32 24 38">
      <animateTransform attributeName="transform" type="rotate" values="0 24 24;360 24 24" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 10 24 Q 16 18 24 24 Q 32 30 38 24">
      <animateTransform attributeName="transform" type="rotate" values="0 24 24;-360 24 24" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Energy swirls (secondary) -->
  <g fill="none" stroke="#87CEEB" stroke-width="0.8" opacity="0.6">
    <path d="M 24 12 Q 28 18 24 24 Q 20 30 24 36">
      <animateTransform attributeName="transform" type="rotate" values="120 24 24;480 24 24" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 12 24 Q 18 20 24 24 Q 30 28 36 24">
      <animateTransform attributeName="transform" type="rotate" values="240 24 24;-120 24 24" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Lightning/energy bolts -->
  <g stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M 18 18 L 20 16 L 18 14 L 22 12">
      <animate attributeName="opacity" values="0;1;0" dur="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 30 30 L 28 32 L 30 34 L 26 36">
      <animate attributeName="opacity" values="0;1;0" dur="0.7s" begin="0.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 30 18 L 32 20 L 34 18 L 36 22">
      <animate attributeName="opacity" values="0;1;0" dur="0.6s" begin="0.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 18 30 L 16 28 L 14 30 L 12 26">
      <animate attributeName="opacity" values="0;1;0" dur="0.8s" begin="0.1s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Floating energy particles -->
  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="32" cy="16" r="1">
      <animateTransform attributeName="transform" type="rotate" values="0 24 24;360 24 24" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="16" cy="32" r="0.8">
      <animateTransform attributeName="transform" type="rotate" values="180 24 24;540 24 24" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="32" cy="32" r="0.6">
      <animateTransform attributeName="transform" type="rotate" values="90 24 24;450 24 24" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="16" cy="16" r="0.7">
      <animateTransform attributeName="transform" type="rotate" values="270 24 24;-90 24 24" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Energy rings -->
  <g fill="none" stroke="#87CEEB" stroke-width="0.5" opacity="0.5">
    <circle cx="24" cy="24" r="15">
      <animate attributeName="r" values="15;17;15" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="24" cy="24" r="19">
      <animate attributeName="r" values="19;21;19" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Core pulsing -->
  <circle cx="24" cy="24" r="3" fill="#FFFFFF" opacity="0.9">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Highlight -->
  <ellipse cx="20" cy="18" rx="3" ry="4" fill="#FFFFFF" opacity="0.6"/>
  <ellipse cx="20" cy="18" rx="2" ry="3" fill="#FFFFFF" opacity="0.4"/>
  
  <!-- Energy discharge -->
  <g stroke="#FFFFFF" stroke-width="0.8" fill="none" opacity="0.6">
    <line x1="24" y1="2" x2="24" y2="6">
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="24" y1="42" x2="24" y2="46">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="2" y1="24" x2="6" y2="24">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.25s" repeatCount="indefinite"/>
    </line>
    <line x1="42" y1="24" x2="46" y2="24">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.75s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>